          ctx.arc(x + w - 6, y + w - 6, 2, 0, Math.PI*2);
          ctx.fill();
        } else {
          ctx.beginPath();
          ctx.arc(x + 6, y + 6, 2, 0, Math.PI*2);
          ctx.arc(x + w - 6, y + 6, 2, 0, Math.PI*2);
          ctx.fill();
        }
      } else {
        const gVal = 220 - t * 130;
        const bVal = 60 + t * 40;
        const r = 30 + t * 60;
        const grd = ctx.createLinearGradient(x, y, x + w, y + w);
        grd.addColorStop(0, `rgb(${r|0}, ${gVal|0}, ${bVal|0})`);
        grd.addColorStop(1, `rgb(${r/2|0}, ${gVal*0.7|0}, ${bVal/2|0})`);
        ctx.fillStyle = grd;
        ctx.fillRect(x, y, w, w);
        ctx.strokeStyle = `rgba(20,60,20,0.7)`;
        ctx.lineWidth = 1;
        ctx.strokeRect(x+0.5, y+0.5, w-1, w-1);
      }
    });
    s.particles.forEach(pt => {
      const alpha = Math.max(0, pt.life / (pt.maxLife || 0.5));
      ctx.globalAlpha = alpha;
      ctx.fillStyle = pt.color;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI*2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
    if (!s.alive) {
      ctx.fillStyle = 'rgba(0,0,0,0.75)';
      ctx.fillRect(0, s.H/2-80, s.W, 160);
      if (s.score >= 200) {
        ctx.fillStyle = '#4dffa3';
        ctx.font = 'bold 32px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('ПОЛЕ ПРОЙДЕНО', s.W/2, s.H/2);
      } else {
        ctx.fillStyle = '#ff4d6d';
        ctx.font = 'bold 34px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', s.W/2, s.H/2);
        ctx.fillStyle = '#fff';
        ctx.font = '18px monospace';
        ctx.fillText(`Очки: ${s.score}`, s.W/2, s.H/2+34);
      }
    }
  },

  serialize(s) {
    return {
      startLevel: s.level, score: s.score,
      snake: s.snake, dir: s.dir,
      preview: `Змейка: ${s.fieldName}, ${s.score}`
    };
  }
};

/* ============================================================
 * BREAKOUT — 8 уровней + бонусы
 * ============================================================ */
const BreakoutGame = {
  init(load) {
    const W = 480, H = 600;
    const level = (load && load.startLevel ? load.startLevel : 1);
    const s = {
      W, H, level, totalLevels: 8,
      paddle: { x: W/2-50, w:100, h:14, y: H-30 },
      balls: [], bricks: [], powerups: [],
      score: 0, lives: 3,
      alive: true, combo: 0, hud: '',
      particles: [], deathAnim: 0
    };
    if (load) {
      if (load.score) s.score = load.score;
      if (load.lives) s.lives = load.lives;
    }
    this.buildLevel(s, level);
    this.resetBall(s);
    return s;
  },
  resetBall(s) {
    s.balls = [{
      x: s.paddle.x + s.paddle.w/2, y: s.paddle.y - 20,
      vx: 180*(Math.random() > 0.5 ? 1 : -1),
      vy: -220, r: 7
    }];
  },
  buildLevel(s, level) {
    s.bricks = [];
    const cols = 10;
    const rows = 3 + level;
    const bw = (s.W-40)/cols;
    const bh = 20;
    const colors = ['#ff4d6d','#ffb84d','#ffcf40','#4dffa3','#4dcfff','#b84dff','#ff6a9a'];
    const patterns = [
      (r,c,rows,cols) => true,
      (r,c,rows,cols) => r < rows - 1,
      (r,c,rows,cols) => (r + c) % 2 === 0,
      (r,c,rows,cols) => r !== Math.floor(rows/2),
      (r,c,rows,cols) => Math.abs(c - cols/2) > r,
      (r,c,rows,cols) => c % 2 === 0 || r % 2 === 0,
      (r,c,rows,cols) => Math.abs(c - cols/2) + r < cols/2 + 1,
      (r,c,rows,cols) => r === 0 || r === rows-1 || c === 0 || c === cols-1
    ];
    const pat = patterns[(level - 1) % patterns.length];
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        if (!pat(r, c, rows, cols)) continue;
        const hp = 1 + Math.floor(r/3) + Math.floor(level/4);
        s.bricks.push({
          x: 20+c*bw, y: 60+r*(bh+6),
          w: bw-4, h: bh,
          hp, maxHp: hp,
          color: colors[(r + level) % colors.length],
          hitFlash: 0
        });
      }
    }
  },
  spawnPowerup(s, x, y) {
    const types = ['wide', 'ball', 'life', 'slow'];
    const type = types[Math.floor(Math.random() * types.length)];
    s.powerups.push({ x, y, vy: 100, r: 12, type, bob: 0 });
  },
  update(dt, s) {
    if (!s.alive) {
      s.deathAnim += dt;
      for (let i = s.particles.length-1; i >= 0; i--) {
        const p = s.particles[i];
        p.x += p.vx*dt; p.y += p.vy*dt; p.life -= dt;
        if (p.life <= 0) s.particles.splice(i, 1);
      }
      return;
    }
    const K = Game.K;
    const m = Game.mouse();
    if (K('ArrowLeft','KeyA')) s.paddle.x -= 400*dt;
    if (K('ArrowRight','KeyD')) s.paddle.x += 400*dt;
    if (m.x > 0 && m.x < s.W && (m.down || Math.abs(m.x - (s.paddle.x + s.paddle.w/2)) > 2)) {
      const targetX = m.x - s.paddle.w/2;
      s.paddle.x += (targetX - s.paddle.x) * Math.min(1, 12*dt);
    }
    s.paddle.x = Math.max(0, Math.min(s.W - s.paddle.w, s.paddle.x));

    for (const b of s.balls) {
      b.x += b.vx*dt;
      b.y += b.vy*dt;
      if (b.x-b.r < 0) {
        b.x = b.r; b.vx = Math.abs(b.vx);
        Game.beep(600, 0.03);
        GFX.spawnParticles(s.particles, b.x, b.y, 4,
          { color:'#4dcfff', size:2, life:0.3, speed:100 });
      }
      if (b.x+b.r > s.W) {
        b.x = s.W-b.r; b.vx = -Math.abs(b.vx);
        Game.beep(600, 0.03);
        GFX.spawnParticles(s.particles, b.x, b.y, 4,
          { color:'#4dcfff', size:2, life:0.3, speed:100 });
      }
      if (b.y-b.r < 0) {
        b.y = b.r; b.vy = Math.abs(b.vy);
        Game.beep(600, 0.03);
      }
      if (b.y+b.r > s.paddle.y && b.y-b.r < s.paddle.y+s.paddle.h &&
          b.x > s.paddle.x && b.x < s.paddle.x+s.paddle.w && b.vy > 0) {
        b.vy = -Math.abs(b.vy);
        const hit = (b.x - (s.paddle.x+s.paddle.w/2))/(s.paddle.w/2);
        b.vx = hit*300;
        Game.beep(800, 0.05);
        s.combo = 0;
      }
      for (let i = s.bricks.length-1; i >= 0; i--) {
        const br = s.bricks[i];
        if (b.x+b.r > br.x && b.x-b.r < br.x+br.w &&
            b.y+b.r > br.y && b.y-b.r < br.y+br.h) {
          const ox = Math.min(Math.abs(b.x-br.x), Math.abs(b.x-(br.x+br.w)));
          const oy = Math.min(Math.abs(b.y-br.y), Math.abs(b.y-(br.y+br.h)));
          if (ox < oy) b.vx *= -1; else b.vy *= -1;
          br.hp--;
          br.hitFlash = 0.15;
          s.score += 10;
          s.combo++;
          Game.beep(1000 + s.combo * 50, 0.05);
          Game.screenShake(2, 0.08);
          GFX.spawnParticles(s.particles, b.x + br.w/2, b.y + br.h/2, 6,
            { color: br.color, size:3, life:0.4, speed:180 });
          if (s.combo === 5) unlock('breakout','a4');
          if (s.score >= 10) unlock('breakout','a1');
          if (s.score >= 500) unlock('breakout','a2');
          if (br.hp <= 0) {
            if (Math.random() < 0.15) {
              this.spawnPowerup(s, br.x + br.w/2, br.y + br.h/2);
            }
            s.bricks.splice(i, 1);
          }
          break;
        }
      }
    }
    for (const br of s.bricks) br.hitFlash = Math.max(0, br.hitFlash - dt);

    for (let i = s.powerups.length-1; i >= 0; i--) {
      const pu = s.powerups[i];
      pu.y += pu.vy * dt;
      pu.bob += dt * 6;
      if (pu.y > s.H + 20) { s.powerups.splice(i, 1); continue; }
      if (pu.y + pu.r > s.paddle.y && pu.y - pu.r < s.paddle.y + s.paddle.h &&
          pu.x > s.paddle.x && pu.x < s.paddle.x + s.paddle.w) {
        Game.beep(1500, 0.15, 'sine');
        GFX.spawnParticles(s.particles, pu.x, pu.y, 12,
          { color:'#ffcf40', size:3, life:0.5, speed:150 });
        if (pu.type === 'wide') {
          s.paddle.w = Math.min(s.W - 20, s.paddle.w + 30);
          toast('Расширение платформы!');
          setTimeout(() => { if (s) s.paddle.w = Math.max(80, s.paddle.w - 30); }, 8000);
        } else if (pu.type === 'ball') {
          const baseBall = s.balls[0];
          if (baseBall) {
            s.balls.push({
              x: baseBall.x, y: baseBall.y,
              vx: -baseBall.vx, vy: baseBall.vy, r: 7
            });
            toast('Двойной мяч!');
          }
        } else if (pu.type === 'life') {
          s.lives++;
          toast('+1 жизнь');
        } else if (pu.type === 'slow') {
          for (const b of s.balls) { b.vx *= 0.7; b.vy *= 0.7; }
          toast('Замедление');
        }
        s.powerups.splice(i, 1);
      }
    }

    s.balls = s.balls.filter(b => b.y-b.r < s.H);
    if (s.balls.length === 0 && s.alive) {
      s.lives--;
      Game.beep(200, 0.4, 'sawtooth');
      Game.screenShake(8, 0.3);
      if (s.lives <= 0) { s.alive = false; s.deathAnim = 0; }
      else this.resetBall(s);
    }
    if (s.bricks.length === 0 && s.alive) {
      unlockLevel('breakout', s.level + 1);
      if (s.level >= 4) unlock('breakout','a3');
      Game.checkpoint(this.serialize(s));
      toast(`Уровень ${s.level} пройден!`, 'gold');
      if (s.level < 8) {
        setTimeout(() => Game.restart('breakout', {
          startLevel: s.level + 1, score: s.score, lives: s.lives
        }), 1500);
        s.alive = false;
      } else {
        toast('🏆 ВСЕ УРОВНИ ПРОЙДЕНЫ!', 'gold');
        s.alive = false;
      }
    }
    for (let i = s.particles.length-1; i >= 0; i--) {
      const pt = s.particles[i];
      pt.x += pt.vx*dt; pt.y += pt.vy*dt; pt.life -= dt;
      pt.vx *= 0.95; pt.vy *= 0.95;
      if (pt.life <= 0) s.particles.splice(i, 1);
    }
    s.hud = `Очки: ${s.score} | ❤ ${s.lives} | Ур: ${s.level}/8`;
  },
  render(ctx, s) {
    const grd = ctx.createLinearGradient(0, 0, 0, s.H);
    grd.addColorStop(0, '#0a0a1a');
    grd.addColorStop(1, '#1a0a2a');
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, s.W, s.H);
    s.bricks.forEach(br => {
      const alpha = 0.4 + 0.6 * (br.hp / br.maxHp);
      ctx.globalAlpha = alpha;
      GFX.rectGrad(ctx, br.x, br.y, br.w, br.h, br.color, '#000');
      if (br.hitFlash > 0) {
        ctx.fillStyle = `rgba(255,255,255,${br.hitFlash * 4})`;
        ctx.fillRect(br.x, br.y, br.w, br.h);
      }
      ctx.globalAlpha = 1;
      ctx.strokeStyle = 'rgba(255,255,255,0.3)';
      ctx.lineWidth = 1;
      ctx.strokeRect(br.x+0.5, br.y+0.5, br.w-1, br.h-1);
      ctx.fillStyle = 'rgba(255,255,255,0.25)';
      ctx.fillRect(br.x+2, br.y+2, br.w-4, 3);
    });
    s.powerups.forEach(pu => {
      const bob = Math.sin(pu.bob) * 2;
      ctx.shadowBlur = 12;
      ctx.shadowColor = '#ffcf40';
      GFX.circleGrad(ctx, pu.x, pu.y + bob, pu.r, '#ffe680', '#cc9900');
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#000';
      ctx.font = 'bold 12px monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const sym = { wide:'=', ball:'●', life:'+', slow:'▼' }[pu.type] || '?';
      ctx.fillText(sym, pu.x, pu.y + bob);
    });
    ctx.shadowBlur = 18;
    ctx.shadowColor = '#00e0ff';
    GFX.rectGrad(ctx, s.paddle.x, s.paddle.y, s.paddle.w, s.paddle.h, '#66f0ff', '#0088cc');
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.fillRect(s.paddle.x+2, s.paddle.y+2, s.paddle.w-4, 3);
    s.balls.forEach(b => {
      ctx.shadowBlur = 18;
      ctx.shadowColor = '#fff';
      GFX.circleGrad(ctx, b.x, b.y, b.r, '#ffffff', '#888888');
      ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(255,255,255,0.8)';
      ctx.beginPath();
      ctx.arc(b.x - 2, b.y - 2, 2, 0, Math.PI*2);
      ctx.fill();
    });
    s.particles.forEach(pt => {
      const alpha = Math.max(0, pt.life / (pt.maxLife || 0.5));
      ctx.globalAlpha = alpha;
      ctx.fillStyle = pt.color;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI*2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
    if (!s.alive) {
      ctx.fillStyle = 'rgba(0,0,0,0.8)';
      ctx.fillRect(0, s.H/2-80, s.W, 160);
      if (s.level >= 8 && s.bricks.length === 0) {
        ctx.fillStyle = '#4dffa3';
        ctx.font = 'bold 32px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('🏆 ПОБЕДА!', s.W/2, s.H/2);
      } else {
        ctx.fillStyle = '#ff4d6d';
        ctx.font = 'bold 36px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', s.W/2, s.H/2);
        ctx.fillStyle = '#fff';
        ctx.font = '18px monospace';
        ctx.fillText(`Очки: ${s.score}`, s.W/2, s.H/2+36);
      }
    }
  },
  serialize(s) {
    return {
      startLevel: s.level, score: s.score, lives: s.lives,
      preview: `Breakout: ур.${s.level}/8`
    };
  }
};

/* ============================================================
 * SPACE SHOOTER — 5 зон
 * ============================================================ */
const SpaceGame = {
  init(load) {
    const W = 480, H = 640;
    const level = (load && load.startLevel ? load.startLevel : 1);
    const s = {
      W, H, level, totalLevels: 5,
      zoneName: ['Млечный Путь','Туманность','Пояс астероидов','Ядро галактики','Край вселенной'][level-1],
      ship: { x: W/2, y: H-60, w:30, h:30, cd:0, speed:320, hitFlash:0, anim:0 },
      bullets: [], enemies: [], enemyBullets: [], stars: [],
      score: 0, kills: 0, wave: 1, spawnTimer: 1,
      alive: true, hud: '', particles: [], deathAnim: 0,
      zoneKills: 30 + level * 5
    };
    for (let i = 0; i < 80; i++) {
      s.stars.push({
        x: Math.random()*W, y: Math.random()*H,
        speed: 20+Math.random()*80, size: 1+Math.random()*2.5,
        color: Math.random() > 0.8 ? '#ffcc66' : '#ffffff'
      });
    }
    if (load) {
      if (load.score) s.score = load.score;
      if (load.kills) s.kills = load.kills;
    }
    return s;
  },
  update(dt, s) {
    if (!s.alive) {
      s.deathAnim += dt;
      for (let i = s.particles.length-1; i >= 0; i--) {
        const p = s.particles[i];
        p.x += p.vx*dt; p.y += p.vy*dt; p.life -= dt;
        if (p.life <= 0) s.particles.splice(i, 1);
      }
      return;
    }
    const K = Game.K;
    const m = Game.mouse();
    const p = s.ship;
    p.hitFlash = Math.max(0, p.hitFlash - dt);
    p.anim += dt * 10;
    let dx = 0, dy = 0;
    if (K('KeyA','ArrowLeft')) dx--;
    if (K('KeyD','ArrowRight')) dx++;
    if (K('KeyW','ArrowUp')) dy--;
    if (K('KeyS','ArrowDown')) dy++;
    p.x += dx*p.speed*dt;
    p.y += dy*p.speed*dt;
    if (m.x > 0 && m.x < s.W && m.y > 0 && m.y < s.H) {
      p.x += (m.x - p.x) * Math.min(1, 8*dt);
      p.y += (m.y - p.y) * Math.min(1, 8*dt);
    }
    p.x = Math.max(p.w/2, Math.min(s.W-p.w/2, p.x));
    p.y = Math.max(p.h/2, Math.min(s.H-p.h/2, p.y));
    p.cd -= dt;
    if ((K('Space') || m.down) && p.cd <= 0) {
      p.cd = 0.15;
      s.bullets.push({ x: p.x, y: p.y-15, vy: -600 });
      Game.beep(900, 0.04, 'square', 0.03);
      GFX.spawnParticles(s.particles, p.x, p.y - 15, 2,
        { color:'#0ff', size:2, life:0.15, speed:60, direction:-Math.PI/2, spread:0.5 });
    }
    s.stars.forEach(st => {
      st.y += st.speed*dt;
      if (st.y > s.H) { st.y = 0; st.x = Math.random()*s.W; }
    });
    for (let i = s.bullets.length-1; i >= 0; i--) {
      const b = s.bullets[i];
      b.y += b.vy*dt;
      if (b.y < -10) { s.bullets.splice(i, 1); continue; }
      for (let j = s.enemies.length-1; j >= 0; j--) {
        const e = s.enemies[j];
        if (Math.hypot(b.x-e.x, b.y-e.y) < e.r+3) {
          e.hp--;
          e.hitFlash = 0.1;
          s.bullets.splice(i, 1);
          Game.beep(600, 0.05);
          GFX.spawnParticles(s.particles, e.x, e.y, 5,
            { color:'#ffea00', size:3, life:0.3, speed:150 });
          if (e.hp <= 0) {
            s.enemies.splice(j, 1);
            s.score += 10;
            s.kills++;
            Game.screenShake(2, 0.08);
            GFX.spawnParticles(s.particles, e.x, e.y, 12,
              { color: e.type === 'shooter' ? '#ff44dd' : '#ff4d6d', size:4, life:0.5, speed:200 });
            if (s.kills === 1) unlock('space','a1');
            if (s.kills === 50) unlock('space','a2');
            if (s.kills % 10 === 0) Game.checkpoint(this.serialize(s));
          }
          break;
        }
      }
    }
    s.spawnTimer -= dt;
    if (s.spawnTimer <= 0) {
      s.spawnTimer = Math.max(0.3, 1.2 - s.wave*0.05 - s.level*0.1);
      s.enemies.push({
        x: 40 + Math.random()*(s.W-80), y: -30,
        r: 16, hp: 1 + Math.floor(s.level/2) + Math.floor(s.wave/3),
        vy: 60+s.wave*8+s.level*5,
        cd: 1+Math.random(),
        type: Math.random() > 0.7 ? 'shooter' : 'basic',
        hitFlash: 0, anim: Math.random()*10
      });
    }
    for (let i = s.enemies.length-1; i >= 0; i--) {
      const e = s.enemies[i];
      e.anim += dt * 6;
      e.hitFlash = Math.max(0, e.hitFlash - dt);
      e.y += e.vy*dt;
      e.x += Math.sin(e.y/40)*30*dt;
      if (e.y > s.H+30) { s.enemies.splice(i, 1); continue; }
      if (e.type === 'shooter') {
        e.cd -= dt;
        if (e.cd <= 0) {
          e.cd = 1.5;
          s.enemyBullets.push({ x:e.x, y:e.y+15, vx:0, vy:250 });
        }
      }
      if (Math.hypot(e.x-p.x, e.y-p.y) < e.r+15 && p.hitFlash <= 0) {
        s.alive = false; s.deathAnim = 0;
        Game.beep(150, 0.4, 'sawtooth');
        Game.screenShake(10, 0.4);
        GFX.spawnParticles(s.particles, p.x, p.y, 20,
          { color:'#00e0ff', size:4, life:0.8, speed:250 });
      }
    }
    for (let i = s.enemyBullets.length-1; i >= 0; i--) {
      const b = s.enemyBullets[i];
      b.x += b.vx*dt; b.y += b.vy*dt;
      if (b.y > s.H+10) { s.enemyBullets.splice(i, 1); continue; }
      if (Math.hypot(b.x-p.x, b.y-p.y) < 15 && p.hitFlash <= 0) {
        s.alive = false; s.deathAnim = 0;
        Game.beep(150, 0.4, 'sawtooth');
        Game.screenShake(10, 0.4);
      }
    }
    if (s.kills >= s.zoneKills && s.level < 5) {
      unlockLevel('space', s.level + 1);
      toast(`Зона "${s.zoneName}" пройдена!`, 'gold');
      Game.checkpoint(this.serialize(s));
      if (s.level === 3) unlock('space','a3');
      setTimeout(() => Game.restart('space', {
        startLevel: s.level + 1, score: s.score, kills: s.kills
      }), 1500);
      s.alive = false;
      return;
    }
    if (s.kills >= s.zoneKills && s.level === 5) {
      unlock('space','a4');
      toast('🏆 ВСЕ ЗОНЫ ПРОЙДЕНЫ!', 'gold');
      s.alive = false;
      return;
    }
    const newWave = 1 + Math.floor(s.kills / 15);
    if (newWave > s.wave) s.wave = newWave;
    for (let i = s.particles.length-1; i >= 0; i--) {
      const pt = s.particles[i];
      pt.x += pt.vx*dt; pt.y += pt.vy*dt; pt.life -= dt;
      pt.vx *= 0.95; pt.vy *= 0.95;
      if (pt.life <= 0) s.particles.splice(i, 1);
    }
    s.hud = `Очки: ${s.score} | Зона ${s.level}/5 | Убийств: ${s.kills}/${s.zoneKills}`;
  },
  render(ctx, s) {
    const bgColors = [
      ['#000020','#000000'], ['#100020','#000010'],
      ['#200018','#000008'], ['#200000','#080000'],
      ['#000008','#100010']
    ];
    const [c1, c2] = bgColors[(s.level - 1) % 5];
    const grd = ctx.createLinearGradient(0, 0, 0, s.H);
    grd.addColorStop(0, c1);
    grd.addColorStop(1, c2);
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, s.W, s.H);
    s.stars.forEach(st => {
      ctx.fillStyle = st.color;
      ctx.globalAlpha = 0.4 + st.size/4;
      ctx.fillRect(st.x, st.y, st.size, st.size);
    });
    ctx.globalAlpha = 1;
    s.enemies.forEach(e => {
      const bob = Math.sin(e.anim) * 2;
      ctx.fillStyle = 'rgba(0,0,0,0.4)';
      ctx.beginPath();
      ctx.arc(e.x + 3, e.y + 3 + bob, e.r, 0, Math.PI*2);
      ctx.fill();
      const col1 = e.hitFlash > 0 ? '#fff' : (e.type === 'shooter' ? '#ff88ff' : '#ff8888');
      const col2 = e.hitFlash > 0 ? '#ccc' : (e.type === 'shooter' ? '#aa00aa' : '#aa0000');
      ctx.shadowBlur = 12;
      ctx.shadowColor = e.type === 'shooter' ? '#ff44dd' : '#ff4d6d';
      GFX.circleGrad(ctx, e.x, e.y + bob, e.r, col1, col2);
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(e.x - 5, e.y - 3 + bob, 3, 0, Math.PI*2);
      ctx.arc(e.x + 5, e.y - 3 + bob, 3, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(e.x - 5, e.y - 3 + bob, 1.5, 0, Math.PI*2);
      ctx.arc(e.x + 5, e.y - 3 + bob, 1.5, 0, Math.PI*2);
      ctx.fill();
    });
    s.enemyBullets.forEach(b => {
      ctx.shadowBlur = 10;
      ctx.shadowColor = '#ff0';
      GFX.rectGrad(ctx, b.x-3, b.y-7, 6, 14, '#ffff88', '#cc8800');
      ctx.shadowBlur = 0;
    });
    s.bullets.forEach(b => {
      ctx.shadowBlur = 12;
      ctx.shadowColor = '#0ff';
      GFX.rectGrad(ctx, b.x-3, b.y-12, 6, 18, '#88ffff', '#0088cc');
      ctx.shadowBlur = 0;
    });
    if (s.alive || s.deathAnim < 1) {
      const p = s.ship;
      GFX.shadow(ctx, p.x + 2, p.y + 12, 14, 4, 0.4);
      ctx.save();
      ctx.translate(p.x, p.y);
      if (p.hitFlash > 0) ctx.globalAlpha = 0.5 + Math.sin(Date.now()/50) * 0.5;
      ctx.shadowBlur = 16;
      ctx.shadowColor = '#00e0ff';
      ctx.fillStyle = '#00e0ff';
      ctx.beginPath();
      ctx.moveTo(0, -20);
      ctx.lineTo(-16, 16);
      ctx.lineTo(0, 10);
      ctx.lineTo(16, 16);
      ctx.closePath();
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#00a0cc';
      ctx.beginPath();
      ctx.moveTo(0, -14);
      ctx.lineTo(-8, 8);
      ctx.lineTo(0, 4);
      ctx.lineTo(8, 8);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(0, -2, 4, 0, Math.PI*2);
      ctx.fill();
      const fs = 0.7 + Math.random() * 0.6;
      ctx.fillStyle = '#ff9800';
      ctx.beginPath();
      ctx.moveTo(-6, 14);
      ctx.lineTo(0, 22 * fs + 4);
      ctx.lineTo(6, 14);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#ffea00';
      ctx.beginPath();
      ctx.moveTo(-3, 14);
      ctx.lineTo(0, 18 * fs + 2);
      ctx.lineTo(3, 14);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
      ctx.globalAlpha = 1;
    }
    s.particles.forEach(pt => {
      const alpha = Math.max(0, pt.life / (pt.maxLife || 0.5));
      ctx.globalAlpha = alpha;
      ctx.fillStyle = pt.color;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI*2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
    if (!s.alive) {
      ctx.fillStyle = 'rgba(0,0,0,0.8)';
      ctx.fillRect(0, s.H/2-80, s.W, 160);
      if (s.kills >= s.zoneKills) {
        ctx.fillStyle = '#4dffa3';
        ctx.font = 'bold 30px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('ЗОНА ПРОЙДЕНА', s.W/2, s.H/2);
      } else {
        ctx.fillStyle = '#ff4d6d';
        ctx.font = 'bold 34px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', s.W/2, s.H/2);
        ctx.fillStyle = '#fff';
        ctx.font = '18px monospace';
        ctx.fillText(`Очки: ${s.score}`, s.W/2, s.H/2+34);
      }
    }
  },
  serialize(s) {
    return {
      startLevel: s.level, score: s.score, kills: s.kills,
      preview: `Space: зона ${s.level}/5`
    };
  }
};

/* ============================================================
 * RACER — 5 трасс
 * ============================================================ */
const RacerGame = {
  init(load) {
    const W = 480, H = 640;
    const level = (load && load.startLevel ? load.startLevel : 1);
    const s = {
      W, H, level, totalLevels: 5,
      trackName: ['Ночная трасса','Пустыня','Снежные горы','Тропики','Космическая петля'][level-1],
      car: { x: W/2, y: H-100, w: 30, h: 50, tilt: 0 },
      obstacles: [], lines: [],
      distance: 0, speed: 260,
      targetDistance: 2000 + level * 500,
      alive: true, hud: '', particles: [], deathAnim: 0
    };
    for (let i = 0; i < 30; i++) s.lines.push({ y: i*30 - 300 });
    if (load) {
      if (load.distance) s.distance = load.distance;
    }
    return s;
  },
  update(dt, s) {
    if (!s.alive) {
      s.deathAnim += dt;
      for (let i = s.particles.length-1; i >= 0; i--) {
        const p = s.particles[i];
        p.x += p.vx*dt; p.y += p.vy*dt; p.life -= dt;
        if (p.life <= 0) s.particles.splice(i, 1);
      }
      return;
    }
    const K = Game.K;
    const p = s.car;
    let targetSpd = 300 + s.level * 20;
    if (K('KeyW','ArrowUp')) targetSpd += 180;
    if (K('KeyS','ArrowDown')) targetSpd -= 150;
    s.speed += (targetSpd - s.speed) * dt * 3;
    let side = 0;
    if (K('KeyA','ArrowLeft')) side = -1;
    if (K('KeyD','ArrowRight')) side = 1;
    p.x += side * 320 * dt;
    p.x = Math.max(50, Math.min(s.W-50, p.x));
    p.tilt += (side * 0.15 - p.tilt) * Math.min(1, 10*dt);
    if (Math.random() < s.speed / 600 && side !== 0) {
      GFX.spawnParticles(s.particles, p.x - side * 15, p.y + 20, 1,
        { color:'rgba(200,200,200,0.5)', size:3, life:0.3, speed:50, direction: Math.PI/2, spread:0.8 });
    }
    s.distance += s.speed * dt * 0.1;
    s.lines.forEach(l => {
      l.y += s.speed * dt;
      if (l.y > s.H) l.y -= 900;
    });
    const spawnRate = 1 + s.speed/400 + s.level * 0.2;
    if (Math.random() < dt * spawnRate) {
      const ox = 80 + Math.random()*(s.W-160);
      const type = Math.random() > 0.7 ? 'barrier' : 'cone';
      s.obstacles.push({
        x: ox, y: -50,
        w: type === 'barrier' ? 60 : 36,
        h: type === 'barrier' ? 20 : 36,
        type
      });
    }
    for (let i = s.obstacles.length-1; i >= 0; i--) {
      const o = s.obstacles[i];
      o.y += s.speed*dt;
      if (o.y > s.H+50) { s.obstacles.splice(i, 1); continue; }
      if (Math.abs(o.x-p.x) < (o.w+p.w)/2 - 5 &&
          Math.abs(o.y-p.y) < (o.h+p.h)/2 - 5) {
        s.alive = false; s.deathAnim = 0;
        Game.beep(150, 0.4, 'sawtooth');
        Game.screenShake(10, 0.4);
        GFX.spawnParticles(s.particles, p.x, p.y, 25,
          { color:'#ff8800', size:4, life:0.8, speed:250 });
      }
    }
    const spdKm = Math.round(s.speed * 0.6);
    if (spdKm >= 150) unlock('racer','a2');
    if (s.distance >= 2000) unlock('racer','a1');
    if (s.distance >= 3000) unlock('racer','a3');
    if (Math.floor(s.distance / 500) !== Math.floor((s.distance - s.speed*dt*0.1) / 500) && s.distance > 100) {
      Game.checkpoint(this.serialize(s));
    }
    if (s.distance >= s.targetDistance) {
      unlockLevel('racer', s.level + 1);
      if (s.level >= 5) unlock('racer','a4');
      Game.checkpoint(this.serialize(s));
      toast(`Трасса "${s.trackName}" пройдена!`, 'gold');
      if (s.level < 5) {
        setTimeout(() => Game.restart('racer', { startLevel: s.level + 1, distance: 0 }), 1500);
        s.alive = false;
      } else s.alive = false;
    }
    for (let i = s.particles.length-1; i >= 0; i--) {
      const pt = s.particles[i];
      pt.x += pt.vx*dt; pt.y += pt.vy*dt; pt.life -= dt;
      pt.vx *= 0.94; pt.vy *= 0.94;
      if (pt.life <= 0) s.particles.splice(i, 1);
    }
    s.hud = `🏁 ${Math.round(s.distance)}/${s.targetDistance} м | ${spdKm} км/ч | Трасса ${s.level}/5`;
  },
  render(ctx, s) {
    const tracks = [
      { grass1:'#1a2a1a', grass2:'#0a1a0a', road:'#333', line:'#ffe600', sky:'#000018' },
      { grass1:'#4a3a1a', grass2:'#2a1a0a', road:'#444', line:'#fff', sky:'#ff9800' },
      { grass1:'#8a9aa0', grass2:'#5a6a70', road:'#333', line:'#ff8800', sky:'#aaccdd' },
      { grass1:'#1a5a1a', grass2:'#0a3a0a', road:'#3a3a3a', line:'#ffff66', sky:'#66ccff' },
      { grass1:'#1a0a3a', grass2:'#0a0020', road:'#2a2a4a', line:'#ff00ff', sky:'#000018' }
    ];
    const tr = tracks[(s.level - 1) % 5];
    ctx.fillStyle = tr.sky;
    ctx.fillRect(0, 0, s.W, 80);
    GFX.rectGrad(ctx, 0, 80, s.W, s.H - 80, tr.grass1, tr.grass2);
    ctx.fillStyle = tr.road;
    ctx.fillRect(60, 80, s.W-120, s.H - 80);
    ctx.fillStyle = '#fff';
    ctx.fillRect(60, 80, 4, s.H - 80);
    ctx.fillRect(s.W-64, 80, 4, s.H - 80);
    ctx.fillStyle = tr.line;
    s.lines.forEach(l => {
      if (l.y > 80 && l.y < s.H) ctx.fillRect(s.W/2-3, l.y, 6, 15);
    });
    if (s.level === 5) {
      ctx.fillStyle = '#fff';
      for (let i = 0; i < 20; i++) {
        const x = ((i * 137 + s.distance * 3) % s.W);
        const y = 20 + (i % 3) * 20;
        ctx.fillRect(x, y, 2, 2);
      }
    }
    s.obstacles.forEach(o => {
      if (o.type === 'cone') {
        ctx.fillStyle = '#f80';
        ctx.beginPath();
        ctx.moveTo(o.x, o.y-o.h/2);
        ctx.lineTo(o.x-o.w/2, o.y+o.h/2);
        ctx.lineTo(o.x+o.w/2, o.y+o.h/2);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.fillRect(o.x-o.w/2+4, o.y, o.w-8, 4);
      } else {
        GFX.rectGrad(ctx, o.x-o.w/2, o.y-o.h/2, o.w, o.h, '#ff8800', '#cc5500');
        ctx.fillStyle = '#fff';
        for (let i = 0; i < o.w; i += 12) {
          ctx.fillRect(o.x-o.w/2+i, o.y-o.h/2, 6, o.h);
        }
      }
    });
    if (s.alive || s.deathAnim < 1) {
      const p = s.car;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.tilt);
      GFX.shadow(ctx, 3, 3, p.w/2, p.h/2, 0.5);
      GFX.rectGrad(ctx, -p.w/2, -p.h/2, p.w, p.h, '#00e0ff', '#006699');
      GFX.rectGrad(ctx, -p.w/2+3, -p.h/2+3, p.w-6, p.h-6, '#00a0cc', '#005577');
      ctx.fillStyle = 'rgba(50,50,80,0.9)';
      ctx.fillRect(-p.w/2+5, -p.h/2+8, p.w-10, 10);
      ctx.fillRect(-p.w/2+5, p.h/2-18, p.w-10, 10);
      ctx.fillStyle = '#ffff44';
      ctx.fillRect(-p.w/2+3, -p.h/2+2, 5, 4);
      ctx.fillRect(p.w/2-8, -p.h/2+2, 5, 4);
      ctx.fillStyle = '#ff2200';
      ctx.fillRect(-p.w/2+3, p.h/2-4, 5, 3);
      ctx.fillRect(p.w/2-8, p.h/2-4, 5, 3);
      ctx.restore();
    }
    s.particles.forEach(pt => {
      const alpha = Math.max(0, pt.life / (pt.maxLife || 0.5));
      ctx.globalAlpha = alpha;
      ctx.fillStyle = pt.color;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI*2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
    const prog = Math.min(1, s.distance / s.targetDistance);
    GFX.rectGrad(ctx, 10, s.H - 30, 200, 15, '#1a1a1a', '#0a0a0a');
    GFX.rectGrad(ctx, 10, s.H - 30, 200 * prog, 15, '#00e0ff', '#00ffa3');
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.strokeRect(10, s.H - 30, 200, 15);
    if (!s.alive) {
      ctx.fillStyle = 'rgba(0,0,0,0.8)';
      ctx.fillRect(0, s.H/2-80, s.W, 160);
      if (s.distance >= s.targetDistance) {
        ctx.fillStyle = '#4dffa3';
        ctx.font = 'bold 30px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('ТРАССА ПРОЙДЕНА', s.W/2, s.H/2);
      } else {
        ctx.fillStyle = '#ff4d6d';
        ctx.font = 'bold 34px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('АВАРИЯ', s.W/2, s.H/2);
        ctx.fillStyle = '#fff';
        ctx.font = '18px monospace';
        ctx.fillText(`${Math.round(s.distance)} / ${s.targetDistance} м`, s.W/2, s.H/2+34);
      }
    }
  },
  serialize(s) {
    return {
      startLevel: s.level, distance: s.distance,
      preview: `Racer: трасса ${s.level}/5`
    };
  }
};

/* ============================================================
 * PONG — 3 уровня ИИ
 * ============================================================ */
const PongGame = {
  init(load) {
    const W = 640, H = 480;
    const level = (load && load.startLevel ? load.startLevel : 1);
    const aiSpeed = [2.5, 4.5, 7][(level - 1) % 3];
    const s = {
      W, H, level, totalLevels: 3,
      aiName: ['Легко','Средне','Сложно'][level - 1],
      aiSpeed,
      player: { x:20, y:H/2-40, w:12, h:80, targetY: H/2 - 40 },
      ai: { x:W-32, y:H/2-40, w:12, h:80 },
      ball: { x:W/2, y:H/2, vx:300, vy:200, r:8, trail:[] },
      playerScore: 0, aiScore: 0,
      alive: true, hud: '', particles: [], scoreFlash: 0
    };
    if (load) {
      if (load.playerScore) s.playerScore = load.playerScore;
      if (load.aiScore) s.aiScore = load.aiScore;
    }
    return s;
  },
  update(dt, s) {
    if (!s.alive) return;
    const K = Game.K;
    const m = Game.mouse();
    s.scoreFlash = Math.max(0, s.scoreFlash - dt);
    if (K('KeyW','ArrowUp')) s.player.y -= 400*dt;
    if (K('KeyS','ArrowDown')) s.player.y += 400*dt;
    if (m.y > 0 && m.y < s.H) {
      s.player.y += (m.y - s.player.h/2 - s.player.y) * Math.min(1, 12*dt);
    }
    s.player.y = Math.max(0, Math.min(s.H-s.player.h, s.player.y));
    const aiTarget = s.ball.y - s.ai.h/2;
    let aiTargetX = aiTarget;
    if (s.level >= 2) {
      aiTargetX += (Math.random() - 0.5) * 20 * (3 - s.level);
    }
    s.ai.y += (aiTargetX - s.ai.y) * s.aiSpeed * dt;
    s.ai.y = Math.max(0, Math.min(s.H-s.ai.h, s.ai.y));
    s.ball.trail.push({ x: s.ball.x, y: s.ball.y });
    if (s.ball.trail.length > 8) s.ball.trail.shift();
    s.ball.x += s.ball.vx*dt;
    s.ball.y += s.ball.vy*dt;
    if (s.ball.y-s.ball.r < 0) {
      s.ball.y = s.ball.r; s.ball.vy = Math.abs(s.ball.vy);
      Game.beep(600, 0.04);
      GFX.spawnParticles(s.particles, s.ball.x, s.ball.y, 5,
        { color:'#fff', size:2, life:0.3, speed:120 });
    }
    if (s.ball.y+s.ball.r > s.H) {
      s.ball.y = s.H-s.ball.r; s.ball.vy = -Math.abs(s.ball.vy);
      Game.beep(600, 0.04);
      GFX.spawnParticles(s.particles, s.ball.x, s.ball.y, 5,
        { color:'#fff', size:2, life:0.3, speed:120 });
    }
    if (s.ball.x-s.ball.r < s.player.x+s.player.w &&
        s.ball.x+s.ball.r > s.player.x &&
        s.ball.y > s.player.y && s.ball.y < s.player.y+s.player.h &&
        s.ball.vx < 0) {
      s.ball.vx = Math.abs(s.ball.vx)*1.05;
      const hit = (s.ball.y - (s.player.y+s.player.h/2))/(s.player.h/2);
      s.ball.vy = hit*300;
      Game.beep(900, 0.05);
      GFX.spawnParticles(s.particles, s.ball.x, s.ball.y, 8,
        { color:'#00e0ff', size:3, life:0.4, speed:180 });
      unlock('pong','a1');
    }
    if (s.ball.x+s.ball.r > s.ai.x &&
        s.ball.x-s.ball.r < s.ai.x+s.ai.w &&
        s.ball.y > s.ai.y && s.ball.y < s.ai.y+s.ai.h &&
        s.ball.vx > 0) {
      s.ball.vx = -Math.abs(s.ball.vx)*1.05;
      const hit = (s.ball.y - (s.ai.y+s.ai.h/2))/(s.ai.h/2);
      s.ball.vy = hit*300;
      Game.beep(800, 0.05);
      GFX.spawnParticles(s.particles, s.ball.x, s.ball.y, 8,
        { color:'#ff4d6d', size:3, life:0.4, speed:180 });
    }
    if (s.ball.x < -20) {
      s.aiScore++;
      s.scoreFlash = 0.5;
      Game.beep(200, 0.3, 'sawtooth');
      Game.screenShake(4, 0.2);
      this.resetBall(s);
      if (s.aiScore >= 11) s.alive = false;
    }
    if (s.ball.x > s.W+20) {
      s.playerScore++;
      s.scoreFlash = 0.5;
      Game.beep(1000, 0.3, 'sine');
      this.resetBall(s);
      if (s.playerScore >= 11) {
        s.alive = false;
        unlockLevel('pong', s.level + 1);
        if (s.level === 1) unlock('pong','a2');
        if (s.level === 2) unlock('pong','a3');
        if (s.level === 3) unlock('pong','a4');
        toast(`Уровень "${s.aiName}" пройден!`, 'gold');
        if (s.level < 3) {
          setTimeout(() => Game.restart('pong', {
            startLevel: s.level + 1, playerScore: 0, aiScore: 0
          }), 2000);
        }
      }
    }
    for (let i = s.particles.length-1; i >= 0; i--) {
      const pt = s.particles[i];
      pt.x += pt.vx*dt; pt.y += pt.vy*dt; pt.life -= dt;
      pt.vx *= 0.94; pt.vy *= 0.94;
      if (pt.life <= 0) s.particles.splice(i, 1);
    }
    s.hud = `Игрок: ${s.playerScore} | ИИ (${s.aiName}): ${s.aiScore}`;
  },
  resetBall(s) {
    s.ball.x = s.W/2;
    s.ball.y = s.H/2;
    s.ball.vx = 300 * (Math.random() > 0.5 ? 1 : -1);
    s.ball.vy = (Math.random() - 0.5) * 400;
    s.ball.trail = [];
  },
  render(ctx, s) {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, s.W, s.H);
    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
    ctx.setLineDash([10, 10]);
    ctx.beginPath();
    ctx.moveTo(s.W/2, 0);
    ctx.lineTo(s.W/2, s.H);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.shadowBlur = 14;
    ctx.shadowColor = '#00e0ff';
    GFX.rectGrad(ctx, s.player.x, s.player.y, s.player.w, s.player.h, '#66f0ff', '#0088cc');
    ctx.shadowColor = '#ff4d6d';
    GFX.rectGrad(ctx, s.ai.x, s.ai.y, s.ai.w, s.ai.h, '#ff8899', '#aa1a3a');
    ctx.shadowBlur = 0;
    s.ball.trail.forEach((t, i) => {
      const alpha = i / s.ball.trail.length * 0.5;
      ctx.globalAlpha = alpha;
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(t.x, t.y, s.ball.r * (0.5 + i/s.ball.trail.length * 0.5), 0, Math.PI*2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 18;
    ctx.shadowColor = '#fff';
    GFX.circleGrad(ctx, s.ball.x, s.ball.y, s.ball.r, '#fff', '#888');
    ctx.shadowBlur = 0;
    ctx.fillStyle = s.scoreFlash > 0
      ? `rgba(255,255,255,${0.15 + s.scoreFlash})`
      : 'rgba(255,255,255,0.15)';
    ctx.font = 'bold 120px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(s.playerScore, s.W/4, s.H/2);
    ctx.fillText(s.aiScore, (s.W/4)*3, s.H/2);
    s.particles.forEach(pt => {
      const alpha = Math.max(0, pt.life / (pt.maxLife || 0.5));
      ctx.globalAlpha = alpha;
      ctx.fillStyle = pt.color;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI*2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
    if (!s.alive) {
      ctx.fillStyle = 'rgba(0,0,0,0.8)';
      ctx.fillRect(0, s.H/2-80, s.W, 160);
      if (s.playerScore >= 11) {
        ctx.fillStyle = '#4dffa3';
        ctx.font = 'bold 40px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('ПОБЕДА', s.W/2, s.H/2);
      } else {
        ctx.fillStyle = '#ff4d6d';
        ctx.font = 'bold 40px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('ПОРАЖЕНИЕ', s.W/2, s.H/2);
      }
      ctx.fillStyle = '#fff';
      ctx.font = '18px monospace';
      ctx.fillText('ESC — меню', s.W/2, s.H/2+40);
    }
  },
  serialize(s) {
    return {
      startLevel: s.level, playerScore: s.playerScore, aiScore: s.aiScore,
      preview: `Pong: ${s.aiName}`
    };
  }
};

/* ============================================================
 * TETRIS — 2 режима
 * ============================================================ */
const TetrisGame = {
  init(load) {
    const cell = 30;
    const COLS = 10, ROWS = 20;
    const W = COLS*cell + 160, H = ROWS*cell;
    const level = (load && load.startLevel ? load.startLevel : 1);
    const sprint = level === 2;
    const s = {
      W, H, cell, COLS, ROWS,
      level, totalLevels: 2,
      modeName: sprint ? 'Спринт 40 линий' : 'Классика',
      sprint, sprintTarget: 40,
      grid: [], piece: null, nextPiece: null,
      score: 0, lines: 0, levelNum: 1,
      dropTimer: 0, dropInterval: 0.8,
      alive: true, hud: '', cleared: 0,
      particles: []
    };
    for (let y = 0; y < ROWS; y++) {
      s.grid.push([]);
      for (let x = 0; x < COLS; x++) s.grid[y].push(0);
    }
    s.piece = this.newPiece();
    s.nextPiece = this.newPiece();
    if (load) {
      if (load.score) s.score = load.score;
      if (load.lines) s.lines = load.lines;
      if (load.cleared) s.cleared = load.cleared;
    }
    return s;
  },
  shapes: [
    { m:[[1,1,1,1]], color:1 },
    { m:[[1,1],[1,1]], color:2 },
    { m:[[0,1,0],[1,1,1]], color:3 },
    { m:[[1,0,0],[1,1,1]], color:4 },
    { m:[[0,0,1],[1,1,1]], color:5 },
    { m:[[0,1,1],[1,1,0]], color:6 },
    { m:[[1,1,0],[0,1,1]], color:7 }
  ],
  colors: ['#000','#0ff','#ff0','#f0f','#00f','#f80','#0f0','#f00'],
  newPiece() {
    const idx = Math.floor(Math.random()*this.shapes.length);
    const sh = this.shapes[idx];
    return {
      m: sh.m.map(r => [...r]),
      color: sh.color,
      x: Math.floor(10/2) - Math.floor(sh.m[0].length/2),
      y: 0
    };
  },
  rotate(p) {
    const N = p.m.length, M = p.m[0].length;
    const r = [];
    for (let x = 0; x < M; x++) {
      r.push([]);
      for (let y = N-1; y >= 0; y--) r[x].push(p.m[y][x]);
    }
    return { ...p, m: r };
  },
  valid(s, p) {
    for (let y = 0; y < p.m.length; y++) {
      for (let x = 0; x < p.m[0].length; x++) {
        if (!p.m[y][x]) continue;
        const nx = p.x+x, ny = p.y+y;
        if (nx < 0 || nx >= s.COLS || ny >= s.ROWS) return false;
        if (ny >= 0 && s.grid[ny][nx]) return false;
      }
    }
    return true;
  },
  update(dt, s) {
    if (!s.alive) return;
    const K = Game.K;
    if (K('ArrowUp','KeyW') && !s._rotLock) {
      const r = this.rotate(s.piece);
      if (this.valid(s, r)) { s.piece = r; Game.beep(500, 0.05); }
      else {
        for (const dx of [-1, 1, -2, 2]) {
          const test = { ...r, x: r.x + dx };
          if (this.valid(s, test)) { s.piece = test; Game.beep(500, 0.05); break; }
        }
      }
      s._rotLock = true;
      setTimeout(() => s._rotLock = false, 150);
    }
    if (K('ArrowLeft','KeyA') && !s._movL) {
      const p = { ...s.piece, x: s.piece.x-1 };
      if (this.valid(s, p)) s.piece = p;
      s._movL = true;
      setTimeout(() => s._movL = false, 100);
    }
    if (K('ArrowRight','KeyD') && !s._movR) {
      const p = { ...s.piece, x: s.piece.x+1 };
      if (this.valid(s, p)) s.piece = p;
      s._movR = true;
      setTimeout(() => s._movR = false, 100);
    }
    const fast = K('ArrowDown','KeyS');
    s.dropTimer += dt * (fast ? 8 : 1);
    if (s.dropTimer >= s.dropInterval) {
      s.dropTimer = 0;
      const p = { ...s.piece, y: s.piece.y+1 };
      if (this.valid(s, p)) s.piece = p;
      else {
        for (let y = 0; y < s.piece.m.length; y++) {
          for (let x = 0; x < s.piece.m[0].length; x++) {
            if (s.piece.m[y][x]) {
              const ny = s.piece.y+y, nx = s.piece.x+x;
              if (ny >= 0) s.grid[ny][nx] = s.piece.color;
            }
          }
        }
        const cleared = this.clearLines(s);
        if (cleared > 0) {
          if (cleared === 4) unlock('tetris','a4');
          if (s.lines >= 1) unlock('tetris','a1');
          if (s.lines >= 30) unlock('tetris','a2');
          if (s.lines >= 60) unlock('tetris','a3');
          if (s.sprint) {
            s.cleared += cleared;
            if (s.cleared >= s.sprintTarget) {
              toast('🏆 СПРИНТ ПРОЙДЕН!', 'gold');
              s.alive = false;
              return;
            }
          }
          Game.screenShake(cleared === 4 ? 6 : 3, 0.2);
        }
        s.piece = s.nextPiece;
        s.nextPiece = this.newPiece();
        if (!this.valid(s, s.piece)) {
          s.alive = false;
          Game.beep(150, 0.5, 'sawtooth');
        }
        if (s.lines % 5 === 0 && s.lines > 0) Game.checkpoint(this.serialize(s));
      }
    }
    for (let i = s.particles.length-1; i >= 0; i--) {
      const pt = s.particles[i];
      pt.x += pt.vx*dt; pt.y += pt.vy*dt; pt.life -= dt;
      pt.vy += 300*dt;
      if (pt.life <= 0) s.particles.splice(i, 1);
    }
    s.hud = s.sprint
      ? `Очки: ${s.score} | Прогресс: ${s.cleared}/${s.sprintTarget}`
      : `Очки: ${s.score} | Линии: ${s.lines} | Ур: ${s.levelNum}`;
  },
  clearLines(s) {
    let cleared = 0;
    for (let y = s.ROWS-1; y >= 0; y--) {
      if (s.grid[y].every(v => v !== 0)) {
        s.grid.splice(y, 1);
        s.grid.unshift(new Array(s.COLS).fill(0));
        cleared++;
        y++;
        for (let x = 0; x < s.COLS; x++) {
          GFX.spawnParticles(s.particles,
            x * s.cell + s.cell/2, y * s.cell + s.cell/2,
            3, { color:'#fff', size:3, life:0.6, speed:100 });
        }
      }
    }
    if (cleared > 0) {
      s.lines += cleared;
      s.score += [0,100,300,500,800][cleared] || 800;
      s.levelNum = 1 + Math.floor(s.lines/10);
      s.dropInterval = Math.max(0.1, 0.8 - s.levelNum*0.07);
      Game.beep(800 + cleared * 100, 0.15, 'sine');
    }
    return cleared;
  },
  render(ctx, s) {
    ctx.fillStyle = '#0a0a14';
    ctx.fillRect(0, 0, s.W, s.H);
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, s.COLS*s.cell, s.ROWS*s.cell);
    ctx.strokeStyle = 'rgba(255,255,255,0.05)';
    for (let x = 0; x <= s.COLS; x++) {
      ctx.beginPath();
      ctx.moveTo(x*s.cell, 0);
      ctx.lineTo(x*s.cell, s.ROWS*s.cell);
      ctx.stroke();
    }
    for (let y = 0; y <= s.ROWS; y++) {
      ctx.beginPath();
      ctx.moveTo(0, y*s.cell);
      ctx.lineTo(s.COLS*s.cell, y*s.cell);
      ctx.stroke();
    }
    for (let y = 0; y < s.ROWS; y++) {
      for (let x = 0; x < s.COLS; x++) {
        if (s.grid[y][x]) this.drawCell(ctx, x*s.cell, y*s.cell, s.cell, this.colors[s.grid[y][x]]);
      }
    }
    if (s.piece) {
      let ghostY = s.piece.y;
      while (this.valid(s, { ...s.piece, y: ghostY + 1 })) ghostY++;
      if (ghostY > s.piece.y) {
        ctx.globalAlpha = 0.2;
        for (let y = 0; y < s.piece.m.length; y++) {
          for (let x = 0; x < s.piece.m[0].length; x++) {
            if (s.piece.m[y][x]) {
              this.drawCell(ctx,
                (s.piece.x+x)*s.cell,
                (ghostY+y)*s.cell,
                s.cell, this.colors[s.piece.color]);
            }
          }
        }
        ctx.globalAlpha = 1;
      }
      for (let y = 0; y < s.piece.m.length; y++) {
        for (let x = 0; x < s.piece.m[0].length; x++) {
          if (s.piece.m[y][x]) {
            this.drawCell(ctx,
              (s.piece.x+x)*s.cell,
              (s.piece.y+y)*s.cell,
              s.cell, this.colors[s.piece.color]);
          }
        }
      }
    }
    const px = s.COLS*s.cell;
    GFX.rectGrad(ctx, px, 0, 160, s.H, '#121a2e', '#0a1020');
    ctx.fillStyle = '#00e0ff';
    ctx.font = 'bold 14px monospace';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.fillText('СЛЕДУЮЩАЯ', px+12, 20);
    if (s.nextPiece) {
      for (let y = 0; y < s.nextPiece.m.length; y++) {
        for (let x = 0; x < s.nextPiece.m[0].length; x++) {
          if (s.nextPiece.m[y][x]) {
            this.drawCell(ctx, px+30+x*24, 60+y*24, 24, this.colors[s.nextPiece.color]);
          }
        }
      }
    }
    ctx.fillStyle = '#6b7a99';
    ctx.font = '12px monospace';
    if (s.sprint) {
      ctx.fillText('ПРОГРЕСС', px+12, 200);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 20px monospace';
      ctx.fillText(`${s.cleared}/${s.sprintTarget}`, px+12, 220);
      const prog = Math.min(1, s.cleared / s.sprintTarget);
      GFX.rectGrad(ctx, px+12, 250, 136, 10, '#1a1a2a', '#0a0a14');
      GFX.rectGrad(ctx, px+12, 250, 136 * prog, 10, '#00e0ff', '#00ffa3');
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 1;
      ctx.strokeRect(px+12, 250, 136, 10);
    } else {
      ctx.fillText('ОЧКИ', px+12, 200);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 20px monospace';
      ctx.fillText(s.score, px+12, 220);
      ctx.fillStyle = '#6b7a99';
      ctx.font = '12px monospace';
      ctx.fillText('ЛИНИИ', px+12, 270);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 20px monospace';
      ctx.fillText(s.lines, px+12, 290);
      ctx.fillStyle = '#6b7a99';
      ctx.font = '12px monospace';
      ctx.fillText('УРОВЕНЬ', px+12, 340);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 20px monospace';
      ctx.fillText(s.levelNum, px+12, 360);
    }
    s.particles.forEach(pt => {
      const alpha = Math.max(0, pt.life / (pt.maxLife || 0.5));
      ctx.globalAlpha = alpha;
      ctx.fillStyle = pt.color;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI*2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
    if (!s.alive) {
      ctx.fillStyle = 'rgba(0,0,0,0.85)';
      ctx.fillRect(0, s.H/2-80, s.W, 160);
      if (s.sprint && s.cleared >= s.sprintTarget) {
        ctx.fillStyle = '#4dffa3';
        ctx.font = 'bold 28px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('🏆 СПРИНТ ПРОЙДЕН', s.W/2, s.H/2);
      } else {
        ctx.fillStyle = '#ff4d6d';
        ctx.font = 'bold 32px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('GAME OVER', s.W/2, s.H/2);
      }
    }
  },
  drawCell(ctx, x, y, size, color) {
    GFX.rectGrad(ctx, x+1, y+1, size-2, size-2, color, '#000');
    ctx.strokeStyle = 'rgba(0,0,0,0.5)';
    ctx.lineWidth = 1;
    ctx.strokeRect(x+1, y+1, size-2, size-2);
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.fillRect(x+2, y+2, size-4, 3);
  },
  serialize(s) {
    return {
      startLevel: s.level, score: s.score, lines: s.lines, cleared: s.cleared,
      preview: `Tetris: ${s.modeName}`
    };
  }
};

/* ============================================================
 * INVADERS — 5 волн + босс
 * ============================================================ */
const InvadersGame = {
  init(load) {
    const W = 640, H = 480;
    const level = (load && load.startLevel ? load.startLevel : 1);
    const s = {
      W, H, level, totalLevels: 5,
      ship: { x: W/2, y: H-40, w:30, hitFlash: 0 },
      bullets: [], enemyBullets: [], enemies: [], enemyDir: 1,
      score: 0, kills: 0,
      alive: true, cd: 0, enemyCd: 0.8, hud: '',
      particles: [], boss: null, deathAnim: 0
    };
    this.spawnWave(s);
    if (load) {
      if (load.score) s.score = load.score;
      if (load.kills) s.kills = load.kills;
    }
    return s;
  },
  spawnWave(s) {
    s.enemies = [];
    const rows = 2 + s.level;
    const cols = 6 + s.level;
    for (let y = 0; y < rows; y++) {
      for (let x = 0; x < cols; x++) {
        s.enemies.push({
          x: 60+x*60, y: 60+y*40,
          w: 30, h: 24, alive: true,
          type: y === 0 ? 'red' : y === 1 ? 'blue' : 'green',
          anim: Math.random()*10
        });
      }
    }
    if (s.level === 5) {
      s.boss = {
        x: s.W/2, y: 40,
        w: 80, h: 50,
        hp: 30, maxHp: 30,
        cd: 1, alive: true, anim: 0
      };
      toast('⚠ БОСС: НЛО!', 'gold');
    } else s.boss = null;
  },
  update(dt, s) {
    if (!s.alive) {
      s.deathAnim += dt;
      for (let i = s.particles.length-1; i >= 0; i--) {
        const p = s.particles[i];
        p.x += p.vx*dt; p.y += p.vy*dt; p.life -= dt;
        if (p.life <= 0) s.particles.splice(i, 1);
      }
      return;
    }
    const K = Game.K;
    const m = Game.mouse();
    s.ship.hitFlash = Math.max(0, s.ship.hitFlash - dt);
    let dx = 0;
    if (K('KeyA','ArrowLeft')) dx = -1;
    if (K('KeyD','ArrowRight')) dx = 1;
    s.ship.x += dx*320*dt;
    if (m.x > 0 && m.x < s.W) {
      s.ship.x += (m.x - s.ship.x) * Math.min(1, 10*dt);
    }
    s.ship.x = Math.max(20, Math.min(s.W-20, s.ship.x));
    s.cd -= dt;
    if ((K('Space','Enter') || m.down) && s.cd <= 0) {
      s.cd = 0.35;
      s.bullets.push({ x: s.ship.x, y: s.ship.y-15, vy: -500 });
      Game.beep(1000, 0.05);
    }
    for (let i = s.bullets.length-1; i >= 0; i--) {
      const b = s.bullets[i];
      b.y += b.vy*dt;
      if (b.y < -10) { s.bullets.splice(i, 1); continue; }
      for (const e of s.enemies) {
        if (!e.alive) continue;
        if (Math.abs(b.x-e.x) < e.w/2 && Math.abs(b.y-e.y) < e.h/2) {
          e.alive = false;
          s.bullets.splice(i, 1);
          s.score += 10;
          s.kills++;
          Game.beep(400, 0.1, 'sawtooth');
          Game.screenShake(2, 0.08);
          GFX.spawnParticles(s.particles, e.x, e.y, 8,
            { color:'#ff8800', size:3, life:0.4, speed:180 });
          if (s.kills === 1) unlock('invaders','a1');
          if (s.kills === 30) unlock('invaders','a2');
          if (s.kills === 50) unlock('invaders','a4');
          break;
        }
      }
      if (s.boss && s.boss.alive && Math.abs(b.x-s.boss.x) < s.boss.w/2 && Math.abs(b.y-s.boss.y) < s.boss.h/2) {
        s.boss.hp--;
        s.bullets.splice(i, 1);
        Game.beep(600, 0.05);
        GFX.spawnParticles(s.particles, b.x, b.y, 6,
          { color:'#ff8800', size:3, life:0.4, speed:180 });
        if (s.boss.hp <= 0) {
          s.boss.alive = false;
          s.score += 500;
          Game.screenShake(10, 0.5);
          GFX.spawnParticles(s.particles, s.boss.x, s.boss.y, 40,
            { color:'#ffcf40', size:5, life:1, speed:300 });
          toast('☠ БОСС УБИТ!', 'gold');
        }
      }
    }
    s.enemies = s.enemies.filter(e => e.alive);
    let edge = false;
    s.enemies.forEach(e => {
      e.anim += dt * 6;
      e.x += s.enemyDir*30*dt;
      if (e.x < 30 || e.x > s.W-30) edge = true;
    });
    if (edge) {
      s.enemyDir *= -1;
      s.enemies.forEach(e => e.y += 15);
    }
    if (s.boss && s.boss.alive) {
      s.boss.anim += dt * 3;
      s.boss.x += Math.sin(s.boss.anim) * 100 * dt;
      s.boss.x = Math.max(60, Math.min(s.W-60, s.boss.x));
    }
    s.enemyCd -= dt;
    if (s.enemyCd <= 0 && s.enemies.length > 0) {
      s.enemyCd = Math.max(0.2, 1.5 - s.level*0.15);
      const e = s.enemies[Math.floor(Math.random()*s.enemies.length)];
      s.enemyBullets.push({ x: e.x, y: e.y+15, vy: 300 });
    }
    if (s.boss && s.boss.alive) {
      s.boss.cd -= dt;
      if (s.boss.cd <= 0) {
        s.boss.cd = 1.2;
        for (const off of [-30, 0, 30]) {
          s.enemyBullets.push({ x: s.boss.x + off, y: s.boss.y + 25, vy: 350 });
        }
      }
    }
    for (let i = s.enemyBullets.length-1; i >= 0; i--) {
      const b = s.enemyBullets[i];
      b.y += b.vy*dt;
      if (b.y > s.H+10) { s.enemyBullets.splice(i, 1); continue; }
      if (Math.abs(b.x-s.ship.x) < 15 && Math.abs(b.y-s.ship.y) < 15 && s.ship.hitFlash <= 0) {
        s.alive = false; s.deathAnim = 0;
        Game.screenShake(10, 0.4);
        GFX.spawnParticles(s.particles, s.ship.x, s.ship.y, 20,
          { color:'#00e0ff', size:4, life:0.8, speed:250 });
      }
    }
    for (const e of s.enemies) {
      if (e.y > s.H-60) { s.alive = false; s.deathAnim = 0; break; }
    }
    if (s.enemies.length === 0 && (!s.boss || !s.boss.alive)) {
      unlockLevel('invaders', s.level + 1);
      if (s.level === 3) unlock('invaders','a3');
      Game.checkpoint(this.serialize(s));
      toast(`Волна ${s.level} пройдена!`, 'gold');
      if (s.level < 5) {
        setTimeout(() => Game.restart('invaders', {
          startLevel: s.level + 1, score: s.score, kills: s.kills
        }), 1500);
        s.alive = false;
      } else {
        toast('🏆 ВСЕ ВОЛНЫ ПРОЙДЕНЫ!', 'gold');
        s.alive = false;
      }
    }
    for (let i = s.particles.length-1; i >= 0; i--) {
      const pt = s.particles[i];
      pt.x += pt.vx*dt; pt.y += pt.vy*dt; pt.life -= dt;
      pt.vx *= 0.94; pt.vy *= 0.94;
      if (pt.life <= 0) s.particles.splice(i, 1);
    }
    s.hud = `Очки: ${s.score} | Волна ${s.level}/5 | Врагов: ${s.enemies.length}`;
  },
  render(ctx, s) {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, s.W, s.H);
    s.enemies.forEach(e => {
      const bob = Math.sin(e.anim) * 2;
      const c = e.type === 'red' ? '#ff4d6d' : e.type === 'blue' ? '#4dcfff' : '#4dffa3';
      const c2 = e.type === 'red' ? '#8a1a2a' : e.type === 'blue' ? '#1a4a8a' : '#1a6a3a';
      GFX.shadow(ctx, e.x, e.y + e.h/2 + 2, e.w/2, 3, 0.4);
      GFX.rectGrad(ctx, e.x-e.w/2, e.y-e.h/2 + bob, e.w, e.h, c, c2);
      ctx.strokeStyle = 'rgba(0,0,0,0.5)';
      ctx.lineWidth = 1;
      ctx.strokeRect(e.x-e.w/2, e.y-e.h/2 + bob, e.w, e.h);
      ctx.fillStyle = '#000';
      ctx.fillRect(e.x-7, e.y-5 + bob, 4, 4);
      ctx.fillRect(e.x+3, e.y-5 + bob, 4, 4);
      ctx.fillRect(e.x-8, e.y+5 + bob, 16, 2);
    });
    if (s.boss && s.boss.alive) {
      const bob = Math.sin(s.boss.anim) * 3;
      ctx.shadowBlur = 20;
      ctx.shadowColor = '#ff44dd';
      GFX.circleGrad(ctx, s.boss.x, s.boss.y + bob, s.boss.w/2, '#ff88ff', '#660066');
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#ff0';
      ctx.beginPath();
      ctx.arc(s.boss.x - 15, s.boss.y - 5 + bob, 8, 0, Math.PI*2);
      ctx.arc(s.boss.x + 15, s.boss.y - 5 + bob, 8, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(s.boss.x - 15, s.boss.y - 5 + bob, 4, 0, Math.PI*2);
      ctx.arc(s.boss.x + 15, s.boss.y - 5 + bob, 4, 0, Math.PI*2);
      ctx.fill();
      const hpw = 100 * (s.boss.hp/s.boss.maxHp);
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(s.boss.x-50, s.boss.y-40+bob, 100, 8);
      ctx.fillStyle = '#f00';
      ctx.fillRect(s.boss.x-50, s.boss.y-40+bob, hpw, 8);
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 1;
      ctx.strokeRect(s.boss.x-50, s.boss.y-40+bob, 100, 8);
    }
    s.bullets.forEach(b => {
      ctx.shadowBlur = 10;
      ctx.shadowColor = '#0ff';
      GFX.rectGrad(ctx, b.x-2, b.y-8, 4, 14, '#88ffff', '#0088cc');
      ctx.shadowBlur = 0;
    });
    s.enemyBullets.forEach(b => {
      ctx.shadowBlur = 10;
      ctx.shadowColor = '#f80';
      GFX.rectGrad(ctx, b.x-2, b.y-8, 4, 14, '#ffcc88', '#cc5500');
      ctx.shadowBlur = 0;
    });
    if (s.alive || s.deathAnim < 1) {
      const p = s.ship;
      if (p.hitFlash > 0) ctx.globalAlpha = 0.5 + Math.sin(Date.now()/50) * 0.5;
      ctx.shadowBlur = 14;
      ctx.shadowColor = '#00e0ff';
      ctx.fillStyle = '#00e0ff';
      ctx.beginPath();
      ctx.moveTo(p.x, p.y-15);
      ctx.lineTo(p.x-20, p.y+12);
      ctx.lineTo(p.x-6, p.y+8);
      ctx.lineTo(p.x, p.y+12);
      ctx.lineTo(p.x+6, p.y+8);
      ctx.lineTo(p.x+20, p.y+12);
      ctx.closePath();
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(p.x, p.y - 4, 4, 0, Math.PI*2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
    s.particles.forEach(pt => {
      const alpha = Math.max(0, pt.life / (pt.maxLife || 0.5));
      ctx.globalAlpha = alpha;
      ctx.fillStyle = pt.color;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI*2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
    if (!s.alive) {
      ctx.fillStyle = 'rgba(0,0,0,0.8)';
      ctx.fillRect(0, s.H/2-80, s.W, 160);
      if (s.level >= 5 && s.enemies.length === 0 && (!s.boss || !s.boss.alive)) {
        ctx.fillStyle = '#4dffa3';
        ctx.font = 'bold 30px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('🏆 ПОБЕДА!', s.W/2, s.H/2);
      } else {
        ctx.fillStyle = '#ff4d6d';
        ctx.font = 'bold 34px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', s.W/2, s.H/2);
        ctx.fillStyle = '#fff';
        ctx.font = '18px monospace';
        ctx.fillText(`Очки: ${s.score}`, s.W/2, s.H/2+34);
      }
    }
  },
  serialize(s) {
    return {
      startLevel: s.level, score: s.score, kills: s.kills,
      preview: `Invaders: волна ${s.level}/5`
    };
  }
};

/* ============================================================
 * SOKOBAN — 12 уровней
 * ============================================================ */
const SokobanGame = {
  LEVELS: [
    ["########","#      #","#  .   #","#  $   #","#  @   #","#      #","########"],
    ["########","# . .  #","# $ $  #","#  @   #","#      #","########"],
    ["########","#  .   #","# $ $  #","#  .   #","#  @   #","########"],
    ["#########","#  .    #","#  $    #","#  @    #","#       #","#########"],
    ["########","# .  . #","# $  $ #","#  @   #","########"],
    ["#########","#   .   #","#   $   #","#   @   #","#       #","#       #","#########"],
    ["########","#. . . #","#$$$ $ #","#  @   #","#      #","########"],
    ["#########","#  . .  #","#  $ $  #","#   @   #","#       #","#########"],
    ["########","#. $   #","#  @   #","#   $ .#","########"],
    ["#########","# .   . #","#  $ $  #","#   @   #","#       #","#########"],
    ["########","#  ..  #","#  $$  #","#  @   #","#      #","#      #","########"],
    ["#########","# . . . #","# $ $ $ #","#   @   #","#       #","#########"]
  ],

  init(load) {
    const level = (load && load.startLevel ? load.startLevel : 1) - 1;
    const cell = 44;
    const map = this.LEVELS[level % this.LEVELS.length];
    const s = {
      W: 0, H: 0, cell,
      level: level + 1, totalLevels: 12,
      grid: map,
      player: { x: 0, y: 0, walkAnim: 0 },
      boxes: [], targets: [],
      moves: 0, pushes: 0,
      alive: true, hud: '', completed: false,
      particles: [], step: 0
    };
    this.loadLevel(s, map);
    if (load) {
      if (load.moves) s.moves = load.moves;
      if (load.pushes) s.pushes = load.pushes;
    }
    return s;
  },
  loadLevel(s, map) {
    s.grid = map;
    s.H = map.length*s.cell;
    s.W = map[0].length*s.cell;
    s.boxes = [];
    s.targets = [];
    for (let y = 0; y < map.length; y++) {
      for (let x = 0; x < map[y].length; x++) {
        const c = map[y][x];
        if (c === '@') { s.player.x = x; s.player.y = y; }
        if (c === '$') s.boxes.push({ x, y });
        if (c === '.') s.targets.push({ x, y });
      }
    }
    s.completed = false;
  },
  update(dt, s) {
    if (!s.alive) return;
    const K = Game.K;
    s.player.walkAnim += dt * 6;
    if (s.completed) {
      if ((K('Space','Enter') || Game.mouse().down) && !s._nextLock) {
        s._nextLock = true;
        setTimeout(() => s._nextLock = false, 400);
        if (s.level < s.totalLevels) {
          unlockLevel('sokoban', s.level + 1);
          Game.checkpoint(this.serialize(s));
          setTimeout(() => Game.restart('sokoban', {
            startLevel: s.level + 1
          }), 500);
        }
      }
      s.hud = `Ур. ${s.level}/12 пройден! | Шагов: ${s.moves}`;
      for (let i = s.particles.length-1; i >= 0; i--) {
        const pt = s.particles[i];
        pt.x += pt.vx*dt; pt.y += pt.vy*dt; pt.life -= dt;
        pt.vy += 200*dt;
        if (pt.life <= 0) s.particles.splice(i, 1);
      }
      return;
    }
    if (s._lock) return;
    let dx = 0, dy = 0;
    if (K('KeyA','ArrowLeft')) dx = -1;
    else if (K('KeyD','ArrowRight')) dx = 1;
    else if (K('KeyW','ArrowUp')) dy = -1;
    else if (K('KeyS','ArrowDown')) dy = 1;
    if (dx === 0 && dy === 0) return;
    const nx = s.player.x+dx, ny = s.player.y+dy;
    if (s.grid[ny] && s.grid[ny][nx] === '#') return;
    const box = s.boxes.find(b => b.x === nx && b.y === ny);
    if (box) {
      const bx = nx+dx, by = ny+dy;
      if (s.grid[by] && s.grid[by][bx] === '#') return;
      if (s.boxes.some(b => b.x === bx && b.y === by)) return;
      box.x = bx; box.y = by;
      s.pushes++;
      Game.beep(500, 0.05);
      if (s.pushes === 1) unlock('sokoban','a1');
    }
    s.player.x = nx;
    s.player.y = ny;
    s.moves++;
    s.step = 0.15;
    s._lock = true;
    setTimeout(() => s._lock = false, 120);
    if (s.targets.every(t => s.boxes.some(b => b.x === t.x && b.y === t.y))) {
      s.completed = true;
      Game.beep(1200, 0.3, 'sine');
      Game.screenShake(4, 0.2);
      for (let i = 0; i < 40; i++) {
        GFX.spawnParticles(s.particles,
          s.W/2, s.H/2, 1,
          { color: ['#ffcf40','#4dffa3','#4dcfff'][i%3],
            size:5, life:1.5, speed:250 });
      }
      if (s.level === 3) unlock('sokoban','a2');
      if (s.level === 7) unlock('sokoban','a3');
      if (s.level === 12) unlock('sokoban','a4');
    }
    for (let i = s.particles.length-1; i >= 0; i--) {
      const pt = s.particles[i];
      pt.x += pt.vx*dt; pt.y += pt.vy*dt; pt.life -= dt;
      pt.vy += 200*dt;
      if (pt.life <= 0) s.particles.splice(i, 1);
    }
    s.hud = `Ур. ${s.level}/12 | Шагов: ${s.moves} | Толчков: ${s.pushes}`;
  },
  render(ctx, s) {
    ctx.fillStyle = '#0a0a14';
    ctx.fillRect(0, 0, s.W, s.H);
    const c = s.cell;
    for (let y = 0; y < s.grid.length; y++) {
      for (let x = 0; x < s.grid[y].length; x++) {
        const cell = s.grid[y][x];
        if (cell === '#') {
          GFX.rectGrad(ctx, x*c, y*c, c, c, '#5a5a5a', '#3a3a3a');
          ctx.strokeStyle = '#2a2a2a';
          ctx.lineWidth = 1;
          ctx.strokeRect(x*c+2, y*c+2, c-4, c-4);
          ctx.fillStyle = 'rgba(255,255,255,0.1)';
          ctx.fillRect(x*c+4, y*c+4, c-8, 4);
        } else {
          ctx.fillStyle = (x+y)%2 === 0 ? '#1a1a24' : '#141418';
          ctx.fillRect(x*c, y*c, c, c);
          ctx.strokeStyle = 'rgba(0,0,0,0.2)';
          ctx.strokeRect(x*c+0.5, y*c+0.5, c-1, c-1);
        }
      }
    }
    s.targets.forEach(t => {
      const pulse = 1 + Math.sin(Date.now()/300) * 0.15;
      ctx.strokeStyle = '#ffcf40';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(t.x*c+c/2, t.y*c+c/2, c*0.25 * pulse, 0, Math.PI*2);
      ctx.stroke();
      ctx.fillStyle = 'rgba(255,207,64,0.2)';
      ctx.fill();
    });
    s.boxes.forEach(b => {
      const onTarget = s.targets.some(t => t.x === b.x && t.y === b.y);
      const c1 = onTarget ? '#6adca0' : '#a07040';
      const c2 = onTarget ? '#2a8a5a' : '#5a3018';
      GFX.rectGrad(ctx, b.x*c+4, b.y*c+4, c-8, c-8, c1, c2);
      ctx.strokeStyle = onTarget ? '#0f0' : '#3a1a08';
      ctx.lineWidth = 3;
      ctx.strokeRect(b.x*c+4, b.y*c+4, c-8, c-8);
      ctx.strokeStyle = 'rgba(0,0,0,0.4)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(b.x*c+4, b.y*c+4);
      ctx.lineTo(b.x*c+c-4, b.y*c+c-4);
      ctx.moveTo(b.x*c+c-4, b.y*c+4);
      ctx.lineTo(b.x*c+4, b.y*c+c-4);
      ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.3)';
      ctx.fillRect(b.x*c+6, b.y*c+6, c-12, 4);
    });
    const p = s.player;
    const bob = Math.sin(p.walkAnim) * 1.5;
    GFX.shadow(ctx, p.x*c+c/2, p.y*c+c*0.85, c*0.35, 4, 0.4);
    GFX.circleGrad(ctx, p.x*c+c/2, p.y*c+c/2 + bob, c*0.35, '#5abf5a', '#1e5a1e');
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(p.x*c+c/2-5, p.y*c+c/2-4+bob, 3.5, 0, Math.PI*2);
    ctx.arc(p.x*c+c/2+5, p.y*c+c/2-4+bob, 3.5, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(p.x*c+c/2-5, p.y*c+c/2-4+bob, 1.8, 0, Math.PI*2);
    ctx.arc(p.x*c+c/2+5, p.y*c+c/2-4+bob, 1.8, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(p.x*c+c/2, p.y*c+c/2 + bob, 5, 0, Math.PI);
    ctx.stroke();
    s.particles.forEach(pt => {
      const alpha = Math.max(0, pt.life / (pt.maxLife || 0.5));
      ctx.globalAlpha = alpha;
      ctx.fillStyle = pt.color;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI*2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
    if (s.completed) {
      ctx.fillStyle = 'rgba(0,0,0,0.8)';
      ctx.fillRect(0, s.H/2-70, s.W, 140);
      ctx.fillStyle = '#4dffa3';
      ctx.font = 'bold 28px monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(`УРОВЕНЬ ${s.level} ПРОЙДЕН`, s.W/2, s.H/2-10);
      ctx.fillStyle = '#fff';
      ctx.font = '14px monospace';
      ctx.fillText(s.level < 12 ? 'ПРОБЕЛ — следующий' : 'ВСЕ УРОВНИ ПРОЙДЕНЫ!', s.W/2, s.H/2+24);
    }
  },
  serialize(s) {
    return {
      startLevel: s.level, moves: s.moves, pushes: s.pushes,
      preview: `Sokoban: ур.${s.level}/12`
    };
  }
};

/* ============================================================
 * FLAPPY BIRD
 * ============================================================ */
const FlappyGame = {
  init(load) {
    const W = 400, H = 600;
    const s = {
      W, H,
      bird: { x:100, y: H/2, vy:0, r:12, anim: 0 },
      pipes: [],
      gravity: 900, jump: -320,
      pipeW: 60, gap: 150, pipeSpeed: 160,
      spawnTimer: 0, score: 0,
      alive: true, started: false, lock: 0,
      hud: '', particles: [], bgOffset: 0, deathAnim: 0
    };
    if (load) {
      if (load.score) s.score = load.score;
    }
    return s;
  },
  update(dt, s) {
    const K = Game.K;
    const m = Game.mouse();
    const tap = K('Space','KeyW','ArrowUp') || (m.down && !m.was);
    s.bird.anim += dt * 10;
    s.bgOffset += dt * 20;
    if (s.alive) {
      if (!s.started && tap) {
        s.started = true;
        s.bird.vy = s.jump;
        s.lock = 0.1;
        Game.beep(700, 0.06);
      } else if (s.started && tap && s.lock <= 0) {
        s.bird.vy = s.jump;
        s.lock = 0.09;
        Game.beep(700, 0.06);
        GFX.spawnParticles(s.particles, s.bird.x, s.bird.y + s.bird.r, 3,
          { color:'rgba(255,255,255,0.7)', size:2, life:0.3, speed:60, direction: Math.PI/2, spread:1 });
      }
    }
    s.lock -= dt;
    if (!s.alive) {
      s.deathAnim += dt;
      if (s.bird.y < s.H - 20) {
        s.bird.vy += s.gravity*dt;
        s.bird.y += s.bird.vy*dt;
      }
      for (let i = s.particles.length-1; i >= 0; i--) {
        const p = s.particles[i];
        p.x += p.vx*dt; p.y += p.vy*dt; p.life -= dt;
        if (p.life <= 0) s.particles.splice(i, 1);
      }
      s.hud = `Очки: ${s.score} — ESC`;
      return;
    }
    if (!s.started) {
      s.bird.y = s.H/2 + Math.sin(Date.now()/300) * 8;
      s.hud = 'ПРОБЕЛ / ЛКМ — старт';
      return;
    }
    s.bird.vy += s.gravity*dt;
    s.bird.y += s.bird.vy*dt;
    s.spawnTimer += dt;
    if (s.spawnTimer > 1.6) {
      s.spawnTimer = 0;
      const topH = 60 + Math.random()*(s.H - s.gap - 180);
      s.pipes.push({ x: s.W, topH, passed: false });
    }
    for (let i = s.pipes.length-1; i >= 0; i--) {
      const p = s.pipes[i];
      p.x -= s.pipeSpeed*dt;
      if (p.x + s.pipeW < 0) { s.pipes.splice(i,1); continue; }
      const bx = s.bird.x, by = s.bird.y, br = s.bird.r;
      if (bx+br > p.x && bx-br < p.x+s.pipeW) {
        if (by-br < p.topH || by+br > p.topH+s.gap) {
          s.alive = false; s.deathAnim = 0;
          Game.beep(150, 0.3, 'sawtooth');
          Game.screenShake(6, 0.3);
          GFX.spawnParticles(s.particles, s.bird.x, s.bird.y, 15,
            { color:'#ffdd00', size:4, life:0.6, speed:200 });
        }
      }
      if (!p.passed && p.x+s.pipeW < bx) {
        p.passed = true; s.score++;
        Game.beep(1000, 0.05);
        if (s.score === 1) unlock('flappy','a1');
        if (s.score === 10) unlock('flappy','a2');
        if (s.score === 25) unlock('flappy','a3');
        if (s.score === 50) unlock('flappy','a4');
        if (s.score % 5 === 0) Game.checkpoint(this.serialize(s));
      }
    }
    if (s.bird.y + s.bird.r > s.H-40 || s.bird.y - s.bird.r < 0) {
      s.alive = false; s.deathAnim = 0;
      Game.beep(150, 0.3, 'sawtooth');
      Game.screenShake(6, 0.3);
    }
    for (let i = s.particles.length-1; i >= 0; i--) {
      const pt = s.particles[i];
      pt.x += pt.vx*dt; pt.y += pt.vy*dt; pt.life -= dt;
      pt.vx *= 0.95; pt.vy *= 0.95;
      if (pt.life <= 0) s.particles.splice(i, 1);
    }
    s.hud = `Очки: ${s.score}`;
  },
  render(ctx, s) {
    const grd = ctx.createLinearGradient(0, 0, 0, s.H);
    grd.addColorStop(0, '#4ec0ff');
    grd.addColorStop(0.5, '#8cd6f7');
    grd.addColorStop(1, '#a0e0ff');
    ctx.fillStyle = grd; ctx.fillRect(0, 0, s.W, s.H);
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    for (let i = 0; i < 5; i++) {
      const cx = ((i*140 + s.bgOffset) % (s.W+200)) - 100;
      const cy = 60 + i*80;
      ctx.beginPath();
      ctx.arc(cx, cy, 30, 0, Math.PI*2);
      ctx.arc(cx+35, cy+5, 25, 0, Math.PI*2);
      ctx.arc(cx-35, cy+5, 22, 0, Math.PI*2);
      ctx.fill();
    }
    s.pipes.forEach(p => {
      GFX.rectGrad(ctx, p.x, 0, s.pipeW, p.topH, '#5ac95a', '#1f6d1f', false);
      ctx.strokeStyle = '#1a5a1a';
      ctx.lineWidth = 3;
      ctx.strokeRect(p.x, -2, s.pipeW, p.topH+2);
      ctx.fillStyle = 'rgba(255,255,255,0.25)';
      ctx.fillRect(p.x + 8, 0, 8, p.topH);
      GFX.rectGrad(ctx, p.x, p.topH+s.gap, s.pipeW, s.H-p.topH-s.gap, '#5ac95a', '#1f6d1f', false);
      ctx.strokeRect(p.x, p.topH+s.gap, s.pipeW, s.H-p.topH-s.gap);
      ctx.fillStyle = 'rgba(255,255,255,0.25)';
      ctx.fillRect(p.x + 8, p.topH+s.gap, 8, s.H-p.topH-s.gap);
    });
    GFX.rectGrad(ctx, 0, s.H-40, s.W, 40, '#a87a4a', '#6b4f2b', true);
    GFX.rectGrad(ctx, 0, s.H-40, s.W, 8, '#6bc04a', '#3a8b2a', true);
    ctx.fillStyle = '#9bdf6a';
    for (let i = 0; i < s.W; i += 12) {
      const offset = (i + s.bgOffset * 2) % s.W;
      ctx.fillRect(offset, s.H-44, 3, 4);
    }
    const b = s.bird;
    const wingOffset = Math.sin(b.anim) * 4;
    GFX.shadow(ctx, b.x + 2, b.y + b.r, b.r, 4, 0.3);
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(Math.max(-0.6, Math.min(1.2, b.vy/500)));
    GFX.circleGrad(ctx, 0, 0, b.r, '#ffee66', '#cc9900');
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(5, -4, 5, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(6, -4, 2.5, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(7, -5, 1, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#ff7700';
    ctx.beginPath();
    ctx.moveTo(9, 2);
    ctx.lineTo(20, 5);
    ctx.lineTo(9, 9);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#e6b800';
    ctx.beginPath();
    ctx.ellipse(-4, 2 + wingOffset, 8, 5, -0.3, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
    s.particles.forEach(pt => {
      const alpha = Math.max(0, pt.life / (pt.maxLife || 0.5));
      ctx.globalAlpha = alpha;
      ctx.fillStyle = pt.color;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI*2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
    if (!s.started && s.alive) {
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(0, s.H/2-60, s.W, 120);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 22px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('ПРОБЕЛ / ЛКМ', s.W/2, s.H/2 - 10);
      ctx.font = '14px sans-serif';
      ctx.fillText('чтобы начать', s.W/2, s.H/2 + 20);
    }
    if (!s.alive) {
      ctx.fillStyle = 'rgba(0,0,0,0.7)';
      ctx.fillRect(0, s.H/2-90, s.W, 180);
      ctx.fillStyle = '#ff4d6d';
      ctx.font = 'bold 34px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('GAME OVER', s.W/2, s.H/2-30);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 24px sans-serif';
      ctx.fillText(`Очки: ${s.score}`, s.W/2, s.H/2+10);
      ctx.fillStyle = '#aaa';
      ctx.font = '13px sans-serif';
      ctx.fillText('ESC — меню', s.W/2, s.H/2+55);
    }
  },
  serialize(s) {
    return {
      score: s.score,
      preview: `Flappy: ${s.score}`
    };
  }
};
