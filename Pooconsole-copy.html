    this.spawnEnemies(s);
    return s;
  },

  spawnEnemies(s) {
    s.enemies = [];
    const count = 3 + s.round;
    const spots = [
      [22.5,3.5],[22.5,15.5],[12.5,2.5],[12.5,16.5],
      [22.5,9.5],[12.5,9.5],[18.5,9.5],[6.5,9.5],
      [10.5,3.5],[15.5,15.5]
    ];
    for (let i = 0; i < count; i++) {
      const [ex, ey] = spots[i % spots.length];
      s.enemies.push({
        x: ex*s.CS, y: ey*s.CS, angle: Math.PI,
        hp: 60 + s.round*10, maxHp: 60 + s.round*10,
        speed: 90 + s.round*8,
        state: 'patrol', cd: 0, burst: 0, lastSeen: 0,
        dir: [1,0], walkAnim: Math.random()*10, hitFlash: 0
      });
    }
  },

  collideMap(s, x, y, size) {
    const cs = s.CS;
    for (const [cx, cy] of [
      [x-size,y-size],[x+size,y-size],[x-size,y+size],[x+size,y+size]
    ]) {
      const gx = Math.floor(cx/cs), gy = Math.floor(cy/cs);
      if (gy < 0 || gy >= s.MH || gx < 0 || gx >= s.MW) return true;
      if (s.map[gy][gx] === 1) return true;
    }
    return false;
  },
  lineOfSight(s, x1, y1, x2, y2) {
    const steps = 30;
    for (let i = 1; i < steps; i++) {
      const t = i/steps;
      const x = x1 + (x2-x1)*t, y = y1 + (y2-y1)*t;
      const gx = Math.floor(x/s.CS), gy = Math.floor(y/s.CS);
      if (gy < 0 || gy >= s.MH || gx < 0 || gx >= s.MW) return false;
      if (s.map[gy][gx] === 1) return false;
    }
    return true;
  },

  update(dt, s) {
    if (!s.alive) {
      s.hud = `<div>☠ УБИТ</div><div>Карта: ${s.levelName}</div><div>ESC — меню</div>`;
      return;
    }
    const K = Game.K;
    const m = Game.mouse();
    const p = s.player;
    const cs = s.CS;

    p.walkAnim = (p.walkAnim || 0) + dt * 8;
    if (p.spawnGrace > 0) p.spawnGrace -= dt;

    if (m.rdown && !p.aiming) { p.aiming = true; p.speed = 90; }
    else if (!m.rdown && p.aiming) { p.aiming = false; p.speed = p.speedOrig; }

    if (!s.roundActive) {
      s.roundTimer -= dt;
      if (s.roundTimer <= 0) { s.roundActive = true; s.roundTimer = 0; }
    }

    p.angle = Math.atan2(m.y - p.y, m.x - p.x);

    let dx = 0, dy = 0;
    if (K('KeyW','ArrowUp')) dy--;
    if (K('KeyS','ArrowDown')) dy++;
    if (K('KeyA','ArrowLeft')) dx--;
    if (K('KeyD','ArrowRight')) dx++;
    const len = Math.hypot(dx, dy);
    if (len > 0) {
      dx /= len; dy /= len;
      const spd = p.speed * dt;
      const nx = p.x + dx*spd, ny = p.y + dy*spd;
      if (!this.collideMap(s, nx, p.y, 12)) p.x = nx;
      if (!this.collideMap(s, p.x, ny, 12)) p.y = ny;
    }

    if (K('Digit1')) p.weapon = 'pistol';
    if (K('Digit2')) p.weapon = 'mp5';
    if (K('Digit3')) p.weapon = 'ak';
    if (K('Digit4')) p.weapon = 'awp';

    const wp = p.weapons[p.weapon];

    if (p.reloading > 0) {
      p.reloading -= dt;
      if (p.reloading <= 0) {
        const need = wp.mag - wp.ammo;
        const take = Math.min(need, wp.reserve);
        wp.ammo += take; wp.reserve -= take;
        Game.beep(500, 0.1, 'sine');
      }
    }

    if (K('KeyR') && p.reloading <= 0 && wp.ammo < wp.mag && wp.reserve > 0) {
      p.reloading = wp.reload;
      Game.beep(400, 0.08, 'sine');
    }

    p.cooldown -= dt;
    p.recoilTimer -= dt;
    const wantShoot = wp.auto ? m.down : (m.down && !m.was);
    if (wantShoot && p.cooldown <= 0 && p.reloading <= 0 && wp.ammo > 0 && s.roundActive) {
      p.cooldown = wp.rate;
      wp.ammo--;
      Game.beep(wp.sound, 0.06, 'square', 0.08);
      const spread = wp.spread + (p.recoilTimer > 0 ? wp.recoil : 0) + (p.aiming ? -0.02 : 0);
      const ang = p.angle + (Math.random() - 0.5) * Math.max(0.005, spread) * 2;
      s.bullets.push({
        x: p.x + Math.cos(p.angle)*16,
        y: p.y + Math.sin(p.angle)*16,
        vx: Math.cos(ang)*900, vy: Math.sin(ang)*900,
        dmg: wp.dmg, from:'player', life: 0.7, trail: []
      });
      p.recoilTimer = 0.15;
      Game.screenShake(2, 0.08);
      GFX.spawnParticles(s.particles,
        p.x + Math.cos(p.angle)*18,
        p.y + Math.sin(p.angle)*18,
        4, { color:'#ffea00', size:3, life:0.15, speed:200, direction:p.angle, spread:0.6 }
      );
    }

    for (let i = s.bullets.length-1; i >= 0; i--) {
      const b = s.bullets[i];
      b.trail.push({ x: b.x, y: b.y });
      if (b.trail.length > 5) b.trail.shift();
      b.x += b.vx*dt; b.y += b.vy*dt; b.life -= dt;
      let dead = b.life <= 0;
      const gx = Math.floor(b.x/cs), gy = Math.floor(b.y/cs);
      if (gx < 0 || gx >= s.MW || gy < 0 || gy >= s.MH || s.map[gy][gx] === 1) dead = true;
      if (!dead && s.map[gy] && s.map[gy][gx] === 2) dead = true;
      if (!dead && b.from === 'player') {
        for (const e of s.enemies) {
          if (Math.hypot(b.x - e.x, b.y - e.y) < 14) {
            e.hp -= b.dmg;
            e.hitFlash = 0.1;
            dead = true;
            GFX.spawnParticles(s.particles, e.x, e.y, 10,
              { color:'#a01010', size:4, life:0.5, speed:200 });
            if (e.hp <= 0) {
              s.kills++;
              s.player.money += 300;
              unlock('cs2d','a1');
              if (s.kills >= 25) unlock('cs2d','a2');
            }
            break;
          }
        }
      }
      if (dead) s.bullets.splice(i, 1);
    }
    s.enemies = s.enemies.filter(e => e.hp > 0);

    for (const e of s.enemies) {
      e.cd -= dt;
      e.hitFlash = Math.max(0, e.hitFlash - dt);
      e.walkAnim += dt * 6;
      const dist = Math.hypot(p.x - e.x, p.y - e.y);
      const los = this.lineOfSight(s, e.x, e.y, p.x, p.y);
      const canSee = los && dist < 450;

      if (canSee) {
        e.state = 'attack'; e.lastSeen = 2;
        e.angle = Math.atan2(p.y - e.y, p.x - e.x);
      } else if (e.lastSeen > 0) {
        e.lastSeen -= dt; e.state = 'chase';
      } else e.state = 'patrol';

      if (e.state === 'patrol') {
        if (Math.random() < 0.01) {
          const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
          e.dir = dirs[Math.floor(Math.random()*4)];
        }
        const nx = e.x + e.dir[0]*e.speed*0.4*dt;
        const ny = e.y + e.dir[1]*e.speed*0.4*dt;
        if (!this.collideMap(s, nx, e.y, 12)) e.x = nx; else e.dir[0] *= -1;
        if (!this.collideMap(s, e.x, ny, 12)) e.y = ny; else e.dir[1] *= -1;
      } else if (e.state === 'chase') {
        const dir = Math.atan2(p.y - e.y, p.x - e.x);
        const nx = e.x + Math.cos(dir)*e.speed*dt;
        const ny = e.y + Math.sin(dir)*e.speed*dt;
        if (!this.collideMap(s, nx, e.y, 12)) e.x = nx;
        if (!this.collideMap(s, e.x, ny, 12)) e.y = ny;
        e.angle = dir;
      } else if (e.state === 'attack') {
        if (e.cd <= 0) { e.cd = 0.6 + Math.random()*0.4; e.burst = 1; }
        if (e.burst > 0) {
          const aim = e.angle + (Math.random()-0.5)*0.15;
          s.bullets.push({
            x: e.x + Math.cos(aim)*14, y: e.y + Math.sin(aim)*14,
            vx: Math.cos(aim)*750, vy: Math.sin(aim)*750,
            dmg: 8 + s.round*2, from:'enemy', life: 0.7, trail: []
          });
          Game.beep(650, 0.05, 'square', 0.05);
          e.burst = 0;
        }
      }
    }

    if (p.spawnGrace <= 0) {
      for (let i = s.bullets.length-1; i >= 0; i--) {
        const b = s.bullets[i];
        if (b.from === 'enemy' && Math.hypot(b.x - p.x, b.y - p.y) < 14) {
          p.hp -= b.dmg;
          Game.beep(180, 0.15, 'sawtooth');
          s.bullets.splice(i, 1);
          if (p.hp <= 0) s.alive = false;
        }
      }
    }

    for (let i = s.particles.length-1; i >= 0; i--) {
      const pt = s.particles[i];
      pt.x += pt.vx*dt; pt.y += pt.vy*dt; pt.life -= dt;
      pt.vx *= 0.96; pt.vy *= 0.96;
      if (pt.life <= 0) s.particles.splice(i, 1);
    }

    for (let i = s.pickups.length-1; i >= 0; i--) {
      const pk = s.pickups[i];
      pk.bob = (pk.bob || 0) + dt * 3;
      if (Math.hypot(pk.x - p.x, pk.y - p.y) < 20) {
        if (pk.type === 'health') {
          p.hp = Math.min(100, p.hp + pk.amount);
          toast('+25 HP');
        } else {
          p.weapons[p.weapon].reserve += pk.amount;
          toast('+30 патронов');
        }
        s.pickups.splice(i, 1);
        Game.beep(900, 0.1, 'sine');
        const pkCopy = { ...pk };
        setTimeout(() => { if (s) s.pickups.push(pkCopy); }, 15000);
      }
    }

    if (s.roundActive && s.enemies.length === 0) {
      s.roundActive = false; s.round++;
      s.roundTimer = 3;
      s.player.money += 500;
      Game.checkpoint(this.serialize(s));
      if (s.round > s.totalRounds) {
        unlockLevel('cs2d', s.levelIdx + 2);
        if (s.levelIdx >= 4) unlock('cs2d','a4');
        toast(`Карта ${s.levelName} пройдена!`, 'gold');
        if (s.levelIdx + 1 < this.MAPS.length) {
          setTimeout(() => {
            Game.restart('cs2d', { startLevel: s.levelIdx + 2 });
          }, 2000);
          return;
        }
      } else {
        toast(`Раунд ${s.round-1} пройден!`, 'gold');
      }
      this.spawnEnemies(s);
    }

    if (p.money >= 2500 && p.weapon === 'pistol') { p.weapon = 'mp5'; toast('Куплен MP5'); }
    if (p.money >= 5000 && p.weapon === 'mp5') { p.weapon = 'ak'; toast('Куплен AK-47'); }
    if (p.money >= 10000 && p.weapon === 'ak') { p.weapon = 'awp'; toast('Куплена AWP'); }

    s.hud = `
      <div>❤ ${p.hp} | 💰 $${p.money} | 🗺 ${s.levelName}</div>
      <div>${wp.name} ${wp.ammo}/${wp.reserve}${p.reloading > 0 ? ' ⏳' : ''}${p.aiming ? ' 🎯' : ''}</div>
      <div>Раунд ${s.round}/${s.totalRounds} | Врагов: ${s.enemies.length}</div>
    `;
  },

  render(ctx, s) {
    const cs = s.CS;
    ctx.fillStyle = '#1a1a20';
    ctx.fillRect(0, 0, s.W, s.H);
    ctx.strokeStyle = 'rgba(255,255,255,0.03)';
    ctx.lineWidth = 1;
    for (let x = 0; x < s.W; x += cs) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, s.H); ctx.stroke();
    }
    for (let y = 0; y < s.H; y += cs) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(s.W, y); ctx.stroke();
    }
    for (let y = 0; y < s.MH; y++) {
      for (let x = 0; x < s.MW; x++) {
        const v = s.map[y][x];
        const px = x*cs, py = y*cs;
        if (v === 1) {
          GFX.rectGrad(ctx, px, py, cs, cs, '#4a4a55', '#2a2a33');
          ctx.strokeStyle = '#5a5a66';
          ctx.lineWidth = 1;
          ctx.strokeRect(px + 0.5, py + 0.5, cs - 1, cs - 1);
        } else if (v === 2) {
          GFX.rectGrad(ctx, px, py, cs, cs, '#8a6438', '#6b4d2a');
          ctx.strokeStyle = '#4a3018';
          ctx.lineWidth = 2;
          ctx.strokeRect(px+3, py+3, cs-6, cs-6);
          ctx.beginPath();
          ctx.moveTo(px+3, py+cs/2);
          ctx.lineTo(px+cs-3, py+cs/2);
          ctx.stroke();
        }
      }
    }
    s.pickups.forEach(pk => {
      const bob = Math.sin(pk.bob || 0) * 3;
      if (pk.type === 'health') {
        GFX.circleGrad(ctx, pk.x, pk.y + bob, 14, '#ff5555', '#a00000');
        ctx.fillStyle = '#fff';
        ctx.fillRect(pk.x-8, pk.y-3+bob, 16, 6);
        ctx.fillRect(pk.x-3, pk.y-8+bob, 6, 16);
      } else {
        GFX.rectGrad(ctx, pk.x-10, pk.y-10+bob, 20, 20, '#ffdd44', '#aa8800');
        ctx.fillStyle = '#000';
        ctx.font = 'bold 12px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('A', pk.x, pk.y+bob+1);
      }
    });
    s.enemies.forEach(e => {
      const bob = Math.sin(e.walkAnim) * 1.5;
      GFX.shadow(ctx, e.x + 2, e.y + 16, 14, 6, 0.4);
      ctx.save();
      ctx.translate(e.x, e.y + bob);
      ctx.rotate(e.angle);
      const isFlash = e.hitFlash > 0;
      GFX.circleGrad(ctx, 0, 0, 14,
        isFlash ? '#ffffff' : '#e05050',
        isFlash ? '#cccccc' : '#8a2020');
      ctx.fillStyle = '#f2c8a0';
      ctx.beginPath();
      ctx.arc(4, 0, 6, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(6, -2, 1.5, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = '#222';
      ctx.fillRect(6, -2, 16, 4);
      ctx.fillStyle = '#444';
      ctx.fillRect(6, -2, 16, 2);
      ctx.restore();
      const hpw = 30 * (e.hp / e.maxHp);
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(e.x-15, e.y-24, 30, 4);
      ctx.fillStyle = e.hp/e.maxHp > 0.5 ? '#4dffa3' : e.hp/e.maxHp > 0.25 ? '#ffcf40' : '#ff4d6d';
      ctx.fillRect(e.x-15, e.y-24, hpw, 4);
    });
    s.bullets.forEach(b => {
      if (b.trail && b.trail.length > 1) {
        ctx.strokeStyle = b.from === 'player' ? 'rgba(255,238,85,0.4)' : 'rgba(255,85,85,0.4)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(b.trail[0].x, b.trail[0].y);
        for (let i = 1; i < b.trail.length; i++) {
          ctx.lineTo(b.trail[i].x, b.trail[i].y);
        }
        ctx.lineTo(b.x, b.y);
        ctx.stroke();
      }
      GFX.circleGrad(ctx, b.x, b.y, 4,
        b.from === 'player' ? '#ffffff' : '#ffcccc',
        b.from === 'player' ? '#ffea00' : '#ff0000');
    });
    s.particles.forEach(pt => {
      const alpha = Math.max(0, pt.life / (pt.maxLife || 0.5));
      ctx.globalAlpha = alpha;
      ctx.fillStyle = pt.color;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI*2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;

    if (s.alive) {
      const p = s.player;
      const bob = Math.sin(p.walkAnim) * 1;
      GFX.shadow(ctx, p.x + 2, p.y + 16, 14, 6, 0.4);
      ctx.save();
      ctx.translate(p.x, p.y + bob);
      ctx.rotate(p.angle);
      if (p.spawnGrace > 0) ctx.globalAlpha = 0.5 + Math.sin(Date.now()/80) * 0.5;
      GFX.circleGrad(ctx, 0, 0, 14, '#5abf5a', '#1e5a1e');
      ctx.fillStyle = '#f2c8a0';
      ctx.beginPath();
      ctx.arc(4, 0, 6, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(6, -2, 1.5, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = '#222';
      const wpn = p.weapon;
      if (wpn === 'awp') { ctx.fillRect(6, -2, 26, 4); ctx.fillStyle = '#4a4'; ctx.fillRect(2, -3, 6, 6); }
      else if (wpn === 'ak') { ctx.fillRect(6, -2, 20, 5); ctx.fillStyle = '#c93'; ctx.fillRect(4, -3, 8, 6); }
      else if (wpn === 'mp5') { ctx.fillRect(6, -2, 16, 4); }
      else { ctx.fillRect(6, -2, 10, 3); }
      ctx.restore();
      ctx.globalAlpha = 1;

      const m = Game.mouse();
      ctx.strokeStyle = '#0f0';
      ctx.lineWidth = 1.5;
      const spread = 12 + (wp.spread + (p.recoilTimer > 0 ? wp.recoil : 0)) * 200;
      ctx.beginPath();
      ctx.moveTo(m.x - spread, m.y); ctx.lineTo(m.x - 4, m.y);
      ctx.moveTo(m.x + 4, m.y); ctx.lineTo(m.x + spread, m.y);
      ctx.moveTo(m.x, m.y - spread); ctx.lineTo(m.x, m.y - 4);
      ctx.moveTo(m.x, m.y + 4); ctx.lineTo(m.x, m.y + spread);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(m.x, m.y, 2, 0, Math.PI*2);
      ctx.stroke();
    } else {
      ctx.fillStyle = 'rgba(0,0,0,0.75)';
      ctx.fillRect(0, s.H/2-80, s.W, 160);
      ctx.fillStyle = '#ff4d6d';
      ctx.font = 'bold 44px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('ВЫ УБИТЫ', s.W/2, s.H/2);
      ctx.fillStyle = '#fff';
      ctx.font = '18px monospace';
      ctx.fillText(`Карта: ${s.levelName} • Раунд ${s.round}`, s.W/2, s.H/2+40);
    }

    // Мини-радар
    const rs = 120;
    const rx = s.W - rs - 10, ry = 10;
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(rx, ry, rs, rs);
    ctx.strokeStyle = '#0f0';
    ctx.lineWidth = 1;
    ctx.strokeRect(rx, ry, rs, rs);
    const scale = rs / (s.MW * cs);
    for (let y = 0; y < s.MH; y++) {
      for (let x = 0; x < s.MW; x++) {
        if (s.map[y][x] === 1) {
          ctx.fillStyle = 'rgba(90,90,100,0.5)';
          ctx.fillRect(rx + x*cs*scale, ry + y*cs*scale, cs*scale, cs*scale);
        }
      }
    }
    s.enemies.forEach(e => {
      ctx.fillStyle = '#f44';
      ctx.beginPath();
      ctx.arc(rx + e.x*scale, ry + e.y*scale, 2.5, 0, Math.PI*2);
      ctx.fill();
    });
    if (s.alive) {
      ctx.fillStyle = '#4f4';
      ctx.beginPath();
      ctx.arc(rx + s.player.x*scale, ry + s.player.y*scale, 3, 0, Math.PI*2);
      ctx.fill();
    }

    if (!s.roundActive && s.roundTimer > 0) {
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(0, s.H/2-40, s.W, 80);
      ctx.fillStyle = '#ffcf40';
      ctx.font = 'bold 32px monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(`РАУНД ${s.round}`, s.W/2, s.H/2);
    }
  },

  serialize(s) {
    return {
      player: { x: s.player.x, y: s.player.y, hp: s.player.hp, money: s.player.money, weapon: s.player.weapon },
      round: s.round, kills: s.kills,
      startLevel: s.levelIdx + 1,
      preview: `CS 2D: ${s.levelName}, раунд ${s.round}`
    };
  }
};

/* ============================================================
   KIRBY — 8 уровней
   ============================================================ */
const KirbyGame = {
  init(load) {
    const W = 800, H = 480;
    const level = (load && load.startLevel ? load.startLevel : 1);
    const worldW = 2400 + (level - 1) * 200;
    const s = {
      W, H, level, totalLevels: 8,
      player: { x: 80, y: H-100, vx: 0, vy: 0, w: 32, h: 32, onGround: false, facing: 1, jumpAnim: 0, walkAnim: 0 },
      enemies: [], coins: [], platforms: [],
      camera: { x: 0, y: 0 },
      worldW, score: 0, stars: 0,
      alive: true, jumps: 0,
      particles: [], deathAnim: 0,
      goalX: worldW - 100, hud: ''
    };
    for (let x = 0; x < worldW; x += 40) {
      s.platforms.push({ x, y: H-40, w: 40, h: 40 });
    }
    const holesCount = 2 + level;
    for (let i = 0; i < holesCount; i++) {
      const hx = 400 + i * 250 + Math.random() * 100;
      const hw = 60 + Math.random() * 60;
      for (let j = s.platforms.length-1; j >= 0; j--) {
        if (s.platforms[j].x >= hx && s.platforms[j].x < hx + hw) s.platforms.splice(j, 1);
      }
    }
    const platCount = 10 + level * 2;
    for (let i = 0; i < platCount; i++) {
      const px = 200 + i * (worldW / platCount);
      const py = H - 140 - Math.random() * 180;
      const pw = 80 + Math.random() * 80;
      s.platforms.push({ x: px, y: py, w: pw, h: 20 });
    }
    const enemyCount = 6 + level * 2;
    for (let i = 0; i < enemyCount; i++) {
      s.enemies.push({
        x: 300 + i * (worldW - 400) / enemyCount,
        y: H - 100, w: 28, h: 28,
        vx: 60 + level * 10, alive: true,
        walkAnim: Math.random()*10
      });
    }
    for (let i = 0; i < 25 + level * 3; i++) {
      s.coins.push({
        x: 150 + i * (worldW - 300) / (25 + level * 3),
        y: H - 150 - (i % 5) * 40,
        got: false, r: 10, bob: Math.random()*6
      });
    }
    if (load) {
      if (load.score) s.score = load.score;
      if (load.stars) s.stars = load.stars;
    }
    return s;
  },

  update(dt, s) {
    const K = Game.K;
    if (!s.alive) {
      s.deathAnim += dt;
      s.player.vy += 600 * dt;
      s.player.y += s.player.vy * dt;
      for (let i = s.particles.length-1; i >= 0; i--) {
        const p = s.particles[i];
        p.x += p.vx*dt; p.y += p.vy*dt; p.life -= dt; p.vy += 400*dt;
        if (p.life <= 0) s.particles.splice(i, 1);
      }
      s.hud = `Очки: ${s.score}`;
      return;
    }
    const p = s.player;
    p.vy += 900 * dt;
    p.walkAnim += dt * 6;

    if (K('Space','KeyW','ArrowUp')) {
      if (p.onGround && !s._jumpLock) {
        p.vy = -400;
        p.onGround = false;
        s._jumpLock = true;
        p.jumpAnim = 0.2;
        Game.beep(700, 0.06);
        s.jumps = (s.jumps || 0) + 1;
        if (s.jumps === 50) unlock('kirby','a2');
        GFX.spawnParticles(s.particles, p.x + p.w/2, p.y + p.h, 5,
          { color:'rgba(255,255,255,0.8)', size:3, life:0.3, speed:80, direction: Math.PI/2, spread:1 });
      } else if (!p.onGround && p.vy > 0) {
        p.vy = Math.min(p.vy, 60);
      }
    } else s._jumpLock = false;
    p.jumpAnim = Math.max(0, (p.jumpAnim || 0) - dt);

    let dx = 0;
    if (K('KeyA','ArrowLeft')) dx = -1;
    if (K('KeyD','ArrowRight')) dx = 1;
    p.vx = dx * 220;
    if (dx !== 0) {
      p.facing = dx;
      if (p.onGround && Math.random() < 0.2) {
        GFX.spawnParticles(s.particles, p.x + p.w/2, p.y + p.h, 1,
          { color:'rgba(200,200,200,0.6)', size:3, life:0.3, speed:50, direction: Math.PI, spread:1 });
      }
    }
    p.x += p.vx * dt;
    p.x = Math.max(0, Math.min(s.worldW - p.w, p.x));
    p.y += p.vy * dt;

    p.onGround = false;
    for (const pl of s.platforms) {
      if (p.x + p.w > pl.x && p.x < pl.x + pl.w &&
          p.y + p.h > pl.y && p.y + p.h < pl.y + pl.h + 20 && p.vy > 0) {
        p.y = pl.y - p.h;
        p.vy = 0;
        p.onGround = true;
      }
    }
    if (p.y > s.H + 50) { s.alive = false; s.deathAnim = 0; Game.screenShake(8, 0.3); Game.beep(150, 0.4, 'sawtooth'); }

    for (const e of s.enemies) {
      if (!e.alive) continue;
      e.walkAnim += dt * 6;
      e.x += e.vx * dt;
      if (e.x < 0 || e.x > s.worldW) e.vx *= -1;
      if (Math.abs(e.x - p.x) < 40 && Math.abs(e.y - p.y) < 40) {
        if (p.vy > 0 && p.y < e.y - 10) {
          e.alive = false;
          p.vy = -300;
          s.score += 100;
          Game.beep(900, 0.1);
          Game.screenShake(3, 0.15);
          GFX.spawnParticles(s.particles, e.x + e.w/2, e.y + e.h/2, 10,
            { color:'#ffb6c1', size:5, life:0.5, speed:180 });
          unlock('kirby','a1');
        } else {
          s.alive = false; s.deathAnim = 0;
          Game.screenShake(8, 0.3);
          Game.beep(150, 0.4, 'sawtooth');
        }
      }
    }
    for (const c of s.coins) {
      if (c.got) continue;
      c.bob += dt * 4;
      if (Math.hypot(c.x - p.x - p.w/2, c.y - p.y - p.h/2) < 24) {
        c.got = true;
        s.stars++;
        s.score += 10;
        Game.beep(1200, 0.05);
        GFX.spawnParticles(s.particles, c.x, c.y, 6,
          { color:'#ffcf40', size:3, life:0.4, speed:150 });
        if (s.stars === 10) unlock('kirby','a3');
      }
    }
    if (p.x > s.goalX) {
      unlockLevel('kirby', s.level + 1);
      if (s.level >= 8) unlock('kirby','a4');
      Game.checkpoint(this.serialize(s));
      toast(`Уровень ${s.level} пройден!`, 'gold');
      if (s.level < 8) {
        setTimeout(() => Game.restart('kirby', { startLevel: s.level + 1, score: s.score, stars: s.stars }), 1500);
        s.alive = false;
      }
    }
    for (let i = s.particles.length-1; i >= 0; i--) {
      const pt = s.particles[i];
      pt.x += pt.vx*dt; pt.y += pt.vy*dt; pt.life -= dt;
      pt.vx *= 0.96; pt.vy *= 0.96;
      if (pt.life <= 0) s.particles.splice(i, 1);
    }
    GFX.lerpCamera(s.camera, Math.max(0, Math.min(s.worldW - s.W, p.x - s.W/2)), 0, 6);
    s.hud = `🌸 Ур. ${s.level}/8 | ⭐ ${s.stars} | Очки: ${s.score}`;
  },

  render(ctx, s) {
    const grd = ctx.createLinearGradient(0, 0, 0, s.H);
    grd.addColorStop(0, '#87ceeb');
    grd.addColorStop(0.6, '#bfe5f7');
    grd.addColorStop(1, '#e8f6ff');
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, s.W, s.H);

    ctx.save();
    ctx.translate(-s.camera.x, -s.camera.y);

    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    for (let i = 0; i < 10; i++) {
      const cx = i*350 + 100;
      const cy = 60 + (i%3)*40;
      ctx.beginPath();
      ctx.arc(cx, cy, 30, 0, Math.PI*2);
      ctx.arc(cx+30, cy+5, 25, 0, Math.PI*2);
      ctx.arc(cx-30, cy+5, 22, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.fillStyle = 'rgba(100,180,100,0.4)';
    for (let i = 0; i < 8; i++) {
      const hx = i * 400;
      ctx.beginPath();
      ctx.arc(hx, s.H - 30, 200, Math.PI, 0);
      ctx.fill();
    }
    s.platforms.forEach(pl => {
      GFX.rectGrad(ctx, pl.x, pl.y, pl.w, pl.h, '#6b9b3a', '#3a6b1a');
      GFX.rectGrad(ctx, pl.x, pl.y, pl.w, 6, '#8bc54a', '#6b9b3a');
      ctx.fillStyle = '#9bd54a';
      for (let i = 0; i < pl.w; i += 15) {
        ctx.fillRect(pl.x + i + 3, pl.y - 3, 2, 3);
      }
    });
    const goalX = s.goalX;
    ctx.fillStyle = '#ffcf40';
    ctx.fillRect(goalX, s.H - 240, 8, 200);
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.moveTo(goalX + 8, s.H - 240);
    ctx.lineTo(goalX + 8, s.H - 200);
    ctx.lineTo(goalX + 60, s.H - 220);
    ctx.closePath();
    ctx.fill();

    s.coins.forEach(c => {
      if (c.got) return;
      const bob = Math.sin(c.bob) * 3;
      const scaleX = Math.abs(Math.cos(c.bob * 2));
      ctx.save();
      ctx.translate(c.x, c.y + bob);
      ctx.scale(scaleX, 1);
      GFX.circleGrad(ctx, 0, 0, 10, '#fff89a', '#cc9900');
      ctx.strokeStyle = '#8a6a10';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, 0, 10, 0, Math.PI*2);
      ctx.stroke();
      ctx.restore();
    });

    s.enemies.forEach(e => {
      if (!e.alive) return;
      const bob = Math.sin(e.walkAnim) * 2;
      GFX.shadow(ctx, e.x + e.w/2, e.y + e.h + 3, e.w/2, 3, 0.3);
      const cx = e.x + e.w/2, cy = e.y + e.h/2 + bob;
      GFX.circleGrad(ctx, cx, cy, e.w/2, '#e09060', '#8a4a20');
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(cx - 5, cy - 3, 4, 0, Math.PI*2);
      ctx.arc(cx + 5, cy - 3, 4, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(cx - 5, cy - 3, 2, 0, Math.PI*2);
      ctx.arc(cx + 5, cy - 3, 2, 0, Math.PI*2);
      ctx.fill();
    });

    if (s.alive || s.deathAnim < 1) {
      const p = s.player;
      const bob = s.alive ? Math.sin(p.walkAnim) * 1.5 : 0;
      GFX.shadow(ctx, p.x + p.w/2, p.y + p.h + 4, p.w/2, 4, 0.3);
      const cx = p.x + p.w/2, cy = p.y + p.h/2 + bob;
      GFX.circleGrad(ctx, cx, cy, p.w/2, '#ffe0e8', '#ff8ca8');
      ctx.fillStyle = '#ff8ca8';
      ctx.beginPath();
      ctx.arc(cx - 12, cy + 8, 6, 0, Math.PI*2);
      ctx.arc(cx + 12, cy + 8, 6, 0, Math.PI*2);
      ctx.fill();
      GFX.shine(ctx, cx - 6, cy - 8, 6, 4, 0.5);
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.ellipse(cx - 5, cy - 4, 2, 4, 0, 0, Math.PI*2);
      ctx.ellipse(cx + 5, cy - 4, 2, 4, 0, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,100,150,0.6)';
      ctx.beginPath();
      ctx.arc(cx - 10, cy + 3, 3, 0, Math.PI*2);
      ctx.arc(cx + 10, cy + 3, 3, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = '#c9304d';
      ctx.beginPath();
      ctx.arc(cx, cy + 3, 3, 0, Math.PI);
      ctx.fill();
      if (!p.onGround && p.vy > 0) {
        ctx.fillStyle = 'rgba(255,255,255,0.7)';
        for (let i = 0; i < 4; i++) {
          const a = (Date.now()/100 + i * Math.PI/2) % (Math.PI*2);
          ctx.beginPath();
          ctx.arc(cx + Math.cos(a) * 18, cy + Math.sin(a) * 18, 2, 0, Math.PI*2);
          ctx.fill();
        }
      }
    }
    s.particles.forEach(pt => {
      const alpha = Math.max(0, pt.life / (pt.maxLife || 0.5));
      ctx.globalAlpha = alpha;
      ctx.fillStyle = pt.color;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI*2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
    ctx.restore();

    if (!s.alive) {
      ctx.fillStyle = 'rgba(0,0,0,0.7)';
      ctx.fillRect(0, s.H/2-80, s.W, 160);
      ctx.fillStyle = '#ff4d6d';
      ctx.font = 'bold 36px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('GAME OVER', s.W/2, s.H/2);
      ctx.fillStyle = '#fff';
      ctx.font = '18px sans-serif';
      ctx.fillText(`Уровень ${s.level} • Очки: ${s.score}`, s.W/2, s.H/2 + 34);
    }
  },

  serialize(s) {
    return {
      startLevel: s.level, score: s.score, stars: s.stars,
      player: { x: s.player.x, y: s.player.y },
      preview: `Kirby: ур.${s.level}/8`
    };
  }
};

/* ============================================================
   MARIO — 8 уровней
   ============================================================ */
const MarioGame = {
  init(load) {
    const W = 800, H = 480;
    const level = (load && load.startLevel ? load.startLevel : 1);
    const worldW = 3000 + level * 200;
    const s = {
      W, H, level, totalLevels: 8,
      player: { x: 80, y: H-100, vx: 0, vy: 0, w: 28, h: 36, onGround: false, facing: 1, walkAnim: 0 },
      platforms: [], enemies: [], coins: [], blocks: [], particles: [],
      camera: { x: 0, y: 0 },
      worldW, score: 0, coinsGot: 0, jumps: 0, distance: 0,
      alive: true, deathAnim: 0,
      goalX: worldW - 100, hud: ''
    };
    for (let x = 0; x < worldW; x += 40) {
      s.platforms.push({ x, y: H-40, w: 40, h: 40 });
    }
    const holeCount = 3 + level;
    for (let i = 0; i < holeCount; i++) {
      const hx = 400 + i * (worldW / holeCount) + Math.random() * 100;
      const hw = 80 + Math.random() * 80;
      for (let j = s.platforms.length-1; j >= 0; j--) {
        if (s.platforms[j].x >= hx && s.platforms[j].x < hx + hw) s.platforms.splice(j, 1);
      }
    }
    const platCount = 12 + level * 2;
    for (let i = 0; i < platCount; i++) {
      const px = 200 + i * (worldW / platCount);
      const py = H - 140 - Math.random() * 180;
      const pw = 80 + Math.random() * 60;
      s.platforms.push({ x: px, y: py, w: pw, h: 20 });
    }
    const enemyCount = 6 + level * 2;
    for (let i = 0; i < enemyCount; i++) {
      s.enemies.push({
        x: 400 + i * (worldW - 500) / enemyCount,
        y: H-72, w: 24, h: 24,
        vx: 60 + level * 8, alive: true,
        walkAnim: Math.random()*10
      });
    }
    for (let i = 0; i < 40 + level * 3; i++) {
      s.coins.push({
        x: 150 + i * (worldW - 300) / (40 + level * 3),
        y: H-100 - (i%5)*30, got: false, r: 8, bob: Math.random()*6
      });
    }
    const blockCount = 4 + level;
    for (let i = 0; i < blockCount; i++) {
      s.blocks.push({
        x: 250 + i * (worldW - 500) / blockCount,
        y: H-160, w: 32, h: 32, hit: false, bob: 0
      });
    }
    if (load) {
      if (load.score) s.score = load.score;
      if (load.coinsGot) s.coinsGot = load.coinsGot;
      if (load.jumps) s.jumps = load.jumps;
      if (load.distance) s.distance = load.distance;
    }
    return s;
  },

  update(dt, s) {
    const K = Game.K;
    if (!s.alive) {

      s.player.y += s.player.vy * dt;
      for (let i = s.particles.length-1; i >= 0; i--) {
        const p = s.particles[i];
        p.x += p.vx*dt; p.y += p.vy*dt; p.life -= dt; p.vy += 400*dt;
        if (p.life <= 0) s.particles.splice(i, 1);
      }
      return;
    }
    const p = s.player;
    p.vy += 1100 * dt;
    p.walkAnim += dt * 8;

    if (K('Space','KeyW','ArrowUp') && p.onGround && !s._jumpLock) {
      p.vy = -450;
      p.onGround = false;
      s._jumpLock = true;
      s.jumps++;
      Game.beep(600, 0.06);
      GFX.spawnParticles(s.particles, p.x + p.w/2, p.y + p.h, 5,
        { color:'rgba(200,200,200,0.6)', size:3, life:0.3, speed:100, direction: Math.PI/2, spread:1 });
      if (s.jumps === 50) unlock('mario','a2');
    }
    if (!K('Space','KeyW','ArrowUp')) s._jumpLock = false;

    let dx = 0;
    if (K('KeyA','ArrowLeft')) dx = -1;

    p.x += p.vx * dt;

    p.y += p.vy * dt;

    for (const pl of s.platforms) {
      if (p.x + p.w > pl.x && p.x < pl.x + pl.w &&
          p.y + p.h > pl.y && p.y + p.h < pl.y + pl.h + 20 && p.vy > 0) {

  render(ctx, s) {

    for (let i = 0; i < 10; i++) {

      } else {
        const bob = Math.sin(b.bob) * 1;

    });
    s.coins.forEach(c => {
