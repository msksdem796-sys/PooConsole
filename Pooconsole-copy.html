<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>PooConsole</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-tap-highlight-color:transparent; }
html, body {
  height:100%; overflow:hidden;
  background:#05070d; color:#d6e8ff;
  font-family:system-ui, Arial, sans-serif;
}
#boot {
  position:fixed; inset:0; z-index:99999;
  background:radial-gradient(circle at 50% 40%, #1a2444, #05070d 80%);
  display:flex; align-items:center; justify-content:center;
  flex-direction:column; gap:20px;
  transition:opacity .8s ease;
}
#boot.hide { opacity:0; pointer-events:none; }
#boot svg {
  width:min(240px, 40vw); height:auto;
  filter:drop-shadow(0 0 60px rgba(255,150,0,.9));
  animation:bootPulse 1.5s ease-in-out infinite;
}
@keyframes bootPulse {
  0%, 100% { transform:scale(1); opacity:1; }
  50%      { transform:scale(1.04); opacity:.92; }
}
#boot .boot-title {
  font-weight:900; font-size:clamp(20px, 3.5vw, 34px);
  letter-spacing:6px;
  background:linear-gradient(90deg,#ff6a00,#ffcf40,#00e0ff);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  filter:drop-shadow(0 0 16px rgba(255,150,0,.5));
}
#boot .boot-bar-wrap {
  width:min(300px, 50vw); height:4px;
  background:rgba(255,255,255,.1); border-radius:2px;
  overflow:hidden; margin-top:12px;
}
#boot .boot-bar {
  width:0%; height:100%;
  background:linear-gradient(90deg,#ff6a00,#ffcf40);
  box-shadow:0 0 12px #ffcf40;
  transition:width 2.2s linear;
}
#boot .boot-msg {
  font-family:monospace; font-size:11px;
  color:#6b7a99; letter-spacing:2px; margin-top:6px;
}
#auth {
  position:fixed; inset:0; z-index:9999;
  background:radial-gradient(circle at 50% 40%, #1a2444, #05070d 80%);
  display:flex; align-items:center; justify-content:center;
  padding:20px; overflow-y:auto;
  transition:opacity .5s ease;
}
#auth.hide { opacity:0; pointer-events:none; }
.auth-box {
  width:min(440px, 100%);
  background:linear-gradient(160deg, #121a2e, #0a1020);
  border:1px solid #00e0ff; border-radius:18px;
  padding:32px 28px;
  box-shadow:0 0 60px rgba(0,224,255,.25);
  text-align:center;
}
.auth-box .logo-svg { width:70px; height:80px; margin:0 auto 12px;
  filter:drop-shadow(0 0 20px rgba(255,150,0,.7)); }
.auth-box h1 {
  font-weight:900; font-size:24px; letter-spacing:4px;
  background:linear-gradient(90deg,#ff6a00,#ffcf40,#00e0ff);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  margin-bottom:6px;
}
.auth-box .sub {
  font-size:11px; color:#6b7a99; letter-spacing:2px;
  text-transform:uppercase; margin-bottom:22px;
}
.auth-tabs {
  display:flex; margin-bottom:20px;
  border:1px solid #24365e; border-radius:10px; overflow:hidden;
}
.auth-tab {
  flex:1; padding:12px; text-align:center;
  cursor:pointer; font-weight:700; font-size:13px;
  letter-spacing:1px; transition:all .2s;
  background:#0a1020; color:#6b7a99; text-transform:uppercase;
}
.auth-tab.active {
  background:linear-gradient(90deg, rgba(0,224,255,.15), rgba(0,255,163,.15));
  color:#00e0ff;
  box-shadow:inset 0 0 20px rgba(0,224,255,.15);
}
.auth-field { margin-bottom:14px; text-align:left; }
.auth-field label {
  display:block; font-size:11px; color:#6b7a99;
  letter-spacing:1px; margin-bottom:6px; text-transform:uppercase;
}
.auth-field input {
  width:100%; padding:12px 14px;
  background:#0a1020; border:1px solid #24365e;
  border-radius:10px; color:#d6e8ff;
  font-size:14px; font-family:inherit;
  outline:none; transition:all .15s;
}
.auth-field input:focus {
  border-color:#00e0ff;
  box-shadow:0 0 12px rgba(0,224,255,.3);
}
.auth-field input.err {
  border-color:#ff4d6d;
  box-shadow:0 0 12px rgba(255,77,109,.3);
}
.auth-field .hint { font-size:10px; color:#6b7a99; margin-top:5px; }
.pwd-hint {
  font-size:11px; color:#6b7a99;
  margin-top:6px; display:flex;
  justify-content:space-between; align-items:center;
}
.strength { display:flex; gap:3px; }
.strength .bar {
  width:16px; height:5px; background:#24365e;
  border-radius:2px; transition:background .2s;
}
.strength.s1 .bar:nth-child(1) { background:#ff4d6d; }
.strength.s2 .bar:nth-child(1),
.strength.s2 .bar:nth-child(2) { background:#ffcf40; }
.strength.s3 .bar:nth-child(1),
.strength.s3 .bar:nth-child(2),
.strength.s3 .bar:nth-child(3) { background:#4dffa3; }
.strength-label { font-size:10px; letter-spacing:1px; font-weight:700; }
.auth-btn {
  width:100%; padding:14px; border:none; border-radius:10px;
  background:linear-gradient(90deg, #00e0ff, #00ffa3);
  color:#001; font-size:14px; font-weight:800;
  letter-spacing:2px; cursor:pointer; transition:all .15s;
  text-transform:uppercase; margin-top:8px;
}
.auth-btn:hover {
  transform:translateY(-2px);
  box-shadow:0 8px 24px rgba(0,224,255,.5);
}
.auth-btn:disabled { opacity:.5; cursor:not-allowed; }
.auth-err { color:#ff4d6d; font-size:12px; min-height:18px; margin-top:10px; }
.accounts-list {
  margin-top:16px; border-top:1px solid #24365e;
  padding-top:14px; text-align:left;
}
.accounts-list .lbl {
  font-size:10px; color:#6b7a99;
  letter-spacing:1px; margin-bottom:8px; text-transform:uppercase;
}
.account-chip {
  display:inline-block; padding:6px 12px; margin:3px;
  background:#0a1020; border:1px solid #24365e;
  border-radius:20px; font-size:11px;
  color:#d6e8ff; cursor:pointer;
  transition:all .15s; font-family:monospace;
}
.account-chip:hover {
  border-color:#00e0ff; background:rgba(0,224,255,.1);
}
.logout-btn {
  position:absolute; top:16px; right:16px; z-index:100;
  padding:6px 14px; border:1px solid #24365e;
  border-radius:8px; background:#121a2e;
  color:#d6e8ff; cursor:pointer;
  font-size:11px; font-weight:700;
  letter-spacing:1px; transition:all .15s;
  display:flex; align-items:center; gap:6px;
}
.logout-btn:hover {
  border-color:#ff4d6d;
  background:rgba(255,77,109,.1); color:#ffb3c1;
}
#console {
  width:100vw; height:100vh;
  display:flex; flex-direction:column;
  background:linear-gradient(160deg, #101828, #060a14);
  overflow:hidden;
  opacity:0; transition:opacity .6s ease;
  position:relative;
}
#console.show { opacity:1; }
#top {
  height:46px; background:#0d1424; border-bottom:1px solid #24365e;
  display:flex; align-items:center; padding:0 16px; gap:12px;
  flex-shrink:0;
}
#top .led {
  width:10px; height:10px; border-radius:50%;
  background:#00e0ff; box-shadow:0 0 12px #00e0ff;
  animation:pulse 2s infinite;
}
@keyframes pulse { 50% { opacity:.4; } }
#top .logo-svg { width:32px; height:32px; flex-shrink:0; }
#top .brand {
  font-weight:800; letter-spacing:3px; color:#00e0ff;
  font-size:15px; text-shadow:0 0 12px rgba(0,224,255,.5);
}
#top .spacer { flex:1; }
#top .user-badge {
  font-size:11px; color:#00ffa3;
  background:rgba(0,255,163,.1);
  border:1px solid rgba(0,255,163,.3);
  padding:4px 10px; border-radius:12px;
  font-family:monospace; letter-spacing:1px;
}
#top .clock {
  font-size:12px; color:#6b7a99;
  font-variant-numeric:tabular-nums;
}
#stage {
  flex:1; position:relative; margin:12px; border-radius:14px;
  background:#04060c; border:1px solid #1c2745; overflow:hidden;
  min-height:0;
}
#stage canvas {
  display:block; position:absolute; inset:0; margin:auto;
  max-width:100%; max-height:100%; cursor:none; outline:none;
}
#ui { position:absolute; inset:0; display:flex; flex-direction:column; }
#ui.hidden { display:none; }
#scan {
  position:absolute; inset:0; pointer-events:none; z-index:999;
  background:repeating-linear-gradient(180deg,
    rgba(255,255,255,.02) 0 1px, transparent 1px 3px);
}
#bottom {
  height:46px; background:#0d1424; border-top:1px solid #24365e;
  display:flex; align-items:center; justify-content:center;
  gap:20px; font-size:11px; color:#6b7a99;
  flex-shrink:0;
}
#bottom b { color:#00e0ff; }
.screen { flex:1; padding:24px; display:flex; flex-direction:column; overflow:hidden; }
.scroll { flex:1; overflow-y:auto; padding-right:6px; }
.scroll::-webkit-scrollbar { width:6px; }
.scroll::-webkit-scrollbar-thumb { background:#24365e; border-radius:3px; }
.title-block {
  display:flex; align-items:center; justify-content:center;
  gap:20px; margin-bottom:6px;
}
.title-block svg { width:64px; height:64px;
  filter:drop-shadow(0 0 16px rgba(255,150,0,.6)); }
.title {
  font-size:44px; font-weight:900; letter-spacing:5px;
  background:linear-gradient(90deg, #ff6a00, #ffcf40, #00e0ff);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  filter:drop-shadow(0 0 16px rgba(255,150,0,.4));
}
.sub {
  text-align:center; color:#6b7a99; letter-spacing:2px;
  font-size:12px; text-transform:uppercase; margin-bottom:22px;
}
.menu {
  display:flex; flex-direction:column; gap:10px;
  max-width:420px; margin:0 auto; width:100%;
}
.item {
  display:flex; align-items:center; gap:12px;
  padding:13px 18px; background:#121a2e;
  border:1px solid #24365e; border-radius:10px;
  cursor:pointer; transition:all .15s; font-weight:600;
}
.item:hover {
  border-color:#00e0ff; transform:translateX(4px);
  box-shadow:0 0 18px rgba(0,224,255,.25);
}
.item .ic {
  width:34px; height:34px; display:flex; align-items:center;
  justify-content:center; background:#060c18;
  border-radius:8px; font-size:18px;
}
.item .tx { flex:1; }
.item .mt { font-size:11px; color:#6b7a99; font-weight:400; }
.btn {
  padding:10px 22px; border:1px solid #00e0ff;
  border-radius:8px; background:rgba(0,224,255,.1);
  color:#d6e8ff; font-size:13px; font-weight:700;
  letter-spacing:1px; cursor:pointer; transition:all .15s;
  text-transform:uppercase;
}
.btn:hover {
  background:rgba(0,224,255,.25);
  box-shadow:0 0 16px rgba(0,224,255,.5);
}
.btn.dg {
  border-color:#ff4d6d; background:rgba(255,77,109,.1); color:#ffb3c1;
}
.btn.dg:hover {
  background:rgba(255,77,109,.25);
  box-shadow:0 0 16px rgba(255,77,109,.5);
}
.btn.warn {
  border-color:#ff9800; background:rgba(255,152,0,.1); color:#ffcc80;
}
.btn.warn:hover {
  background:rgba(255,152,0,.25);
  box-shadow:0 0 16px rgba(255,152,0,.5);
}
.btn.sm { padding:6px 12px; font-size:11px; }
.btn.wide { width:100%; text-align:center; }
.hd {
  display:flex; align-items:center; gap:12px; margin-bottom:16px;
}
.hd h2 {
  font-size:20px; letter-spacing:2px; color:#00e0ff;
  flex:1; text-shadow:0 0 12px rgba(0,224,255,.5);
}
.back {
  padding:6px 14px; border:1px solid #24365e;
  border-radius:6px; background:#121a2e;
  color:#d6e8ff; cursor:pointer; font-size:12px;
  font-weight:600; transition:all .15s;
}
.back:hover { border-color:#00e0ff; }
.grid {
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(200px, 1fr));
  gap:14px;
}
.card {
  background:#121a2e; border:1px solid #24365e;
  border-radius:12px; padding:16px; cursor:pointer;
  transition:all .2s; position:relative; overflow:hidden;
}
.card:hover {
  transform:translateY(-3px); border-color:#00e0ff;
  box-shadow:0 6px 24px rgba(0,224,255,.25);
}
.card.featured { border-color:#ffcf40;
  background:linear-gradient(160deg, rgba(255,207,64,.08), #121a2e); }
.card.nintendo { border-color:#ff4d6d;
  background:linear-gradient(160deg, rgba(255,77,109,.08), #121a2e); }
.card.exported { border-color:#ff9800;
  background:linear-gradient(160deg, rgba(255,152,0,.1), #121a2e); }
.card.featured::before,
.card.nintendo::before,
.card.exported::before {
  content:'NEW'; position:absolute; top:8px; right:8px;
  font-size:9px; font-weight:800; letter-spacing:1px;
  padding:2px 6px; border-radius:4px; color:#000;
}
.card.featured::before { background:#ffcf40; }
.card.nintendo::before { background:#ff4d6d; color:#fff; }
.card.exported::before {
  content:'ЭКС'; background:#ff9800; color:#000;
}
.card .card-icon {
  width:48px; height:48px; margin-bottom:10px;
  display:block;
}
.card .ct { font-size:16px; font-weight:700; margin-bottom:4px; }
.card .cd {
  font-size:11px; color:#6b7a99;
  line-height:1.4; margin-bottom:8px; min-height:28px;
}
.card .cs {
  display:flex; justify-content:space-between;
  font-size:10px; color:#6b7a99;
  border-top:1px solid #24365e; padding-top:6px;
}
.card .cs .a { color:#ffcf40; }
.card .progress-bar {
  margin-top:8px; height:4px;
  background:#0a1020; border-radius:2px;
  overflow:hidden; border:1px solid #24365e;
}
.card .progress-fill {
  height:100%; background:linear-gradient(90deg,#00e0ff,#00ffa3);
  transition:width .3s;
}
.slot {
  display:flex; align-items:center; gap:14px;
  padding:14px 18px; background:#121a2e;
  border:1px solid #24365e; border-radius:10px;
  margin-bottom:10px; transition:all .15s;
}
.slot.clickable { cursor:pointer; }
.slot.clickable:hover { border-color:#00e0ff; transform:translateX(3px); }
.slot .n {
  width:38px; height:38px; display:flex;
  align-items:center; justify-content:center;
  border-radius:8px; background:#060c18;
  border:1px solid #00e0ff; color:#00e0ff;
  font-weight:800; flex-shrink:0;
}
.slot .n.empty { border-color:#24365e; color:#6b7a99; }
.slot .i { flex:1; }
.slot .i .st { font-weight:700; font-size:14px; margin-bottom:3px; }
.slot .i .sd { font-size:11px; color:#6b7a99; }
.slot .ac { display:flex; gap:6px; }
.ach {
  display:flex; align-items:center; gap:12px;
  padding:12px 16px; background:#121a2e;
  border:1px solid #24365e; border-radius:10px;
  margin-bottom:8px; transition:all .2s;
}
.ach.on {
  border-color:#ffcf40;
  background:linear-gradient(90deg, rgba(255,207,64,.08), #121a2e);
}
.ach.off { opacity:.5; }
.ach .ai {
  width:36px; height:36px; display:flex;
  align-items:center; justify-content:center;
  border-radius:8px; background:#060c18;
  border:1px solid #24365e; font-size:18px; flex-shrink:0;
}
.ach.on .ai { border-color:#ffcf40; }
.ach .at { font-weight:700; font-size:13px; margin-bottom:2px; }
.ach .ad { font-size:11px; color:#6b7a99; }
.ach .ai2 { flex:1; }
.ach .st {
  font-size:10px; font-weight:700; letter-spacing:1px;
  padding:3px 8px; border-radius:12px;
}
.ach.on .st { background:rgba(255,207,64,.2); color:#ffcf40; }
.ach.off .st { background:rgba(107,122,153,.15); color:#6b7a99; }
#toasts {
  position:absolute; top:16px; right:16px; z-index:1000;
  display:flex; flex-direction:column; gap:8px; pointer-events:none;
}
.toast {
  padding:10px 16px; background:#121a2e;
  border:1px solid #00e0ff; border-left:4px solid #00e0ff;
  border-radius:8px; font-size:12px; font-weight:600;
  box-shadow:0 4px 20px rgba(0,0,0,.5);
  animation:ti .3s, to .3s 2.7s forwards; max-width:280px;
}
.toast.g {
  border-color:#ffcf40; border-left-color:#ffcf40;
  box-shadow:0 4px 20px rgba(255,207,64,.3);
}
.toast.err {
  border-color:#ff4d6d; border-left-color:#ff4d6d;
  box-shadow:0 4px 20px rgba(255,77,109,.3);
}
.toast.warn {
  border-color:#ff9800; border-left-color:#ff9800;
  box-shadow:0 4px 20px rgba(255,152,0,.3);
}
@keyframes ti { from { opacity:0; transform:translateX(30px); } }
@keyframes to { to { opacity:0; transform:translateX(30px); } }
.modal {
  position:absolute; inset:0; background:rgba(2,5,12,.88);
  display:flex; align-items:center; justify-content:center; z-index:1001;
}
.modal .box {
  background:#121a2e; border:1px solid #00e0ff;
  border-radius:14px; padding:24px 28px;
  max-width:520px; width:90%; max-height:90%;
  overflow-y:auto; text-align:center;
  box-shadow:0 0 50px rgba(0,224,255,.3);
}
.modal h3 { color:#00e0ff; font-size:18px;
  margin-bottom:10px; letter-spacing:1px; }
.modal p { font-size:13px; margin-bottom:18px;
  line-height:1.5; color:#d6e8ff; }
.modal .row {
  display:flex; gap:10px; justify-content:center; flex-wrap:wrap;
}
.modal .row .btn.wide { width:100%; }
.modal textarea {
  width:100%; padding:12px;
  background:#060c18; border:1px solid #24365e;
  border-radius:8px; color:#d6e8ff;
  font-size:12px; font-family:monospace;
  outline:none; resize:vertical;
  min-height:200px; margin-bottom:12px;
  transition:border-color .15s;
}
.modal textarea:focus { border-color:#00e0ff; }
.modal input[type="text"] {
  width:100%; padding:12px;
  background:#060c18; border:1px solid #24365e;
  border-radius:8px; color:#d6e8ff;
  font-size:13px; font-family:monospace;
  outline:none; margin-bottom:12px;
  transition:border-color .15s;
}
.modal input[type="text"]:focus { border-color:#00e0ff; }
.level-grid {
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(60px, 1fr));
  gap:8px; margin-bottom:16px; max-height:280px;
  overflow-y:auto; padding-right:6px;
}
.level-btn {
  padding:14px 8px; text-align:center;
  background:#0a1020; border:1px solid #24365e;
  border-radius:10px; cursor:pointer;
  font-weight:800; font-size:15px;
  color:#6b7a99; transition:all .15s;
  position:relative;
}
.level-btn:hover { border-color:#00e0ff; color:#d6e8ff; transform:translateY(-2px); }
.level-btn.unlocked {
  background:linear-gradient(160deg, rgba(0,224,255,.1), #0a1020);
  color:#00e0ff; border-color:#00e0ff;
}
.level-btn.current {
  background:linear-gradient(160deg, rgba(255,207,64,.15), #0a1020);
  color:#ffcf40; border-color:#ffcf40;
}
.level-btn.locked::after {
  content:'🔒'; position:absolute; top:2px; right:4px;
  font-size:9px; opacity:.6;
}
.file-drop {
  padding:32px; border:2px dashed #24365e;
  border-radius:12px; background:#0a1020;
  text-align:center; margin-bottom:12px;
  cursor:pointer; transition:all .2s;
}
.file-drop:hover, .file-drop.drag {
  border-color:#ff9800; background:rgba(255,152,0,.05);
}
.file-drop .fd-icon { font-size:32px; display:block; margin-bottom:8px; }
.file-drop .fd-text { font-size:12px; color:#6b7a99; }
#autosave {
  position:absolute; bottom:10px; right:14px;
  font-size:10px; color:#00ffa3; opacity:0;
  transition:opacity .3s; letter-spacing:1px; z-index:100;
}
#autosave.on { opacity:1; }
#checkpoint {
  position:absolute; top:12px; left:50%;
  transform:translateX(-50%);
  padding:6px 16px;
  background:rgba(0,255,163,.15);
  border:1px solid #00ffa3; border-radius:20px;
  font-size:11px; font-weight:700; color:#00ffa3;
  letter-spacing:1px; opacity:0; transition:opacity .3s;
  z-index:100; pointer-events:none;
}
#checkpoint.on { opacity:1; }
#hud {
  position:absolute; top:10px; left:10px; right:10px;
  display:flex; justify-content:space-between;
  pointer-events:none; font-family:monospace;
  font-weight:700; color:#fff; font-size:14px;
  text-shadow:0 0 6px #000, 0 0 3px #000; z-index:5;
}
.hidden { display:none !important; }
</style>
</head>

<div id="boot">
  <svg viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="bootGh" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#ff8c1a"/>
        <stop offset="100%" stop-color="#ff6a00"/>
      </linearGradient>

const GAMES = {};
function registerGame(id, gameObj) {
  if (!gameObj || typeof gameObj.init !== 'function' ||
      typeof gameObj.update !== 'function' ||
      typeof gameObj.render !== 'function') {
    console.error('[PooConsole] Некорректная игра:', id, gameObj);
    return false;
  }
  GAMES[id] = gameObj;
  console.log('[PooConsole] Зарегистрирована игра:', id);
  return true;
}
function unregisterGame(id) {
  delete GAMES[id];
}
// Функция, которую вызывают части 2 и 3, чтобы отдать свой реестр
window.__registerGames = function(obj) {
  if (!obj || typeof obj !== 'object') return;
  for (const id in obj) {
    registerGame(id, obj[id]);
  }
};

const USERS_KEY = 'pooconsole_users_v4';
const CURRENT_KEY = 'pooconsole_current_user_v4';
const DB_PREFIX = 'pooconsole_db_v4_';

function getUsers() {
  try { return JSON.parse(localStorage.getItem(USERS_KEY)) || {}; }
  catch(e) { return {}; }
}
function saveUsers(u) {
  try { localStorage.setItem(USERS_KEY, JSON.stringify(u)); } catch(e) {}
}
function setCurrentUser(login) {
  if (login) localStorage.setItem(CURRENT_KEY, login);
  else localStorage.removeItem(CURRENT_KEY);
}
function dbKey(login) { return DB_PREFIX + login; }

function defData() {
  const g = {};
  for (const k in META) g[k] = {
    slots:[null,null,null],
    checkpoints:[],
    ach:{},
    progress: { unlockedLevels: 1, currentLevel: 1 }
  };
  return {
    created:Date.now(),
    settings:{ scan:true, sound:true },
    games:g,
    cartridges: [] // Экспортированные игры
  };
}

let DB = defData();
let CURRENT_USER = null;

function loadDB(login) {
  CURRENT_USER = login;
  try {
    const raw = localStorage.getItem(dbKey(login));
    if (raw) {
      DB = JSON.parse(raw);
      if (!DB || !DB.games) DB = defData();
      if (!Array.isArray(DB.cartridges)) DB.cartridges = [];
      const d = defData();
      for (const k in d.games) {
        if (!DB.games[k]) DB.games[k] = d.games[k];
        if (!Array.isArray(DB.games[k].slots)) DB.games[k].slots = [null,null,null];
        if (!Array.isArray(DB.games[k].checkpoints)) DB.games[k].checkpoints = [];
        if (!DB.games[k].ach) DB.games[k].ach = {};
        if (!DB.games[k].progress) DB.games[k].progress = { unlockedLevels:1, currentLevel:1 };
      }
      DB.settings = Object.assign(d.settings, DB.settings || {});
    } else {
      DB = defData();
      save();
    }
  } catch(e) {
    DB = defData();
  }
}

function save() {
  if (!CURRENT_USER) return;
  try { localStorage.setItem(dbKey(CURRENT_USER), JSON.stringify(DB)); } catch(e) {}
}
function resetAll() { DB = defData(); save(); }

function evalStrength(pwd) {
  if (pwd.length < 6) return 0;
  if (/^(\d)\1+$/.test(pwd)) return 1;
  let asc = true, desc = true;
  for (let i = 1; i < pwd.length; i++) {
    if (+pwd[i] - +pwd[i-1] !== 1) asc = false;
    if (+pwd[i] - +pwd[i-1] !== -1) desc = false;
  }
  if (asc || desc) return 2;
  return 3;
}
function strengthLabel(n) {
  return ['—', 'Слабый', 'Средний', 'Сильный'][n];
}

(function setupAuth() {
  const auth     = document.getElementById('auth');
  const tabs     = document.querySelectorAll('.auth-tab');
  const loginIn  = document.getElementById('authLogin');
  const pwdIn    = document.getElementById('authPassword');
  const btn      = document.getElementById('authBtn');
  const errEl    = document.getElementById('authErr');
  const hint     = document.getElementById('pwdHint');
  const strength = document.getElementById('pwdStrength');
  const loginHint= document.getElementById('loginHint');
  const listWrap = document.getElementById('accountsList');
  const listChip = document.getElementById('accountsChips');

  let mode = 'login';

  function updateTabs() {
    tabs.forEach(t => t.classList.toggle('active', t.dataset.tab === mode));
    btn.textContent = mode === 'login' ? 'Войти' : 'Создать аккаунт';
    hint.style.display = mode === 'register' ? 'flex' : 'none';
    loginHint.style.display = mode === 'register' ? 'block' : 'none';
    errEl.textContent = '';
    loginIn.classList.remove('err');
    pwdIn.classList.remove('err');
    renderAccounts();
  }

  tabs.forEach(t => t.onclick = () => { mode = t.dataset.tab; updateTabs(); });

  loginIn.addEventListener('input', () => {
    loginIn.value = loginIn.value.replace(/[^a-zA-Z0-9_]/g, '');
  });

  pwdIn.addEventListener('input', () => {
    pwdIn.value = pwdIn.value.replace(/\D/g, '');
    if (mode === 'register') {
      const st = evalStrength(pwdIn.value);
      strength.className = 'strength';
      if (st > 0) strength.classList.add('s' + st);
      let lbl = document.getElementById('strengthLabel');
      if (!lbl) {
        lbl = document.createElement('span');
        lbl.id = 'strengthLabel';
        lbl.className = 'strength-label';
        hint.appendChild(lbl);
      }
      lbl.textContent = strengthLabel(st);
    }
  });

  function renderAccounts() {
    const users = getUsers();
    const logins = Object.keys(users);
    if (logins.length === 0) { listWrap.style.display = 'none'; return; }
    listWrap.style.display = 'block';
    listChip.innerHTML = logins.map(l =>
      `<span class="account-chip" data-login="${l}">${l}</span>`
    ).join('');
    listChip.querySelectorAll('.account-chip').forEach(chip => {
      chip.onclick = () => {
        mode = 'login';
        tabs.forEach(t => t.classList.toggle('active', t.dataset.tab === 'login'));
        btn.textContent = 'Войти';
        hint.style.display = 'none';
        loginHint.style.display = 'none';
        loginIn.value = chip.dataset.login;
        pwdIn.value = '';
        pwdIn.focus();
        errEl.textContent = '';
      };
    });
  }

  function submit() {
    errEl.textContent = '';
    loginIn.classList.remove('err');
    pwdIn.classList.remove('err');
    const login = loginIn.value.trim();
    const pwd = pwdIn.value;
    if (!/^[a-zA-Z0-9_]{3,20}$/.test(login)) {
      errEl.textContent = 'Логин: латиница, цифры, _ (3–20)';
      loginIn.classList.add('err'); return;
    }
    if (!/^\d{6,}$/.test(pwd)) {
      errEl.textContent = 'Пароль: минимум 6 цифр';
      pwdIn.classList.add('err'); return;
    }
    const users = getUsers();
    if (mode === 'register') {
      if (users[login]) { errEl.textContent = 'Логин занят'; loginIn.classList.add('err'); return; }
      users[login] = { pwd, created:Date.now() };
      saveUsers(users);
      localStorage.setItem(dbKey(login), JSON.stringify(defData()));
      enterConsole(login);
    } else {
      if (!users[login]) { errEl.textContent = 'Аккаунт не найден'; loginIn.classList.add('err'); return; }
      if (users[login].pwd !== pwd) { errEl.textContent = 'Неверный пароль'; pwdIn.classList.add('err'); return; }
      enterConsole(login);
    }
  }

  btn.onclick = submit;
  [loginIn, pwdIn].forEach(inp => {
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
  });

  renderAccounts();
  window.__openAuth = function() {
    auth.classList.remove('hide');
    updateTabs();
  };
})();

function enterConsole(login) {

  document.getElementById('logoutUser').textContent = login;

  stack = []; current = null;
  go(screenMain, false);
}

function loadCartridges() {
  if (!DB.cartridges || !Array.isArray(DB.cartridges)) return;
  DB.cartridges.forEach(cart => {
    try {
      // Парсим код в функцию
      const factory = new Function('return (' + cart.code + ')');
      const gameObj = factory();
      if (gameObj && typeof gameObj.init === 'function' &&
          typeof gameObj.update === 'function' &&
          typeof gameObj.render === 'function') {
        registerGame(cart.id, gameObj);
        // Добавляем в META если нет
        if (!META[cart.id]) {
          META[cart.id] = {
            id: cart.id,
            title: cart.name,
            icon: cart.icon || '🎮',
            desc: cart.desc || 'Экспортированная игра',
            levels: cart.levels || 1,
            exported: true,
            ach: cart.ach || []
          };
        }
        // Прогресс в БД
        if (!DB.games[cart.id]) {
          DB.games[cart.id] = {
            slots:[null,null,null], checkpoints:[], ach:{},
            progress:{ unlockedLevels:1, currentLevel:1 }
          };
        }
      } else {
        console.warn('[PooConsole] Картридж повреждён:', cart.id);
      }
    } catch(e) {
      console.error('[PooConsole] Ошибка загрузки картриджа', cart.id, e);
    }
  });
}

function importCartridge(codeText, filename) {
  try {
    // Парсим мета из комментариев
    const lines = codeText.split('\n');
    let meta = {
      name: filename ? filename.replace(/\.txt$/i, '') : 'Экспорт',
      author: '',
      icon: '🎮',
      desc: 'Импортированная игра',
      levels: 1
    };
    lines.forEach(line => {
      const m = line.match(/^\s*\/\/\s*(имя|название|name):\s*(.+)$/i);
      if (m) meta.name = m[2].trim();
      const a = line.match(/^\s*\/\/\s*(автор|author):\s*(.+)$/i);
      if (a) meta.author = a[2].trim();
      const i = line.match(/^\s*\/\/\s*(иконка|icon):\s*(.+)$/i);
      if (i) meta.icon = i[2].trim();
      const d = line.match(/^\s*\/\/\s*(описание|desc):\s*(.+)$/i);
      if (d) meta.desc = d[2].trim();
      const l = line.match(/^\s*\/\/\s*(уровней|levels):\s*(\d+)$/i);
      if (l) meta.levels = parseInt(l[2]) || 1;
    });

    // Парсим сам объект игры
    const factory = new Function('return (' + codeText + ')');
    const gameObj = factory();

    if (!gameObj || typeof gameObj.init !== 'function' ||
        typeof gameObj.update !== 'function' ||
        typeof gameObj.render !== 'function') {
      throw new Error('Код не содержит корректный объект игры (нужны init, update, render)');
    }

    // Генерируем уникальный ID
    const id = 'exp_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);

    // Регистрируем игру
    registerGame(id, gameObj);

    // Мета
    const cart = {
      id,
      name: meta.name,
      author: meta.author,
      icon: meta.icon,
      desc: meta.desc,
      levels: meta.levels,
      code: codeText,
      createdAt: Date.now()
    };
    DB.cartridges.push(cart);

    // Добавляем в META
    META[id] = {
      id,
      title: meta.name,
      icon: meta.icon,
      desc: meta.desc,
      levels: meta.levels,
      exported: true,
      ach: []
    };

    // Добавляем прогресс
    DB.games[id] = {
      slots:[null,null,null], checkpoints:[], ach:{},
      progress:{ unlockedLevels:1, currentLevel:1 }
    };

    save();
    return cart;
  } catch(e) {
    throw e;
  }
}

function deleteCartridge(id) {
  const idx = DB.cartridges.findIndex(c => c.id === id);
  if (idx !== -1) {
    DB.cartridges.splice(idx, 1);
    unregisterGame(id);
    delete META[id];
    delete DB.games[id];
    save();
  }
}

                           type === 'err' ? ' err' :
                           type === 'warn' ? ' warn' : '');

}

function modal(title, text, buttons) {
  const m = document.createElement('div');
  m.className = 'modal';
  m.innerHTML = `<div class="box">
    <h3>${title}</h3>
    <p>${text}</p>
    <div class="row">${buttons.map((b,i) =>
      `<button class="btn ${b.dg?'dg':''} ${b.wide?'wide':''}" data-i="${i}">${b.t}</button>`
    ).join('')}</div>
  </div>`;
  STAGE.appendChild(m);
  m.querySelectorAll('[data-i]').forEach(btn => {
    btn.onclick = () => {
      m.remove();
      buttons[+btn.dataset.i].f();

function unlock(gid, aid) {
  const g = DB.games[gid];
  if (!g || g.ach[aid]) return;
  g.ach[aid] = Date.now();
  save();
  const meta = META[gid] && META[gid].ach ? META[gid].ach.find(a => a.id === aid) : null;
  if (meta) toast(`<b style="color:#ffcf40">🏆 ДОСТИЖЕНИЕ</b><br>${meta.t}`, 'gold');
}
function isUnlocked(gid, aid) { return DB.games[gid] && DB.games[gid].ach[aid]; }
function countAch(gid) { return Object.keys(DB.games[gid].ach || {}).length; }
function totalAch() {
  return Object.values(META).reduce((s,m) => s + (m.ach ? m.ach.length : 0), 0);
}
function totalUnlocked() {
  return Object.keys(META).reduce((s,k) => s + countAch(k), 0);
}

function getLevelsCount(gid) { return META[gid].levels || 1; }
function getProgress(gid) {
  const g = DB.games[gid];
  if (!g.progress) g.progress = { unlockedLevels:1, currentLevel:1 };
  return g.progress;
}
function unlockLevel(gid, level) {
  const p = getProgress(gid);
  if (level > p.unlockedLevels) {
    p.unlockedLevels = Math.min(getLevelsCount(gid), level);
    save();
  }
}
function setCurrentLevel(gid, level) {
  const p = getProgress(gid);
  p.currentLevel = level;
  save();
}
function levelProgressPercent(gid) {
  const p = getProgress(gid);
  const total = getLevelsCount(gid);
  return Math.round(((p.unlockedLevels - 1) / Math.max(1, total - 1)) * 100);
}

function saveSlot(gid, idx, data) {
  DB.games[gid].slots[idx] = { ts:Date.now(), data };
  save();
}
function loadSlot(gid, idx) {
  const s = DB.games[gid].slots[idx];
  return s ? s.data : null;
}
function delSlot(gid, idx) {
  DB.games[gid].slots[idx] = null;
  save();
}
function addCheckpoint(gid, data) {
  const g = DB.games[gid];
  g.checkpoints.push({ ts:Date.now(), data });
  if (g.checkpoints.length > 5) g.checkpoints.shift();
  save();
  checkInd();
}
function lastCheckpoint(gid) {
  const g = DB.games[gid];
  if (!g.checkpoints || g.checkpoints.length === 0) return null;
  return g.checkpoints[g.checkpoints.length - 1].data;
}
function hasCheckpoint(gid) {
  return DB.games[gid].checkpoints && DB.games[gid].checkpoints.length > 0;
}
function countCheckpoints(gid) {
  return DB.games[gid].checkpoints ? DB.games[gid].checkpoints.length : 0;
}
function resetGame(gid) {
  DB.games[gid] = {
    slots:[null,null,null], checkpoints:[], ach:{},
    progress:{ unlockedLevels:1, currentLevel:1 }
  };
  save();
}

let stack = [];
let current = null;

function go(fn, keepStack) {
  if (current && keepStack) stack.push(current);
  current = fn;
  UIel.innerHTML = '';
  fn();
}

function back() {
  if (typeof Game !== 'undefined' && Game.isRunning && Game.isRunning()) return;
  if (stack.length) {
    const prev = stack.pop();
    current = prev;
    UIel.innerHTML = '';
    prev();
  } else {
    go(screenMain, false);
  }
}

/* ============================================================
   СПИСОК ИГР
   ============================================================ */
function screenGames() {
  const games = Object.values(META);
  const cards = games.map(m => {
    const a = countAch(m.id);
    const p = getProgress(m.id);
    const total = m.levels || 1;
    const pct = levelProgressPercent(m.id);
    const lvTxt = total > 1 ? `${p.unlockedLevels}/${total} ур.` : '∞';
    let cls = '';
    if (m.featured) cls = 'featured';
    else if (m.nintendo) cls = 'nintendo';
    else if (m.exported) cls = 'exported';
    const achTotal = m.ach ? m.ach.length : 0;
    // Иконка
    let iconHTML;
    if (typeof m.icon === 'string' && ICONS[m.icon]) {
      iconHTML = `<div class="card-icon">${ICONS[m.icon]}</div>`;
    } else if (typeof m.icon === 'string' && m.icon.length > 4) {
      iconHTML = `<div class="card-icon">${m.icon}</div>`;
    } else {
      iconHTML = `<div class="card-icon" style="font-size:42px;text-align:center;line-height:48px">${m.icon || '🎮'}</div>`;
    }
    return `<div class="card ${cls}" data-g="${m.id}">
      ${iconHTML}
      <div class="ct">${m.title}</div>
      <div class="cd">${m.desc}</div>
      <div class="cs">
        <span class="a">🏆 ${a}/${achTotal}</span>
        <span>🎯 ${lvTxt}</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" style="width:${pct}%"></div>
      </div>
    </div>`;
  }).join('');

  UIel.innerHTML = `<div class="screen">
    <div class="hd"><button class="back" data-b>← Назад</button>
      <h2>🎮 ИГРЫ</h2>
      <button class="btn warn sm" data-import>📥 Импорт</button></div>
    <div class="scroll"><div class="grid">${cards}</div></div>
  </div>`;

  UIel.querySelector('[data-b]').onclick = back;
  UIel.querySelector('[data-import]').onclick = openCartridgeImport;
  UIel.querySelectorAll('.card').forEach(c => {
    c.onclick = () => go(() => screenPre(c.dataset.g), true);
  });
}

/* ============================================================
   ПРЕД-МЕНЮ ИГРЫ
   ============================================================ */
function screenPre(gid) {
  const m = META[gid];
  if (!m) { back(); return; }
  const g = DB.games[gid];
  if (!g) { back(); return; }
  const progress = getProgress(gid);
  const totalLevels = m.levels || 1;

  const slots = g.slots.map((s, i) => {
    const info = s
      ? new Date(s.ts).toLocaleString('ru-RU') +
        (s.data && s.data.preview ? ' • ' + s.data.preview : '')
      : 'Пусто';
    return `<div class="slot">
      <div class="n ${s ? '' : 'empty'}">${i + 1}</div>
      <div class="i">
        <div class="st">${s ? 'Сохранение' : 'Пустой слот'}</div>
        <div class="sd">${info}</div>
      </div>
      <div class="ac">
        ${s ? `<button class="btn sm" data-l="${i}">Загрузить</button>
               <button class="btn sm dg" data-d="${i}">✕</button>` : ''}
      </div>
    </div>`;
  }).join('');

  const cps = hasCheckpoint(gid)
    ? `<div class="slot clickable" data-cp>
         <div class="n">💾</div>
         <div class="i">
           <div class="st">Последний чекпоинт</div>
           <div class="sd">${new Date(g.checkpoints[g.checkpoints.length-1].ts).toLocaleString('ru-RU')}</div>
         </div>
         <div class="ac">
           <button class="btn sm" data-cpl>Продолжить</button>
         </div>
       </div>`
    : '';

  const achs = (m.ach || []).map(a => {
    const on = isUnlocked(gid, a.id);
    return `<div class="ach ${on ? 'on' : 'off'}">
      <div class="ai">${on ? a.i : '🔒'}</div>
      <div class="ai2">
        <div class="at">${a.t}</div>
        <div class="ad">${a.d}</div>
      </div>
      <div class="st">${on ? 'ОТКРЫТО' : 'ЗАКРЫТО'}</div>
    </div>`;
  }).join('') || '<div style="color:#6b7a99;font-size:12px;text-align:center;padding:12px">У этой игры нет достижений</div>';

  let levelGrid = '';
  if (totalLevels > 1) {
    levelGrid = `<h3 style="font-size:12px;letter-spacing:2px;color:#6b7a99;margin:18px 0 10px">
      ВЫБОР УРОВНЯ (открыто: ${progress.unlockedLevels}/${totalLevels})</h3>
      <div class="level-grid">` +
      Array.from({ length: totalLevels }, (_, i) => i + 1).map(lv => {
        const unlocked = lv <= progress.unlockedLevels;
        const isCurrent = lv === progress.currentLevel;
        const cls = !unlocked ? 'locked' : isCurrent ? 'unlocked current' : 'unlocked';
        return `<div class="level-btn ${cls}" data-lv="${lv}">${lv}</div>`;
      }).join('') + `</div>`;
  }

  // Иконка игры
  let iconHTML;
  if (typeof m.icon === 'string' && ICONS[m.icon]) {
    iconHTML = `<span style="display:inline-block;width:32px;height:32px;vertical-align:middle;margin-right:8px">${ICONS[m.icon]}</span>`;
  } else {
    iconHTML = `<span style="margin-right:8px">${m.icon || '🎮'}</span>`;
  }

  UIel.innerHTML = `<div class="screen">
    <div class="hd"><button class="back" data-b>← Назад</button>
      <h2>${iconHTML}${m.title}</h2>
      ${m.exported ? '<button class="btn dg sm" data-del-cart>🗑 Удалить картридж</button>' : ''}
    </div>
    <div class="scroll">
      <div style="display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap">
        <button class="btn" data-play>▶ Новая игра</button>
        ${hasCheckpoint(gid) ? '<button class="btn" data-quick-cp>💾 С чекпоинта</button>' : ''}
      </div>
      ${levelGrid}
      ${cps ? `<h3 style="font-size:12px;letter-spacing:2px;color:#6b7a99;margin:18px 0 10px">БЫСТРЫЙ СТАРТ</h3>${cps}` : ''}
      <h3 style="font-size:12px;letter-spacing:2px;color:#6b7a99;margin:18px 0 10px">СОХРАНЕНИЯ</h3>
      ${slots}
      <h3 style="font-size:12px;letter-spacing:2px;color:#6b7a99;margin:18px 0 10px">
        ДОСТИЖЕНИЯ (${countAch(gid)}/${(m.ach||[]).length})</h3>
      ${achs}
      <div style="margin-top:18px;padding-top:14px;border-top:1px solid #24365e">
        <button class="btn dg" data-rg>⚠️ Сбросить данные игры</button>
      </div>
    </div>
  </div>`;

  UIel.querySelector('[data-b]').onclick = back;
  UIel.querySelector('[data-play]').onclick = () => {
    console.log('[PooConsole] Запуск игры:', gid, 'GAMES:', Object.keys(GAMES));
    if (typeof Game === 'undefined') {
      toast('Движок не загружен (Часть 2)', 'err');
      return;
    }
    if (!GAMES[gid]) {
      toast('Игра не зарегистрирована', 'err');
      return;
    }
    Game.start(gid, { startLevel: getProgress(gid).currentLevel });
  };
  const qcp = UIel.querySelector('[data-quick-cp]');
  if (qcp) qcp.onclick = () => {
    const d = lastCheckpoint(gid);
    if (d) Game.start(gid, d);
  };

  const delCart = UIel.querySelector('[data-del-cart]');
  if (delCart) delCart.onclick = () => {
    modal('Удалить картридж?',
      `Игра "${m.title}" будет полностью удалена с её сохранениями и достижениями.`,
      [
        { t:'Удалить', dg:true, f:() => {
            deleteCartridge(gid);
            toast('Картридж удалён', 'warn');
            go(screenGames, false);
        }},
        { t:'Отмена', f:() => {} }
      ]);
  };

  UIel.querySelectorAll('[data-lv]').forEach(b => {
    b.onclick = () => {
      const lv = +b.dataset.lv;
      if (lv > getProgress(gid).unlockedLevels) {
        toast('Уровень заблокирован', 'warn');
        return;
      }
      setCurrentLevel(gid, lv);
      if (typeof Game === 'undefined' || !GAMES[gid]) {
        toast('Игра не загружена', 'err');
        return;
      }
      Game.start(gid, { startLevel: lv });
    };
  });

  const cpb = UIel.querySelector('[data-cpl]');
  if (cpb) cpb.onclick = () => {
    const d = lastCheckpoint(gid);
    if (d) Game.start(gid, d);
  };

  UIel.querySelectorAll('[data-l]').forEach(b => {
    b.onclick = () => {
      const d = loadSlot(gid, +b.dataset.l);
      if (d) Game.start(gid, d);
    };
  });
  UIel.querySelectorAll('[data-d]').forEach(b => {
    b.onclick = () => {
      const i = +b.dataset.d;
      modal('Удалить сохранение?', `Слот ${i+1} будет очищен.`,
        [
          { t:'Удалить', dg:true, f:() => {
              delSlot(gid, i); go(() => screenPre(gid), false);
          }},
          { t:'Отмена', f:() => {} }
        ]);
    };
  });
  UIel.querySelector('[data-rg]').onclick = () => {
    modal('Сбросить данные игры?',
      `Все сохранения, чекпоинты, прогресс и достижения "${m.title}" будут удалены.`,
      [
        { t:'Сбросить', dg:true, f:() => {
            resetGame(gid); toast('Данные игры сброшены');
            go(() => screenPre(gid), false);
        }},
        { t:'Отмена', f:() => {} }
      ]);
  };
}

/* ============================================================
   ИМПОРТ КАРТРИДЖА
   ============================================================ */
function openCartridgeImport() {
  const m = document.createElement('div');
  m.className = 'modal';
  m.innerHTML = `<div class="box" style="max-width:600px">
    <h3>📥 ИМПОРТ КАРТРИДЖА</h3>
    <p>Загрузи .txt файл или вставь код игры вручную</p>

    <div class="file-drop" id="fileDrop">
      <span class="fd-icon">📄</span>
      <div class="fd-text">Перетащи .txt сюда или нажми для выбора</div>
      <input type="file" id="fileInput" accept=".txt,text/plain" style="display:none">
    </div>

    <textarea id="cartCode" placeholder="// имя: Моя игра
// автор: Автор
// иконка: 🎮
// описание: Моё описание
// уровней: 1

{
  init(load) { return { W: 800, H: 480, hud: '' }; },
  update(dt, s) { s.hud = 'работает'; },
  render(ctx, s) {
    ctx.fillStyle = '#123';
    ctx.fillRect(0, 0, s.W, s.H);
    ctx.fillStyle = '#fff';
    ctx.font = '20px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('Привет, PooConsole!', s.W/2, s.H/2);
  },
  serialize(s) { return { preview: 'моя игра' }; }
}"></textarea>

    <div class="row">
      <button class="btn" data-ok>Импортировать</button>
      <button class="btn dg" data-cancel>Отмена</button>
    </div>
  </div>`;
  STAGE.appendChild(m);

  const fileDrop = m.querySelector('#fileDrop');
  const fileInput = m.querySelector('#fileInput');
  const codeArea = m.querySelector('#cartCode');

  fileDrop.onclick = () => fileInput.click();
  fileDrop.addEventListener('dragover', e => {
    e.preventDefault();
    fileDrop.classList.add('drag');
  });
  fileDrop.addEventListener('dragleave', () => {
    fileDrop.classList.remove('drag');
  });
  fileDrop.addEventListener('drop', e => {
    e.preventDefault();
    fileDrop.classList.remove('drag');
    if (e.dataTransfer.files.length) {
      readFile(e.dataTransfer.files[0]);
    }
  });
  fileInput.onchange = () => {
    if (fileInput.files.length) readFile(fileInput.files[0]);
  };

  function readFile(file) {
    const r = new FileReader();
    r.onload = ev => {
      codeArea.value = ev.target.result;
      toast('Файл загружен: ' + file.name);
    };
    r.readAsText(file);
  }

  m.querySelector('[data-cancel]').onclick = () => m.remove();
  m.querySelector('[data-ok]').onclick = () => {
    const code = codeArea.value.trim();
    if (!code) { toast('Пустой код', 'err'); return; }
    try {
      const cart = importCartridge(code, 'custom.txt');
      toast(`✅ Картридж "${cart.name}" импортирован`, 'warn');
      m.remove();
      go(screenGames, false);
    } catch(e) {
      toast('Ошибка: ' + e.message, 'err');
      console.error(e);
    }
  };
}

function downloadTemplate() {
  const template = `// имя: Моя игра
// автор: Ваше имя
// иконка: 🎮
// описание: Короткое описание игры
// уровней: 1

{
  init(load) {
    return {
      W: 800,
      H: 480,
      hud: 'Моя игра',
      // твои поля
      player: { x: 400, y: 240, r: 20, color: '#00e0ff' }
    };
  },

  update(dt, s) {
    // Управление — клавиши через Game.K('KeyW', 'ArrowUp')
    // Мышь — Game.mouse() -> { x, y, down }
    const K = Game.K;
    if (K('KeyA','ArrowLeft')) s.player.x -= 200 * dt;
    if (K('KeyD','ArrowRight')) s.player.x += 200 * dt;
    if (K('KeyW','ArrowUp')) s.player.y -= 200 * dt;
    if (K('KeyS','ArrowDown')) s.player.y += 200 * dt;

    s.hud = 'Позиция: ' + Math.round(s.player.x) + ', ' + Math.round(s.player.y);
  },

  render(ctx, s) {
    // Фон
    ctx.fillStyle = '#0a0a14';
    ctx.fillRect(0, 0, s.W, s.H);

    // Персонаж
    ctx.fillStyle = s.player.color;
    ctx.beginPath();
    ctx.arc(s.player.x, s.player.y, s.player.r, 0, Math.PI * 2);
    ctx.fill();

    // Подсказка
    ctx.fillStyle = '#fff';
    ctx.font = '16px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('Управление: WASD / стрелки', s.W / 2, 40);
  },

  serialize(s) {
    return {
      player: { ...s.player },
      preview: 'Моя игра'
    };
  }
}
`;
  const blob = new Blob([template], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'pooconsole-template.txt';
  a.click();
  toast('Шаблон скачан');
}

/* ============================================================

function screenAch() {
  let html = '';
  Object.values(META).forEach(m => {

    html += `<h3 style="font-size:12px;letter-spacing:2px;color:#00e0ff;margin:16px 0 8px">

      ${m.title}</h3>`;
    m.ach.forEach(a => {
      const on = isUnlocked(m.id, a.id);
      html += `<div class="ach ${on ? 'on' : 'off'}">
        <div class="ai">${on ? a.i : '🔒'}</div>
        <div class="ai2">
          <div class="at">${a.t}</div>
          <div class="ad">${a.d}</div>
        </div>
        <div class="st">${on ? 'ОТКРЫТО' : 'ЗАКРЫТО'}</div>
      </div>`;
    });
  });
  if (!html) html = '<div style="text-align:center;color:#6b7a99;padding:40px">Нет достижений</div>';
  UIel.innerHTML = `<div class="screen">

<script>
/* ============================================================
   ЧАСТЬ 2: ДВИЖОК + 9 ИГР
   ============================================================ */

/* ============================================================
   ГРАФИЧЕСКИЕ УТИЛИТЫ
   ============================================================ */
const GFX = {
  circleGrad(ctx, x, y, r, c1, c2) {
    const g = ctx.createRadialGradient(
      x - r * 0.3, y - r * 0.3, r * 0.1,
      x, y, r
    );
    g.addColorStop(0, c1);
    g.addColorStop(1, c2);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  },
  rectGrad(ctx, x, y, w, h, c1, c2, vertical = true) {
    const g = vertical
      ? ctx.createLinearGradient(x, y, x, y + h)
      : ctx.createLinearGradient(x, y, x + w, y);
    g.addColorStop(0, c1);
    g.addColorStop(1, c2);
    ctx.fillStyle = g;
    ctx.fillRect(x, y, w, h);
  },
  shadow(ctx, x, y, rx, ry, alpha = 0.4) {
    ctx.fillStyle = `rgba(0,0,0,${alpha})`;
    ctx.beginPath();
    ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
    ctx.fill();
  },
  shine(ctx, x, y, rx, ry, alpha = 0.3) {
    ctx.fillStyle = `rgba(255,255,255,${alpha})`;
    ctx.beginPath();
    ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
    ctx.fill();
  },
  spawnParticles(list, x, y, count, opts = {}) {
    const {
      color = '#fff', size = 3, life = 0.5,
      speed = 150, spread = Math.PI * 2,
      direction = 0, gravity = 0
    } = opts;
    for (let i = 0; i < count; i++) {
      const a = direction + (Math.random() - 0.5) * spread;
      const v = speed * (0.5 + Math.random() * 0.5);
      list.push({
        x, y,
        vx: Math.cos(a) * v,
        vy: Math.sin(a) * v,
        life,
        maxLife: life,
        color,
        size: size * (0.7 + Math.random() * 0.6),
        gravity
      });
    }
  },
  lerpCamera(cam, targetX, targetY, speed = 6) {
    cam.x += (targetX - cam.x) * Math.min(1, speed);
    cam.y += (targetY - cam.y) * Math.min(1, speed);
  }
};

/* ============================================================
   ДВИЖОК
   ============================================================ */
const Game = (() => {
  const STAGE = document.getElementById('stage');
  const UIel  = document.getElementById('ui');
  let canvas = null, ctx = null;
  let running = false, paused = false;
  let cur = null, curId = null;
  let raf = null, lastT = 0;
  let state = null;
  let keys = {};
  let mouse = { x:0, y:0, down:false, was:false, rdown:false, rwas:false };
  let audioCtx = null;
  let pauseMenu = null;
  let shake = { time:0, intensity:0 };

  function beep(f = 440, d = 0.08, type = 'square', v = 0.05) {
    if (!DB.settings.sound) return;
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = type; o.frequency.value = f; g.gain.value = v;
      o.connect(g); g.connect(audioCtx.destination);
      o.start();
      g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + d);
      o.stop(audioCtx.currentTime + d);
    } catch(e) {}
  }

  function drawHUD() {
    if (!state || !state.hud) return;
    let hud = STAGE.querySelector('#hud');
    if (!hud) {
      hud = document.createElement('div');
      hud.id = 'hud';
      STAGE.appendChild(hud);
    }
    hud.innerHTML = state.hud;
  }

  function showPause() {
    if (pauseMenu) return;
    pauseMenu = document.createElement('div');
    pauseMenu.className = 'modal';
    pauseMenu.innerHTML = `<div class="box">
      <h3>⏸ ПАУЗА</h3>
      <p>${META[curId] ? META[curId].title : ''}</p>
      <div class="row">
        <button class="btn wide" data-r>▶ Продолжить</button>
        <button class="btn wide" data-s>💾 Сохранить в слот</button>
        <button class="btn wide" data-l>📂 Загрузить из слота</button>
        <button class="btn wide" data-cp>🔁 Загрузить чекпоинт</button>
        <button class="btn wide" data-restart>🔄 Перезапустить</button>
        <button class="btn dg wide" data-e>✕ Выйти в меню</button>
      </div>
    </div>`;
    STAGE.appendChild(pauseMenu);
    pauseMenu.querySelector('[data-r]').onclick = resume;
    pauseMenu.querySelector('[data-s]').onclick = () => {
      const data = cur.serialize ? cur.serialize(state) : { preview:'Ручное' };
      pauseMenu.remove(); pauseMenu = null;
      pickSlot(curId, data, 'save', () => showPause());
    };
    pauseMenu.querySelector('[data-l]').onclick = () => {
      pauseMenu.remove(); pauseMenu = null;
      pickSlot(curId, null, 'load', (loaded) => {
        if (!loaded || loaded === 'cancel') { showPause(); return; }
        restart(curId, loaded);
      });
    };
    pauseMenu.querySelector('[data-cp]').onclick = () => {
      if (!hasCheckpoint(curId)) { toast('Нет чекпоинтов', 'warn'); return; }
      const d = lastCheckpoint(curId);
      pauseMenu.remove(); pauseMenu = null;
      restart(curId, d);
    };
    pauseMenu.querySelector('[data-restart]').onclick = () => {
      pauseMenu.remove(); pauseMenu = null;
      restart(curId, null);
    };
    pauseMenu.querySelector('[data-e]').onclick = () => {
      pauseMenu.remove(); pauseMenu = null;
      stop(false); back();
    };
  }
  function pause() {
    if (!running || paused) return;
    paused = true;
    cancelAnimationFrame(raf);
    showPause();
  }
  function resume() {
    if (!running) return;
    paused = false;
    if (pauseMenu) { pauseMenu.remove(); pauseMenu = null; }
    lastT = performance.now();
    raf = requestAnimationFrame(loop);
  }

  function loop(t) {
    if (!running || paused) return;
    const dt = Math.min(0.05, (t - lastT) / 1000);
    lastT = t;
    try { cur.update(dt, state); } catch(e) { console.error(e); }

    if (shake.time > 0) shake.time -= dt;

    try {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.save();
      if (shake.time > 0) {
        const int = shake.intensity * (shake.time / 0.2);
        ctx.translate(
          (Math.random() - 0.5) * int * 2,
          (Math.random() - 0.5) * int * 2
        );
      }
      cur.render(ctx, state);
      ctx.restore();
    } catch(e) { console.error(e); }
    drawHUD();
    mouse.was = mouse.down;
    mouse.rwas = mouse.rdown;
    raf = requestAnimationFrame(loop);
  }

  function start(gameId, options = {}) {
    const g = GAMES[gameId];
    if (!g) {
      console.error('[PooConsole] Игра не найдена:', gameId);
      toast('Игра не зарегистрирована', 'err');
      return;
    }
    console.log('[PooConsole] Старт:', gameId, options);

    // Пробуем инициализировать без данных, чтобы узнать размеры
    let W = 480, H = 600;
    try {
      const probe = g.init(null);
      if (probe && probe.W && probe.H) {
        W = probe.W;
        H = probe.H;
      }
    } catch(e) {
      console.error('[PooConsole] Ошибка probe init:', e);
    }

    UIel.innerHTML = '';
    UIel.classList.add('hidden');
    STAGE.querySelectorAll('canvas').forEach(c => c.remove());
    const oldHud = STAGE.querySelector('#hud');
    if (oldHud) oldHud.remove();

    canvas = document.createElement('canvas');
    canvas.width = W;
    canvas.height = H;
    canvas.style.background = '#000';
    canvas.setAttribute('tabindex', '0');
    canvas.style.pointerEvents = 'auto';
    STAGE.appendChild(canvas);
    ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;

    curId = gameId;
    cur = g;
    try {
      state = g.init(options);
    } catch(e) {
      console.error('[PooConsole] Ошибка init игры:', e);
      toast('Ошибка загрузки игры', 'err');
      stop(false);
      back();
      return;
    }

    keys = {};
    mouse = { x:0, y:0, down:false, was:false, rdown:false, rwas:false };
    shake = { time:0, intensity:0 };
    running = true;
    paused = false;
    lastT = performance.now();

    canvas.focus();
    setTimeout(() => canvas.focus(), 30);
    attachMouse();
    raf = requestAnimationFrame(loop);
  }

  function restart(gameId, loadData) {
    stop(false);
    if (typeof loadData === 'object' && loadData !== null) {
      start(gameId, loadData);
    } else {
      start(gameId, {});
    }
  }

  function stop(auto) {
    if (!running) return;
    if (auto && cur && cur.serialize) {
      try { addCheckpoint(curId, cur.serialize(state)); } catch(e) {}
    }
    running = false;
    paused = false;
    cancelAnimationFrame(raf);
    if (canvas) { canvas.remove(); canvas = null; ctx = null; }
    const hud = STAGE.querySelector('#hud');
    if (hud) hud.remove();
    if (pauseMenu) { pauseMenu.remove(); pauseMenu = null; }
    UIel.classList.remove('hidden');
    cur = null; state = null; curId = null;
    mouse = { x:0, y:0, down:false, was:false, rdown:false, rwas:false };
  }

  window.addEventListener('keydown', e => {
    if (!running) return;
    keys[e.code] = true;
    if (e.code === 'Escape') {
      e.preventDefault(); e.stopPropagation();
      if (paused) resume(); else pause();
      return;
    }
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) {
      e.preventDefault();
    }
  }, true);

  window.addEventListener('keyup', e => {
    keys[e.code] = false;
  });

  function attachMouse() {
    if (!canvas) return;
    canvas.addEventListener('mousemove', e => {
      const r = canvas.getBoundingClientRect();
      mouse.x = (e.clientX - r.left) * (canvas.width / r.width);
      mouse.y = (e.clientY - r.top) * (canvas.height / r.height);
    });
    canvas.addEventListener('mousedown', e => {
      if (e.button === 0) mouse.down = true;
      if (e.button === 2) mouse.rdown = true;
    });
    window.addEventListener('mouseup', e => {
      if (e.button === 0) mouse.down = false;
      if (e.button === 2) mouse.rdown = false;
    });
    canvas.addEventListener('contextmenu', e => e.preventDefault());
    canvas.addEventListener('touchstart', e => {
      mouse.down = true;
      if (e.touches[0]) {
        const r = canvas.getBoundingClientRect();
        mouse.x = (e.touches[0].clientX - r.left) * (canvas.width / r.width);
        mouse.y = (e.touches[0].clientY - r.top) * (canvas.height / r.height);
      }
    }, { passive:true });
    canvas.addEventListener('touchend', () => { mouse.down = false; });
    canvas.addEventListener('touchmove', e => {
      if (e.touches[0]) {
        const r = canvas.getBoundingClientRect();
        mouse.x = (e.touches[0].clientX - r.left) * (canvas.width / r.width);
        mouse.y = (e.touches[0].clientY - r.top) * (canvas.height / r.height);
      }
    }, { passive:true });
  }

  function K(...codes) {
    for (const c of codes) if (keys[c]) return true;
    return false;
  }

  function screenShake(intensity = 6, time = 0.2) {
    shake.intensity = intensity;
    shake.time = time;
  }

  return {
    start, stop, restart, beep, K, screenShake,
    isRunning: () => running,
    keys: () => keys,
    mouse: () => mouse,
    checkpoint: (data) => addCheckpoint(curId, data)
  };
})();

/* ---------- ВЫБОР СЛОТА ---------- */
function pickSlot(gameId, data, mode, onClose) {
  const g = DB.games[gameId];
  const title = mode === 'save' ? '💾 СОХРАНИТЬ В СЛОТ' : '📂 ЗАГРУЗИТЬ ИЗ СЛОТА';
  const rows = g.slots.map((s, i) => {
    const info = s
      ? new Date(s.ts).toLocaleString('ru-RU') +
        (s.data && s.data.preview ? ' • ' + s.data.preview : '')
      : 'Пусто';
    const disabled = mode === 'load' && !s;
    return `<div class="slot ${disabled ? '' : 'clickable'}" data-i="${i}" style="${disabled ? 'opacity:.4' : ''}">
      <div class="n ${s ? '' : 'empty'}">${i+1}</div>
      <div class="i">
        <div class="st">Слот ${i+1}</div>
        <div class="sd">${info}</div>
      </div>
    </div>`;
  }).join('');
  const m = document.createElement('div');
  m.className = 'modal';
  m.innerHTML = `<div class="box" style="max-width:520px">
    <h3>${title}</h3>
    <p>${mode === 'save' ? 'Выбери слот' : 'Выбери слот для загрузки'}</p>
    <div style="text-align:left;margin-bottom:16px">${rows}</div>
    <button class="btn dg" data-cancel>Отмена</button>
  </div>`;
  STAGE.appendChild(m);
  m.querySelector('[data-cancel]').onclick = () => {
    m.remove();
    if (onClose) onClose('cancel');
  };
  m.querySelectorAll('[data-i]').forEach(el => {
    el.onclick = () => {
      const i = +el.dataset.i;
      const s = g.slots[i];
      if (mode === 'save') {
        if (s) {
          modal('Перезаписать слот?', `Слот ${i+1} занят. Заменить?`, [
            { t:'Да', dg:true, f:() => {
                saveSlot(gameId, i, data);
                toast(`Сохранено в слот ${i+1}`);
                m.remove();
                if (onClose) onClose('saved');
            }},
            { t:'Нет', f:() => {} }
          ]);
        } else {
          saveSlot(gameId, i, data);
          toast(`Сохранено в слот ${i+1}`);
          m.remove();
          if (onClose) onClose('saved');
        }
      } else {
        if (!s) return;
        m.remove();
        if (onClose) onClose(s.data);
      }
    };
  });
}

/* ============================================================

const CS2DGame = {
  MAPS: [
    { name:'de_dust-lite',

    const mapData = this.MAPS[levelIdx % this.MAPS.length];

        },

      },
      bullets: [], enemies: [], particles: [], pickups: [],
      round: 1, kills: 0, alive: true,
      roundTimer: 3, roundActive: false, hud: '',
      totalRounds: 5
    };

    [[2.5,9.5],[22.5,9.5],[12.5,2.5],[12.5,16.5]].forEach(([x,y]) => {
      s.pickups.push({ x: x*CS, y: y*CS, type:'health', amount:25, bob: Math.random()*6 });
