      const scaleX = Math.abs(Math.cos(c.bob * 2));
      ctx.save();
      ctx.translate(c.x, c.y + bob);
      ctx.scale(scaleX, 1);
      GFX.circleGrad(ctx, 0, 0, 10, '#fff89a', '#cc9900');
      ctx.strokeStyle = '#8a6a10';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, 0, 10, 0, Math.PI*2);
      ctx.stroke();
      ctx.restore();
    });
    ctx.fillStyle = '#aaa';
    ctx.fillRect(s.goalX, s.H - 240, 6, 200);
    ctx.fillStyle = '#0f0';
    ctx.beginPath();
    ctx.moveTo(s.goalX + 6, s.H - 240);
    ctx.lineTo(s.goalX + 6, s.H - 200);
    ctx.lineTo(s.goalX + 60, s.H - 220);
    ctx.closePath();
    ctx.fill();

    s.enemies.forEach(e => {
      if (!e.alive) return;
      const bob = Math.sin(e.walkAnim) * 2;
      GFX.shadow(ctx, e.x + e.w/2, e.y + e.h + 3, e.w/2, 3, 0.3);
      ctx.fillStyle = '#8b4513';
      ctx.beginPath();
      ctx.arc(e.x + e.w/2, e.y + e.h/2 + bob, e.w/2, Math.PI, 0);
      ctx.lineTo(e.x + e.w, e.y + e.h);
      ctx.lineTo(e.x, e.y + e.h);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(e.x + 6, e.y + 10 + bob, 4, 0, Math.PI*2);
      ctx.arc(e.x + 18, e.y + 10 + bob, 4, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(e.x + 6, e.y + 10 + bob, 2, 0, Math.PI*2);
      ctx.arc(e.x + 18, e.y + 10 + bob, 2, 0, Math.PI*2);
      ctx.fill();
    });

    if (s.alive || s.deathAnim < 1) {
      const p = s.player;
      const bob = s.alive ? Math.sin(p.walkAnim) * 1.5 : 0;
      GFX.shadow(ctx, p.x + p.w/2, p.y + p.h + 3, p.w/2, 3, 0.3);
      ctx.fillStyle = '#222';
      ctx.fillRect(p.x + 4, p.y + p.h - 6 + bob, 8, 6);
      ctx.fillRect(p.x + p.w - 12, p.y + p.h - 6 + bob, 8, 6);
      GFX.rectGrad(ctx, p.x + 4, p.y + 16 + bob, p.w - 8, p.h - 22, '#3060c0', '#1040a0');
      GFX.rectGrad(ctx, p.x + 2, p.y + 12 + bob, p.w - 4, 8, '#e03020', '#a02010');
      GFX.rectGrad(ctx, p.x + 4, p.y + 2 + bob, p.w - 8, 10, '#ffd5a0', '#e0a570');
      GFX.rectGrad(ctx, p.x + 3, p.y + bob, p.w - 6, 5, '#e03020', '#a02010');
      if (p.facing > 0) ctx.fillRect(p.x + p.w - 6, p.y + 3 + bob, 6, 2);
      else ctx.fillRect(p.x, p.y + 3 + bob, 6, 2);
      ctx.fillStyle = '#000';
      if (p.facing > 0) ctx.fillRect(p.x + p.w - 9, p.y + 6 + bob, 2, 3);
      else ctx.fillRect(p.x + 7, p.y + 6 + bob, 2, 3);
    }

    s.particles.forEach(pt => {
      const alpha = Math.max(0, pt.life / (pt.maxLife || 0.5));
      ctx.globalAlpha = alpha;
      ctx.fillStyle = pt.color;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI*2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
    ctx.restore();

    if (!s.alive) {
      ctx.fillStyle = 'rgba(0,0,0,0.7)';
      ctx.fillRect(0, s.H/2-80, s.W, 160);
      ctx.fillStyle = '#ff4d6d';
      ctx.font = 'bold 36px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('GAME OVER', s.W/2, s.H/2);
      ctx.fillStyle = '#fff';
      ctx.font = '18px sans-serif';
      ctx.fillText(`Уровень ${s.level} • Очки: ${s.score}`, s.W/2, s.H/2 + 34);
    }
  },

  serialize(s) {
    return {
      startLevel: s.level, score: s.score, coinsGot: s.coinsGot,
      jumps: s.jumps, distance: s.distance,
      preview: `Mario: ур.${s.level}/8`
    };
  }
};

/* ============================================================
   ZELDA — 5 подземелий
   ============================================================ */
const ZeldaGame = {
  init(load) {
    const W = 640, H = 480;
    const cell = 40;
    const level = (load && load.startLevel ? load.startLevel : 1);
    const MW = 16 + level * 2;
    const MH = 12 + level;
    const map = [];
    for (let y = 0; y < MH; y++) {
      map.push([]);
      for (let x = 0; x < MW; x++) {
        if (x === 0 || y === 0 || x === MW-1 || y === MH-1) map[y].push(1);
        else map[y].push(0);
      }
    }
    const wallCount = 8 + level * 3;
    for (let i = 0; i < wallCount; i++) {
      const wx = 3 + Math.floor(Math.random() * (MW - 6));
      const wy = 3 + Math.floor(Math.random() * (MH - 6));
      const ww = 1 + Math.floor(Math.random() * 4);
      const wh = 1 + Math.floor(Math.random() * 2);
      for (let dy = 0; dy < wh; dy++) {
        for (let dx = 0; dx < ww; dx++) {
          if (map[wy+dy] && map[wy+dy][wx+dx] !== undefined) map[wy+dy][wx+dx] = 1;
        }
      }
    }
    const s = {
      W, H, cell, MW, MH, map,
      level, totalLevels: 5,
      player: {
        x: 2.5*cell, y: 2.5*cell,
        hp: 6, maxHp: 6, keys: 0,
        dir: 'down', attackTimer: 0, cd: 0,
        speed: 180, walkAnim: 0, hitFlash: 0
      },
      enemies: [], keys: [], door: null,
      kills: 0, keysFound: 0,
      alive: true, hud: '', exited: false,
      particles: [], deathAnim: 0
    };
    const enemyCount = 5 + level * 2;
    let attempts = 0;
    while (s.enemies.length < enemyCount && attempts < 200) {
      attempts++;
      const ex = 2 + Math.floor(Math.random() * (MW - 4));
      const ey = 2 + Math.floor(Math.random() * (MH - 4));
      if (map[ey][ex] !== 0) continue;
      if (Math.abs(ex - 2) + Math.abs(ey - 2) < 4) continue;
      s.enemies.push({
        x: ex*cell + cell/2, y: ey*cell + cell/2,
        hp: 2 + Math.floor(level / 2), maxHp: 2 + Math.floor(level / 2),
        cd: 0, speed: 70 + level * 8,
        dir: Math.random()*Math.PI*2,
        color: ['#8a4a4a', '#8a4a8a', '#4a4a8a', '#8a8a4a'][level % 4],
        walkAnim: Math.random()*10, hitFlash: 0
      });
    }
    const keyCount = Math.min(3 + level, 6);
    let ka = 0;
    while (s.keys.length < keyCount && ka < 200) {
      ka++;
      const kx = 2 + Math.floor(Math.random() * (MW - 4));
      const ky = 2 + Math.floor(Math.random() * (MH - 4));
      if (map[ky][kx] !== 0) continue;
      if (Math.abs(kx - 2) + Math.abs(ky - 2) < 3) continue;
      s.keys.push({ x: kx*cell + cell/2, y: ky*cell + cell/2, got: false, bob: Math.random()*6 });
    }
    s.requiredKeys = keyCount;
    s.door = { x: (MW - 2)*cell + cell/2, y: (MH - 2)*cell + cell/2, open: false, bob: 0 };
    s.map[MH-2][MW-2] = 3;
    if (load) {
      if (load.kills) s.kills = load.kills;
      if (load.keysFound) s.keysFound = load.keysFound;
      if (load.player) Object.assign(s.player, load.player);
    }
    return s;
  },

  collideWall(s, x, y, size) {
    for (const [cx, cy] of [
      [x-size,y-size],[x+size,y-size],[x-size,y+size],[x+size,y+size]
    ]) {
      const gx = Math.floor(cx/s.cell), gy = Math.floor(cy/s.cell);
      if (gy < 0 || gy >= s.MH || gx < 0 || gx >= s.MW) return true;
      if (s.map[gy][gx] === 1) return true;
    }
    return false;
  },

  update(dt, s) {
    if (!s.alive) {
      s.deathAnim += dt;
      for (let i = s.particles.length-1; i >= 0; i--) {
        const p = s.particles[i];
        p.x += p.vx*dt; p.y += p.vy*dt; p.life -= dt;
        if (p.life <= 0) s.particles.splice(i, 1);
      }
      return;
    }
    if (s.exited) return;
    const K = Game.K;
    const p = s.player;
    p.walkAnim += dt * 6;
    p.hitFlash = Math.max(0, p.hitFlash - dt);

    let dx = 0, dy = 0;
    if (K('KeyW','ArrowUp')) { dy = -1; p.dir = 'up'; }
    if (K('KeyS','ArrowDown')) { dy = 1; p.dir = 'down'; }
    if (K('KeyA','ArrowLeft')) { dx = -1; p.dir = 'left'; }
    if (K('KeyD','ArrowRight')) { dx = 1; p.dir = 'right'; }

    const len = Math.hypot(dx, dy);
    if (len > 0) {
      dx /= len; dy /= len;
      const nx = p.x + dx*p.speed*dt;
      const ny = p.y + dy*p.speed*dt;
      if (!this.collideWall(s, nx, p.y, 14)) p.x = nx;
      if (!this.collideWall(s, p.x, ny, 14)) p.y = ny;
      if (Math.random() < 0.15) {
        GFX.spawnParticles(s.particles, p.x, p.y + 12, 1,
          { color:'rgba(200,200,200,0.5)', size:2, life:0.3, speed:40 });
      }
    }
    p.attackTimer -= dt;
    p.cd -= dt;
    if ((K('Space') || Game.mouse().down) && p.cd <= 0) {
      p.cd = 0.4;
      p.attackTimer = 0.25;
      Game.beep(800, 0.05);
      const atkX = p.x + (p.dir === 'right' ? 30 : p.dir === 'left' ? -30 : 0);
      const atkY = p.y + (p.dir === 'down' ? 30 : p.dir === 'up' ? -30 : 0);
      for (const e of s.enemies) {
        if (Math.hypot(e.x - atkX, e.y - atkY) < 35) {
          e.hp--;
          e.hitFlash = 0.15;
          GFX.spawnParticles(s.particles, e.x, e.y, 6,
            { color:'#a01010', size:3, life:0.4, speed:150 });
          if (e.hp <= 0) {
            s.kills++;
            if (s.kills === 1) unlock('zelda','a1');
            if (s.kills >= 50) unlock('zelda','a3');
          }
        }
      }
    }
    s.enemies = s.enemies.filter(e => e.hp > 0);

    for (const e of s.enemies) {
      e.cd -= dt;
      e.walkAnim += dt * 6;
      e.hitFlash = Math.max(0, e.hitFlash - dt);
      const dist = Math.hypot(p.x - e.x, p.y - e.y);
      if (dist < 250) e.dir = Math.atan2(p.y - e.y, p.x - e.x);
      const nx = e.x + Math.cos(e.dir)*e.speed*dt;
      const ny = e.y + Math.sin(e.dir)*e.speed*dt;
      if (!this.collideWall(s, nx, e.y, 12)) e.x = nx;
      else e.dir = Math.random()*Math.PI*2;
      if (!this.collideWall(s, e.x, ny, 12)) e.y = ny;
      else e.dir = Math.random()*Math.PI*2;
      if (dist < 20 && e.cd <= 0 && p.hitFlash <= 0) {
        e.cd = 1;
        p.hp--;
        p.hitFlash = 0.5;
        Game.beep(200, 0.15, 'sawtooth');
        Game.screenShake(5, 0.2);
        GFX.spawnParticles(s.particles, p.x, p.y, 8,
          { color:'#ff3030', size:3, life:0.4, speed:150 });
        if (p.hp <= 0) { s.alive = false; s.deathAnim = 0; Game.beep(150, 0.5, 'sawtooth'); }
      }
    }
    for (const k of s.keys) {
      if (k.got) continue;
      k.bob += dt * 4;
      if (Math.hypot(k.x - p.x, k.y - p.y) < 30) {
        k.got = true;
        p.keys++;
        s.keysFound++;
        Game.beep(1200, 0.1, 'sine');
        GFX.spawnParticles(s.particles, k.x, k.y, 8,
          { color:'#ffcf40', size:3, life:0.5, speed:150 });
        if (s.keysFound >= 3) unlock('zelda','a2');
      }
    }
    s.door.bob += dt * 3;
    if (Math.hypot(s.door.x - p.x, s.door.y - p.y) < 30) {
      if (p.keys >= s.requiredKeys) {
        s.exited = true;
        unlockLevel('zelda', s.level + 1);
        if (s.level >= 5) unlock('zelda','a4');
        Game.checkpoint(this.serialize(s));
        toast(`Подземелье ${s.level} пройдено!`, 'gold');
        if (s.level < 5) {
          setTimeout(() => Game.restart('zelda', {
            startLevel: s.level + 1, kills: s.kills, keysFound: s.keysFound
          }), 1500);
        }
      }
    }
    for (let i = s.particles.length-1; i >= 0; i--) {
      const pt = s.particles[i];
      pt.x += pt.vx*dt; pt.y += pt.vy*dt; pt.life -= dt;
      pt.vx *= 0.95; pt.vy *= 0.95;
      if (pt.life <= 0) s.particles.splice(i, 1);
    }
    s.hud = `⚔️ HP: ${p.hp}/${p.maxHp} | 🗝️ ${p.keys}/${s.requiredKeys} | Убийств: ${s.kills}`;
  },

  render(ctx, s) {
    ctx.fillStyle = '#1a1a14';
    ctx.fillRect(0, 0, s.W, s.H);
    const c = s.cell;
    for (let y = 0; y < s.MH; y++) {
      for (let x = 0; x < s.MW; x++) {
        const v = s.map[y][x];
        const px = x*c, py = y*c;
        if (v === 1) {
          GFX.rectGrad(ctx, px, py, c, c, '#6a5a3a', '#3a2a1a');
          ctx.strokeStyle = '#2a1a0a';
          ctx.lineWidth = 2;
          ctx.strokeRect(px+3, py+3, c-6, c-6);
        } else if (v === 3) {
          const bob = Math.sin(s.door.bob) * 2;
          GFX.rectGrad(ctx, px, py + bob, c, c, '#ffd76a', '#cc9900');
          ctx.strokeStyle = '#8a6a10';
          ctx.strokeRect(px+4, py+4+bob, c-8, c-8);
        } else {
          ctx.fillStyle = (x+y)%2 === 0 ? '#2a3a24' : '#243022';
          ctx.fillRect(px, py, c, c);
          ctx.strokeStyle = 'rgba(0,0,0,0.1)';
          ctx.strokeRect(px+0.5, py+0.5, c-1, c-1);
        }
      }
    }
    s.keys.forEach(k => {
      if (k.got) return;
      const bob = Math.sin(k.bob) * 3;
      GFX.shadow(ctx, k.x, k.y + 10, 8, 3, 0.3);
      GFX.circleGrad(ctx, k.x + 10, k.y + bob, 6, '#ffe680', '#cc9900');
      ctx.fillStyle = '#cc9900';
      ctx.fillRect(k.x - 8, k.y - 3 + bob, 16, 6);
      ctx.fillStyle = '#8a6a10';
      ctx.fillRect(k.x - 8, k.y - 3 + bob, 2, 6);
      ctx.fillRect(k.x - 4, k.y + 3 + bob, 2, 3);
    });
    s.enemies.forEach(e => {
      const bob = Math.sin(e.walkAnim) * 1.5;
      GFX.shadow(ctx, e.x + 2, e.y + 12, 12, 4, 0.4);
      ctx.fillStyle = e.hitFlash > 0 ? '#fff' : e.color;
      ctx.beginPath();
      ctx.arc(e.x, e.y + bob, 14, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(e.x - 4, e.y - 3 + bob, 3, 0, Math.PI*2);
      ctx.arc(e.x + 4, e.y - 3 + bob, 3, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(e.x - 4, e.y - 3 + bob, 1.5, 0, Math.PI*2);
      ctx.arc(e.x + 4, e.y - 3 + bob, 1.5, 0, Math.PI*2);
      ctx.fill();
      const hpw = 24 * (e.hp / e.maxHp);
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(e.x - 12, e.y - 22, 24, 3);
      ctx.fillStyle = '#ff4d6d';
      ctx.fillRect(e.x - 12, e.y - 22, hpw, 3);
    });
    if (s.alive) {
      const p = s.player;
      const bob = Math.sin(p.walkAnim) * 1;
      GFX.shadow(ctx, p.x + 2, p.y + 12, 12, 4, 0.4);
      if (p.hitFlash > 0) ctx.globalAlpha = 0.5 + Math.sin(Date.now()/60) * 0.5;
      GFX.circleGrad(ctx, p.x, p.y + bob, 14, '#5abf5a', '#1e5a1e');
      ctx.fillStyle = '#2a7a2a';
      ctx.beginPath();
      ctx.arc(p.x, p.y - 4 + bob, 12, Math.PI, 0);
      ctx.fill();
      ctx.fillStyle = '#f2c8a0';
      ctx.beginPath();
      ctx.arc(p.x, p.y + 2 + bob, 8, 0, Math.PI);
      ctx.fill();
      ctx.fillStyle = '#000';
      if (p.dir === 'left' || p.dir === 'up') ctx.fillRect(p.x - 6, p.y - 1 + bob, 2, 2);
      else ctx.fillRect(p.x + 4, p.y - 1 + bob, 2, 2);
      if (p.attackTimer > 0) {
        const alpha = p.attackTimer / 0.25;
        ctx.fillStyle = `rgba(255,255,220,${alpha * 0.5})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 26, 0, Math.PI*2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
    s.particles.forEach(pt => {
      const alpha = Math.max(0, pt.life / (pt.maxLife || 0.5));
      ctx.globalAlpha = alpha;
      ctx.fillStyle = pt.color;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI*2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;

    if (s.exited) {
      ctx.fillStyle = 'rgba(0,0,0,0.8)';
      ctx.fillRect(0, s.H/2-80, s.W, 160);
      ctx.fillStyle = '#0f0';
      ctx.font = 'bold 32px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(`🏰 Подземелье ${s.level} пройдено!`, s.W/2, s.H/2);
      ctx.fillStyle = '#fff';
      ctx.font = '16px monospace';
      ctx.fillText('ESC — меню', s.W/2, s.H/2 + 40);
    }
    if (!s.alive) {
      ctx.fillStyle = 'rgba(0,0,0,0.75)';
      ctx.fillRect(0, s.H/2-80, s.W, 160);
      ctx.fillStyle = '#ff4d6d';
      ctx.font = 'bold 34px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('ВЫ ПОГИБЛИ', s.W/2, s.H/2);
      ctx.fillStyle = '#fff';
      ctx.font = '16px monospace';
      ctx.fillText(`Убийств: ${s.kills}`, s.W/2, s.H/2 + 30);
    }
  },

  serialize(s) {
    return {
      startLevel: s.level, kills: s.kills, keysFound: s.keysFound,
      player: { hp: s.player.hp, keys: s.player.keys },
      preview: `Zelda: ур.${s.level}/5`
    };
  }
};

/* ============================================================
   POKEMON — 3 зала
   ============================================================ */
const PokemonGame = {
  GYMS: [
    { name: 'Лесной зал',
      enemies: [
        { name:'Листун',    hp:42, maxHp:42, atk:11, def:9,  spd:9,  color:'#4ad94a' },
        { name:'Пушистик',  hp:40, maxHp:40, atk:10, def:6,  spd:12, color:'#ff6a9a' }
      ]},
    { name: 'Водный зал',
      enemies: [
        { name:'Водолаз',   hp:48, maxHp:48, atk:12, def:7,  spd:10, color:'#4a9aff' },
        { name:'Пушистик',  hp:44, maxHp:44, atk:11, def:6,  spd:12, color:'#ff6a9a' }
      ]},
    { name: 'Зал чемпиона',
      enemies: [
        { name:'Электроша', hp:38, maxHp:38, atk:15, def:5,  spd:15, color:'#ffea4a' },
        { name:'Огнехвост', hp:45, maxHp:45, atk:14, def:5,  spd:11, color:'#ff6a2a' }
      ]}
  ],

  init(load) {
    const W = 640, H = 480;
    const gymIdx = ((load && load.startLevel) ? load.startLevel : 1) - 1;
    const gym = this.GYMS[gymIdx % this.GYMS.length];
    const s = {
      W, H, gymIdx, gymName: gym.name, totalLevels: this.GYMS.length,
      player: {
        name: 'Ваш монстр',
        hp: 50 + gymIdx * 15, maxHp: 50 + gymIdx * 15,
        atk: 12 + gymIdx * 3, def: 8 + gymIdx * 2,
        spd: 10 + gymIdx * 2,
        level: 5 + gymIdx * 3, exp: 0
      },
      enemy: null,
      gymEnemies: gym.enemies.map(e => ({ ...e, exp: 20 + gymIdx * 10 })),
      enemyIdx: 0,
      enemiesBeaten: 0, captured: 0,
      battleState: 'menu',
      message: 'Выберите действие',
      menuIdx: 0,
      alive: true, hud: '',
      _lock: false, _lock2: false,
      particles: [], shake: 0
    };
    if (load) {
      if (load.enemiesBeaten) s.enemiesBeaten = load.enemiesBeaten;
      if (load.captured) s.captured = load.captured;
      if (load.player) Object.assign(s.player, load.player);
      if (load.enemyIdx) s.enemyIdx = load.enemyIdx;
    }
    s.enemy = { ...s.gymEnemies[s.enemyIdx % s.gymEnemies.length] };
    return s;
  },

  update(dt, s) {
    if (!s.alive) return;
    const K = Game.K;
    const m = Game.mouse();
    if (s.shake > 0) s.shake -= dt;

    for (let i = s.particles.length-1; i >= 0; i--) {
      const p = s.particles[i];
      p.x += p.vx*dt; p.y += p.vy*dt; p.life -= dt; p.vy += 200 * dt;
      if (p.life <= 0) s.particles.splice(i, 1);
    }

    if (s.battleState === 'menu') {
      if (K('ArrowUp','KeyW') && !s._lock) {
        s.menuIdx = Math.max(0, s.menuIdx - 1);
        s._lock = true;
        setTimeout(() => s._lock = false, 150);
      }
      if (K('ArrowDown','KeyS') && !s._lock) {
        s.menuIdx = Math.min(2, s.menuIdx + 1);
        s._lock = true;
        setTimeout(() => s._lock = false, 150);
      }
      const opts = [s.H - 100, s.H - 74, s.H - 48];
      if (m.down && !m.was) {
        for (let i = 0; i < 3; i++) {
          if (m.x >= 300 && m.x <= s.W - 20 && Math.abs(m.y - opts[i]) < 14) {
            s.menuIdx = i;
            s._lock2 = true;
            setTimeout(() => s._lock2 = false, 350);
            doAction(s);
            return;
          }
        }
      }
      if ((K('Space','Enter')) && !s._lock2) {
        s._lock2 = true;
        setTimeout(() => s._lock2 = false, 350);
        doAction(s);
      }
    }
    s.hud = `⚔️ ${s.gymName} | Побед: ${s.enemiesBeaten} | 🔮 Поймано: ${s.captured}`;
  },

  render(ctx, s) {
    const grd = ctx.createLinearGradient(0, 0, 0, s.H);
    grd.addColorStop(0, '#4a8b3a');
    grd.addColorStop(1, '#2a5a1a');
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, s.W, s.H);
    ctx.fillStyle = 'rgba(0,0,0,0.08)';
    for (let i = 0; i < 40; i++) {
      ctx.fillRect((i*37)%s.W, (i*63)%s.H, 20, 2);
    }

    if (s.enemy && s.enemy.hp > 0) {
      const ex = s.W - 180, ey = 130;
      const shakeX = s.shake > 0 ? (Math.random()-0.5) * s.shake * 20 : 0;
      GFX.shadow(ctx, ex + 2, ey + 42, 40, 10, 0.3);
      GFX.circleGrad(ctx, ex + shakeX, ey, 40, s.enemy.color, '#000');
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(ex - 12 + shakeX, ey - 8, 10, 0, Math.PI*2);
      ctx.arc(ex + 12 + shakeX, ey - 8, 10, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(ex - 12 + shakeX, ey - 8, 5, 0, Math.PI*2);
      ctx.arc(ex + 12 + shakeX, ey - 8, 5, 0, Math.PI*2);
      ctx.fill();
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(ex + shakeX, ey + 5, 12, 0, Math.PI);
      ctx.stroke();

      GFX.rectGrad(ctx, s.W - 220, 30, 200, 60, '#1a1a2a', '#0a0a14', true);
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;
      ctx.strokeRect(s.W - 220, 30, 200, 60);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 14px sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText(s.enemy.name, s.W - 210, 50);
      const ehp = s.enemy.hp / s.enemy.maxHp;
      ctx.fillStyle = '#333';
      ctx.fillRect(s.W - 210, 60, 180, 12);
      ctx.fillStyle = ehp > 0.5 ? '#4dffa3' : ehp > 0.2 ? '#ffcf40' : '#ff4d6d';
      ctx.fillRect(s.W - 210, 60, 180 * ehp, 12);
      ctx.strokeStyle = '#fff';
      ctx.strokeRect(s.W - 210, 60, 180, 12);
      ctx.fillStyle = '#fff';
      ctx.font = '11px monospace';
      ctx.fillText(`${s.enemy.hp}/${s.enemy.maxHp}`, s.W - 210, 90);
    }

    const px = 180, py = s.H - 160;
    GFX.shadow(ctx, px + 2, py + 48, 45, 12, 0.3);
    GFX.circleGrad(ctx, px, py, 45, '#4ab0ff', '#1a5a9a');
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(px - 14, py - 10, 12, 0, Math.PI*2);
    ctx.arc(px + 14, py - 10, 12, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(px - 14, py - 10, 6, 0, Math.PI*2);
    ctx.arc(px + 14, py - 10, 6, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(px, py + 8, 14, 0, Math.PI);
    ctx.stroke();

    GFX.rectGrad(ctx, 20, s.H - 120, 260, 100, '#1a1a2a', '#0a0a14', true);
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.strokeRect(20, s.H - 120, 260, 100);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 14px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(`${s.player.name} ур.${s.player.level}`, 35, s.H - 100);
    const hp = s.player.hp / s.player.maxHp;
    ctx.fillStyle = '#333';
    ctx.fillRect(35, s.H - 88, 220, 12);
    ctx.fillStyle = hp > 0.5 ? '#4dffa3' : hp > 0.2 ? '#ffcf40' : '#ff4d6d';
    ctx.fillRect(35, s.H - 88, 220 * hp, 12);
    ctx.strokeStyle = '#fff';
    ctx.strokeRect(35, s.H - 88, 220, 12);
    ctx.fillStyle = '#fff';
    ctx.font = '11px monospace';
    ctx.fillText(`HP: ${s.player.hp}/${s.player.maxHp}`, 35, s.H - 62);
    ctx.fillText(`ATK: ${s.player.atk}  DEF: ${s.player.def}`, 35, s.H - 42);

    GFX.rectGrad(ctx, 300, s.H - 120, s.W - 320, 100, '#1e1e2e', '#0e0e18', true);
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 3;
    ctx.strokeRect(300, s.H - 120, s.W - 320, 100);

    if (s.battleState === 'menu') {
      const opts = ['⚔️ Атака', '🔮 Ловить', '💊 Лечиться'];
      ctx.font = 'bold 15px sans-serif';
      ctx.textAlign = 'left';
      opts.forEach((o, i) => {
        const y = s.H - 100 + i * 26;
        if (i === s.menuIdx) {
          ctx.fillStyle = '#ffcf40';
          ctx.fillText('▶', 315, y);
        }
        ctx.fillStyle = i === s.menuIdx ? '#fff' : '#aaa';
        ctx.fillText(o, 335, y);
      });
    } else {
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 15px sans-serif';
      ctx.textAlign = 'center';
      const lines = s.message.split('\n');
      lines.forEach((l, i) => {
        ctx.fillText(l, 300 + (s.W - 320)/2, s.H - 80 + i * 24);
      });
    }

    s.particles.forEach(pt => {
      const alpha = Math.max(0, pt.life / (pt.maxLife || 0.5));
      ctx.globalAlpha = alpha;
      ctx.fillStyle = pt.color;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI*2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;

    if (s.battleState === 'lost') {
      ctx.fillStyle = 'rgba(0,0,0,0.75)';
      ctx.fillRect(0, 0, s.W, s.H);
      ctx.fillStyle = '#ff4d6d';
      ctx.font = 'bold 40px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('ПОРАЖЕНИЕ', s.W/2, s.H/2 - 20);
      ctx.fillStyle = '#fff';
      ctx.font = '20px sans-serif';
      ctx.fillText('ESC — меню', s.W/2, s.H/2 + 30);
    }
  },

  serialize(s) {
    return {
      startLevel: s.gymIdx + 1, enemiesBeaten: s.enemiesBeaten,
      captured: s.captured, enemyIdx: s.enemyIdx,
      player: { ...s.player },
      preview: `Monsters: ${s.gymName}`
    };
  }
};

function doAction(s) {
  const i = s.menuIdx;
  if (i === 0) {
    const dmg = Math.max(1, Math.floor(s.player.atk + Math.random()*6 - s.enemy.def/2));
    s.enemy.hp -= dmg;
    Game.beep(800, 0.1);
    s.shake = 0.2;
    GFX.spawnParticles(s.particles, s.W - 180, 130, 10,
      { color:'#ff4444', size:4, life:0.5, speed:200 });
    s.message = `${s.player.name} наносит ${dmg} урона!`;
    s.battleState = 'fight';
    setTimeout(() => enemyTurn(s), 800);
  } else if (i === 1) {
    const chance = 1 - s.enemy.hp / s.enemy.maxHp;
    if (Math.random() < 0.3 + chance * 0.5) {
      s.captured++;
      Game.beep(1200, 0.2, 'sine');
      GFX.spawnParticles(s.particles, s.W - 180, 130, 20,
        { color:'#ffcf40', size:4, life:0.8, speed:250 });
      s.message = `Поймали ${s.enemy.name}!`;
      s.battleState = 'captured';
      if (s.captured === 5) unlock('pokemon','a3');
      setTimeout(() => nextEnemy(s), 1500);
    } else {
      s.message = `${s.enemy.name} вырвался!`;
      s.battleState = 'fight';
      setTimeout(() => enemyTurn(s), 800);
    }
  } else {
    const heal = 15 + s.gymIdx * 3;
    s.player.hp = Math.min(s.player.maxHp, s.player.hp + heal);
    Game.beep(1000, 0.15, 'sine');
    GFX.spawnParticles(s.particles, 180, s.H - 160, 15,
      { color:'#4dffa3', size:4, life:0.8, speed:150, direction: -Math.PI/2, spread:1 });
    s.message = `Вылечились на ${heal} HP!`;
    s.battleState = 'fight';
    setTimeout(() => enemyTurn(s), 800);
  }
}

function enemyTurn(s) {
  if (!s.enemy || s.enemy.hp <= 0) {
    s.enemiesBeaten++;
    if (s.enemiesBeaten === 1) unlock('pokemon','a1');
    if (s.enemiesBeaten === 10) unlock('pokemon','a2');
    s.message = `${s.enemy.name} побеждён!\nОпыт +${s.enemy.exp}`;
    s.battleState = 'menu';
    Game.checkpoint(s);
    s.enemyIdx++;
    if (s.enemyIdx >= s.gymEnemies.length * 2) {
      unlockLevel('pokemon', s.gymIdx + 2);
      if (s.gymIdx >= 2) unlock('pokemon','a4');
      toast(`Зал "${s.gymName}" пройден!`, 'gold');
      if (s.gymIdx < 2) {
        setTimeout(() => Game.restart('pokemon', {
          startLevel: s.gymIdx + 2,
          enemiesBeaten: s.enemiesBeaten, captured: s.captured
        }), 2000);
        return;
      }
    }
    setTimeout(() => nextEnemy(s), 1200);
    return;
  }
  const dmg = Math.max(1, Math.floor(s.enemy.atk + Math.random()*6 - s.player.def/2));
  s.player.hp -= dmg;
  Game.beep(300, 0.1);
  s.shake = 0.2;
  GFX.spawnParticles(s.particles, 180, s.H - 160, 10,
    { color:'#ff4444', size:4, life:0.5, speed:200 });
  s.message = `${s.enemy.name} наносит ${dmg} урона!`;
  if (s.player.hp <= 0) {
    s.player.hp = 0;
    s.battleState = 'lost';
    setTimeout(() => { s.alive = false; }, 1500);
  } else {
    setTimeout(() => {
      s.battleState = 'menu';
      s.message = 'Выберите действие';
    }, 900);
  }
}

function nextEnemy(s) {
  const base = s.gymEnemies[s.enemyIdx % s.gymEnemies.length];
  const lv = 1 + Math.floor(s.enemiesBeaten / 3);
  s.enemy = {
    ...base,
    hp: base.hp + lv*5, maxHp: base.hp + lv*5,
    atk: base.atk + lv*2, def: base.def + lv,
    exp: 20 + lv*5
  };
  s.battleState = 'menu';
  s.message = 'Появился ' + s.enemy.name + '!';
}

/* ============================================================
   METROID — 3 карты
   ============================================================ */
const MetroidGame = {
  init(load) {
    const W = 800, H = 480;
    const cell = 40;
    const level = (load && load.startLevel ? load.startLevel : 1);
    const MW = 26 + level * 4;
    const MH = 18 + level * 2;
    const map = [];
    for (let y = 0; y < MH; y++) {
      map.push([]);
      for (let x = 0; x < MW; x++) map[y].push(1);
    }
    const roomCount = 12 + level * 3;
    for (let i = 0; i < roomCount; i++) {
      const rx = 1 + Math.floor(Math.random() * (MW - 8));
      const ry = 1 + Math.floor(Math.random() * (MH - 6));
      const rw = 3 + Math.floor(Math.random() * 4);
      const rh = 3 + Math.floor(Math.random() * 3);
      for (let yy = ry; yy < ry + rh; yy++) {
        for (let xx = rx; xx < rx + rw; xx++) {
          if (yy < MH && xx < MW) map[yy][xx] = 0;
        }
      }
    }
    const corridorCount = 8 + level * 3;
    for (let i = 0; i < corridorCount; i++) {
      const x1 = Math.floor(Math.random() * MW);
      const y1 = Math.floor(Math.random() * MH);
      const x2 = Math.floor(Math.random() * MW);
      const y2 = Math.floor(Math.random() * MH);
      const len = Math.max(Math.abs(x2-x1), Math.abs(y2-y1));
      for (let t = 0; t <= len; t++) {
        const x = Math.round(x1 + (x2-x1) * t / len);
        const y = Math.round(y1 + (y2-y1) * t / len);
        if (x > 0 && y > 0 && x < MW-1 && y < MH-1) {
          map[y][x] = 0;
          if (y+1 < MH-1) map[y+1][x] = 0;
        }
      }
    }
    const s = {
      W, H, cell, MW, MH, map,
      level, totalLevels: 3,
      player: {
        x: 2*cell, y: 2*cell, hp: 100, maxHp: 100,
        vx: 0, vy: 0, onGround: false, facing: 1,
        hasMissile: false, visited: new Set(['0,0']),
        cd: 0, walkAnim: 0, hitFlash: 0
      },
      enemies: [], pickups: [], bullets: [],
      camera: { x: 0, y: 0 },
      kills: 0, roomsVisited: 1,
      boss: null, alive: true, hud: '',
      particles: [], deathAnim: 0
    };
    for (let dy = -1; dy <= 1; dy++) {
      for (let dx = -1; dx <= 1; dx++) {
        if (s.map[2+dy] && s.map[2+dy][2+dx] !== undefined) s.map[2+dy][2+dx] = 0;
      }
    }
    const enemyCount = 10 + level * 3;
    let ea = 0;
    while (s.enemies.length < enemyCount && ea < 300) {
      ea++;
      const ex = 3 + Math.floor(Math.random() * (MW - 6));
      const ey = 3 + Math.floor(Math.random() * (MH - 6));
      if (map[ey][ex] !== 0) continue;
      s.enemies.push({
        x: ex*cell + cell/2, y: ey*cell + cell/2,
        hp: 2 + Math.floor(level / 2),
        vx: 1 + Math.random(), cd: 0, r: 12,
        color: ['#8a4a8a','#4a8a8a','#8a8a4a'][level % 3],
        anim: Math.random() * 10
      });
    }
    const pickupCount = 4 + level * 2;
    let pa = 0;
    while (s.pickups.length < pickupCount && pa < 300) {
      pa++;
      const px = 3 + Math.floor(Math.random() * (MW - 6));
      const py = 3 + Math.floor(Math.random() * (MH - 6));
      if (map[py][px] !== 0) continue;
      if (Math.abs(px - 2) + Math.abs(py - 2) < 5) continue;
      s.pickups.push({
        x: px*cell + cell/2, y: py*cell + cell/2,
        got: false, type: 'energy', bob: Math.random()*6
      });
    }
    let bossX = MW - 4, bossY = MH - 4;
    let ba = 0;
    while (map[bossY] && map[bossY][bossX] !== 0 && ba < 50) {
      ba++;
      bossX = MW - 4 - ba;
      bossY = MH - 4;
    }
    s.boss = {
      x: bossX*cell, y: bossY*cell,
      hp: 20 + level * 10, maxHp: 20 + level * 10,
      cd: 0, r: 30, anim: 0
    };
    if (load) {
      if (load.kills) s.kills = load.kills;
      if (load.roomsVisited) s.roomsVisited = load.roomsVisited;
      if (load.player) {
        Object.assign(s.player, load.player);
        s.player.visited = new Set(load.player.visited || ['0,0']);
      }
    }
    return s;
  },

  collideWall(s, x, y, size) {
    for (const [cx, cy] of [
      [x-size,y-size],[x+size,y-size],[x-size,y+size],[x+size,y+size]
    ]) {
      const gx = Math.floor(cx/s.cell), gy = Math.floor(cy/s.cell);
      if (gy < 0 || gy >= s.MH || gx < 0 || gx >= s.MW) return true;
      if (s.map[gy][gx] === 1) return true;
    }
    return false;
  },

  update(dt, s) {
    if (!s.alive) {
      s.deathAnim += dt;
      for (let i = s.particles.length-1; i >= 0; i--) {
        const p = s.particles[i];
        p.x += p.vx*dt; p.y += p.vy*dt; p.life -= dt;
        if (p.life <= 0) s.particles.splice(i, 1);
      }
      return;
    }
    const K = Game.K;
    const p = s.player;
    p.walkAnim += dt * 8;
    p.hitFlash = Math.max(0, p.hitFlash - dt);

    let dx = 0;
    if (K('KeyA','ArrowLeft')) { dx = -1; p.facing = -1; }
    if (K('KeyD','ArrowRight')) { dx = 1; p.facing = 1; }
    p.vx = dx * 200;
    p.vy += 1000 * dt;

    if (K('Space','KeyW','ArrowUp') && p.onGround && !s._jumpLock) {
      p.vy = -400;
      p.onGround = false;
      s._jumpLock = true;
      Game.beep(700, 0.05);
      GFX.spawnParticles(s.particles, p.x, p.y + 12, 4,
        { color:'rgba(100,200,255,0.6)', size:3, life:0.3, speed:100, direction: Math.PI/2, spread:1 });
    }
    if (!K('Space','KeyW','ArrowUp')) s._jumpLock = false;

    const nx = p.x + p.vx*dt;
    const ny = p.y + p.vy*dt;
    if (!this.collideWall(s, nx, p.y, 12)) p.x = nx; else p.vx = 0;
    if (!this.collideWall(s, p.x, ny, 12)) p.y = ny;
    else { if (p.vy > 0) p.onGround = true; p.vy = 0; }

    p.cd -= dt;
    if (K('KeyE') && p.cd <= 0) {
      p.cd = 0.3;
      s.bullets.push({
        x: p.x + p.facing*20, y: p.y,
        vx: p.facing*500, vy: 0, life: 1, color:'#4dcfff'
      });
      Game.beep(900, 0.05);
    }
    if (p.hasMissile && (K('Space','Enter')) && p.cd <= 0) {
      p.cd = 0.4;
      s.bullets.push({
        x: p.x + p.facing*20, y: p.y,
        vx: p.facing*600, vy: 0, life: 1.2, color:'#ffea4a'
      });
      Game.beep(600, 0.06, 'sawtooth');
    }

    for (let i = s.bullets.length-1; i >= 0; i--) {
      const b = s.bullets[i];
      b.x += b.vx*dt; b.y += b.vy*dt; b.life -= dt;
      const gx = Math.floor(b.x/s.cell), gy = Math.floor(b.y/s.cell);
      let dead = b.life <= 0 || (s.map[gy] && s.map[gy][gx] === 1);
      if (!dead) {
        for (const e of s.enemies) {
          if (Math.hypot(e.x - b.x, e.y - b.y) < e.r + 4) {
            e.hp--; dead = true;
            GFX.spawnParticles(s.particles, e.x, e.y, 6,
              { color:'#a08080', size:3, life:0.4, speed:150 });
            if (e.hp <= 0) {
              s.kills++;
              if (s.kills === 30) unlock('metroid','a3');
            }
            break;
          }
        }
        if (s.boss && Math.hypot(s.boss.x - b.x, s.boss.y - b.y) < s.boss.r) {
          s.boss.hp--; dead = true;
          GFX.spawnParticles(s.particles, s.boss.x, s.boss.y, 8,
            { color:'#c040c0', size:4, life:0.5, speed:200 });
          if (s.boss.hp <= 0) {
            unlockLevel('metroid', s.level + 1);
            if (s.level >= 3) unlock('metroid','a4');
            toast(`Босс карты ${s.level} убит!`, 'gold');
            Game.checkpoint(this.serialize(s));
            if (s.level < 3) {
              setTimeout(() => Game.restart('metroid', {
                startLevel: s.level + 1, kills: s.kills, roomsVisited: s.roomsVisited
              }), 2000);
              s.alive = false;
            }
          }
        }
      }
      if (dead) s.bullets.splice(i, 1);
    }
    s.enemies = s.enemies.filter(e => e.hp > 0);

    for (const e of s.enemies) {
      e.cd -= dt;
      e.anim += dt * 6;
      const nx2 = e.x + e.vx * 60 * dt;
      if (this.collideWall(s, nx2, e.y, 12)) e.vx *= -1;
      else e.x = nx2;
      if (Math.hypot(e.x - p.x, e.y - p.y) < 22 && e.cd <= 0 && p.hitFlash <= 0) {
        e.cd = 1;
        p.hp -= 8;
        p.hitFlash = 0.5;
        Game.beep(200, 0.1, 'sawtooth');
        Game.screenShake(5, 0.2);
        GFX.spawnParticles(s.particles, p.x, p.y, 8,
          { color:'#ff3030', size:3, life:0.4, speed:150 });
        if (p.hp <= 0) { s.alive = false; s.deathAnim = 0; }
      }
    }

    if (s.boss.hp > 0) {
      s.boss.cd -= dt;
      s.boss.anim += dt * 4;
      const dist = Math.hypot(s.boss.x - p.x, s.boss.y - p.y);
      if (dist < 300) {
        const a = Math.atan2(p.y - s.boss.y, p.x - s.boss.x);
        const bx = s.boss.x + Math.cos(a) * 60 * dt;
        const by = s.boss.y + Math.sin(a) * 60 * dt;
        if (!this.collideWall(s, bx, s.boss.y, 20)) s.boss.x = bx;
        if (!this.collideWall(s, s.boss.x, by, 20)) s.boss.y = by;
      }
      if (dist < 40 && s.boss.cd <= 0 && p.hitFlash <= 0) {
        s.boss.cd = 1.5;
        p.hp -= 15;
        p.hitFlash = 0.5;
        Game.beep(150, 0.2, 'sawtooth');
        Game.screenShake(8, 0.3);
        if (p.hp <= 0) { s.alive = false; s.deathAnim = 0; }
      }
    }

    for (const pk of s.pickups) {
      if (pk.got) continue;
      pk.bob += dt * 4;
      if (Math.hypot(pk.x - p.x, pk.y - p.y) < 24) {
        pk.got = true;
        if (pk.type === 'energy') {
          p.hasMissile = true;
          unlock('metroid','a2');
          toast('Получены ракеты!', 'gold');
          GFX.spawnParticles(s.particles, pk.x, pk.y, 15,
            { color:'#4dcfff', size:4, life:0.8, speed:200 });
        }
      }
    }

    const cx = Math.floor(p.x/s.cell), cy = Math.floor(p.y/s.cell);
    const key = `${Math.floor(cx/6)},${Math.floor(cy/5)}`;
    if (!p.visited.has(key)) {
      p.visited.add(key);
      s.roomsVisited++;
      if (s.roomsVisited === 10) unlock('metroid','a1');
    }

    for (let i = s.particles.length-1; i >= 0; i--) {
      const pt = s.particles[i];
      pt.x += pt.vx*dt; pt.y += pt.vy*dt; pt.life -= dt;
      pt.vx *= 0.95; pt.vy *= 0.95;
      if (pt.life <= 0) s.particles.splice(i, 1);
    }

    GFX.lerpCamera(s.camera,
      Math.max(0, Math.min(s.MW*s.cell - s.W, p.x - s.W/2)),
      Math.max(0, Math.min(s.MH*s.cell - s.H, p.y - s.H/2)),
      6);

    s.hud = `🚀 HP: ${p.hp} | Карта ${s.level}/3 | Убийств: ${s.kills} | Комнат: ${s.roomsVisited}`;
  },

  render(ctx, s) {
    ctx.fillStyle = '#0a0a14';
    ctx.fillRect(0, 0, s.W, s.H);
    ctx.save();
    ctx.translate(-s.camera.x, -s.camera.y);
    const c = s.cell;
    for (let y = 0; y < s.MH; y++) {
      for (let x = 0; x < s.MW; x++) {
        const v = s.map[y][x];
        const px = x*c, py = y*c;
        if (v === 1) {
          GFX.rectGrad(ctx, px, py, c, c, '#3a3a5a', '#1a1a2a');
          ctx.strokeStyle = '#2a2a3a';
          ctx.lineWidth = 2;
          ctx.strokeRect(px+3, py+3, c-6, c-6);
        } else {
          ctx.fillStyle = (x+y)%2 === 0 ? '#1a2a3a' : '#152030';
          ctx.fillRect(px, py, c, c);
        }
      }
    }
    s.pickups.forEach(pk => {
      if (pk.got) return;
      const bob = Math.sin(pk.bob) * 3;
      GFX.shadow(ctx, pk.x, pk.y + 10, 10, 3, 0.3);
      GFX.circleGrad(ctx, pk.x, pk.y + bob, 10, '#80ffff', '#0088aa');
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 12px monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('M', pk.x, pk.y + bob);
    });
    s.enemies.forEach(e => {
      const bob = Math.sin(e.anim) * 2;
      GFX.shadow(ctx, e.x, e.y + e.r, e.r, 4, 0.3);
      GFX.circleGrad(ctx, e.x, e.y + bob, e.r, e.color, '#000');
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(e.x - 4, e.y - 2 + bob, 3, 0, Math.PI*2);
      ctx.arc(e.x + 4, e.y - 2 + bob, 3, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = '#f00';
      ctx.beginPath();
      ctx.arc(e.x - 4, e.y - 2 + bob, 1.5, 0, Math.PI*2);
      ctx.arc(e.x + 4, e.y - 2 + bob, 1.5, 0, Math.PI*2);
      ctx.fill();
    });
    if (s.boss && s.boss.hp > 0) {
      const pulse = Math.sin(s.boss.anim) * 5;
      ctx.shadowBlur = 25;
      ctx.shadowColor = '#c040c0';
      GFX.circleGrad(ctx, s.boss.x, s.boss.y, s.boss.r + pulse, '#c060c0', '#400040');
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#f00';
      ctx.beginPath();
      ctx.arc(s.boss.x - 10, s.boss.y - 5, 5, 0, Math.PI*2);
      ctx.arc(s.boss.x + 10, s.boss.y - 5, 5, 0, Math.PI*2);
      ctx.fill();
      const hpw = 80 * (s.boss.hp / s.boss.maxHp);
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(s.boss.x - 40, s.boss.y - 50, 80, 8);
      ctx.fillStyle = '#f00';
      ctx.fillRect(s.boss.x - 40, s.boss.y - 50, hpw, 8);
    }
    s.bullets.forEach(b => {
      GFX.circleGrad(ctx, b.x, b.y, 6, '#fff', b.color || '#4dcfff');
    });
    if (s.alive) {
      const p = s.player;
      const bob = Math.sin(p.walkAnim) * 1;
      GFX.shadow(ctx, p.x + 2, p.y + 14, 14, 5, 0.4);
      if (p.hitFlash > 0) ctx.globalAlpha = 0.5 + Math.sin(Date.now()/60) * 0.5;
      GFX.circleGrad(ctx, p.x, p.y + bob, 14, '#6abfff', '#1a4a8a');
      ctx.fillStyle = '#ff8c1a';
      ctx.beginPath();
      ctx.arc(p.x, p.y - 4 + bob, 10, Math.PI, 0);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(p.x + p.facing*3, p.y - 2 + bob, 3, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(p.x + p.facing*3, p.y - 2 + bob, 1.5, 0, Math.PI*2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
    s.particles.forEach(pt => {
      const alpha = Math.max(0, pt.life / (pt.maxLife || 0.5));
      ctx.globalAlpha = alpha;
      ctx.fillStyle = pt.color;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI*2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
    ctx.restore();

    const ms = 4;
    const mpx = s.W - s.MW*ms - 10, mpy = 10;
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(mpx, mpy, s.MW*ms, s.MH*ms);
    ctx.strokeStyle = '#4dcfff';
    ctx.lineWidth = 1;
    ctx.strokeRect(mpx, mpy, s.MW*ms, s.MH*ms);
    for (let y = 0; y < s.MH; y++) {
      for (let x = 0; x < s.MW; x++) {
        if (s.map[y][x] === 0) {
          ctx.fillStyle = 'rgba(77,207,255,0.35)';
          ctx.fillRect(mpx + x*ms, mpy + y*ms, ms, ms);
        }
      }
    }
    if (s.alive) {
      ctx.fillStyle = '#ffcf40';
      ctx.fillRect(mpx + (s.player.x/s.cell)*ms - 1, mpy + (s.player.y/s.cell)*ms - 1, 3, 3);
    }
    if (s.boss && s.boss.hp > 0) {
      ctx.fillStyle = '#f0f';
      ctx.fillRect(mpx + (s.boss.x/s.cell)*ms - 1, mpy + (s.boss.y/s.cell)*ms - 1, 3, 3);
    }

    if (!s.alive) {
      ctx.fillStyle = 'rgba(0,0,0,0.75)';
      ctx.fillRect(0, s.H/2-80, s.W, 160);
      ctx.fillStyle = '#ff4d6d';
      ctx.font = 'bold 34px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('ВЫ ПОГИБЛИ', s.W/2, s.H/2);
      ctx.fillStyle = '#fff';
      ctx.font = '16px monospace';
      ctx.fillText(`Убийств: ${s.kills}`, s.W/2, s.H/2 + 30);
    }
  },

  serialize(s) {
    return {
      startLevel: s.level, kills: s.kills, roomsVisited: s.roomsVisited,
      player: {
        hp: s.player.hp, hasMissile: s.player.hasMissile,
        visited: [...s.player.visited]
      },
      preview: `Metroid: карта ${s.level}/3`
    };
  }
};

/* ============================================================
   SPLATOON — 5 арен
   ============================================================ */
const SplatoonGame = {
  init(load) {
    const W = 640, H = 480;
    const cell = 20;
    const level = (load && load.startLevel ? load.startLevel : 1);
    const MW = 28 + level * 2;
    const MH = 20 + level;
    const grid = [];
    for (let y = 0; y < MH; y++) {
      grid.push([]);
      for (let x = 0; x < MW; x++) {
        if (x === 0 || y === 0 || x === MW-1 || y === MH-1) grid[y].push(2);
        else if ((x%6 === 0 && y%5 !== 0) || (y%6 === 0 && x%5 !== 0)) grid[y].push(2);
        else grid[y].push(0);
      }
    }
    const extraWalls = level * 4;
    for (let i = 0; i < extraWalls; i++) {
      const wx = 3 + Math.floor(Math.random() * (MW - 6));
      const wy = 3 + Math.floor(Math.random() * (MH - 6));
      grid[wy][wx] = 2;
    }
    const s = {
      W, H, cell, MW, MH, grid,
      level, totalLevels: 5,
      player: {
        x: 3*cell, y: 3*cell, angle: 0, speed: 180 - level * 5,
        cd: 0, ink: 100, maxInk: 100, walkAnim: 0
      },
      ai: {
        x: (MW-4)*cell, y: (MH-4)*cell, angle: Math.PI, speed: 150 + level * 5,
        cd: 0, dir: 0, anim: 0
      },
      bullets: [], aiBullets: [],
      painted: 0, aiPainted: 0, totalPaintable: 0,
      alive: true, time: 45 + (6 - level) * 5,
      hud: '', particles: []
    };
    for (let y = 1; y < 5; y++) for (let x = 1; x < 5; x++) {
      if (grid[y] && grid[y][x] === 2) grid[y][x] = 0;
    }
    for (let y = MH-5; y < MH-1; y++) for (let x = MW-5; x < MW-1; x++) {
      if (grid[y] && grid[y][x] === 2) grid[y][x] = 0;
    }
    for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) {
      if (grid[y][x] === 0) s.totalPaintable++;
    }
    for (let y = 1; y < 5; y++) for (let x = 1; x < 5; x++) {
      if (grid[y][x] === 0) { grid[y][x] = 1; s.painted++; }
    }
    for (let y = MH-5; y < MH-1; y++) for (let x = MW-5; x < MW-1; x++) {
      if (grid[y][x] === 0) { grid[y][x] = 3; s.aiPainted++; }
    }
    if (load) {
      if (load.painted) s.painted = load.painted;
      if (load.aiPainted) s.aiPainted = load.aiPainted;
    }
    return s;
  },

  collideWall(s, x, y, size) {
    for (const [cx, cy] of [
      [x-size,y-size],[x+size,y-size],[x-size,y+size],[x+size,y+size]
    ]) {
      const gx = Math.floor(cx/s.cell), gy = Math.floor(cy/s.cell);
      if (gy < 0 || gy >= s.MH || gx < 0 || gx >= s.MW) return true;
      if (s.grid[gy][gx] === 2) return true;
    }
    return false;
  },

  update(dt, s) {
    if (!s.alive) return;
    const K = Game.K;
    const m = Game.mouse();
    const p = s.player;
    p.walkAnim += dt * 6;
    s.time -= dt;
    if (s.time <= 0) {
      s.alive = false;
      if (s.painted > s.aiPainted) {
        unlock('splatoon','a3');
        unlockLevel('splatoon', s.level + 1);
        if (s.level >= 5) unlock('splatoon','a4');
        toast('🏆 ПОБЕДА!', 'gold');
        if (s.level < 5) {
          setTimeout(() => Game.restart('splatoon', {
            startLevel: s.level + 1, painted: 0, aiPainted: 0
          }), 2000);
        }
      }
      return;
    }
    p.angle = Math.atan2(m.y - p.y, m.x - p.x);
    let dx = 0, dy = 0;
    if (K('KeyW','ArrowUp')) dy--;
    if (K('KeyS','ArrowDown')) dy++;
    if (K('KeyA','ArrowLeft')) dx--;
    if (K('KeyD','ArrowRight')) dx++;
    const len = Math.hypot(dx, dy);
    if (len > 0) {
      dx /= len; dy /= len;
      const nx = p.x + dx*p.speed*dt;
      const ny = p.y + dy*p.speed*dt;
      if (!this.collideWall(s, nx, p.y, 10)) p.x = nx;
      if (!this.collideWall(s, p.x, ny, 10)) p.y = ny;
    }
    const px = Math.floor(p.x/s.cell), py = Math.floor(p.y/s.cell);
    for (let yy = py-1; yy <= py+1; yy++) {
      for (let xx = px-1; xx <= px+1; xx++) {
        if (s.grid[yy] && s.grid[yy][xx] === 0) {
          s.grid[yy][xx] = 1;
          s.painted++;
        }
      }
    }
    p.cd -= dt;
    if (p.ink < p.maxInk) p.ink += 25 * dt;
    const shooting = m.down || K('Space');
    if (shooting && p.cd <= 0 && p.ink >= 5) {
      p.cd = 0.06;
      p.ink -= 5;
      const ang = p.angle + (Math.random()-0.5)*0.15;
      s.bullets.push({
        x: p.x + Math.cos(ang)*14, y: p.y + Math.sin(ang)*14,
        vx: Math.cos(ang)*380, vy: Math.sin(ang)*380, life: 0.5
      });
      Game.beep(700 + Math.random()*200, 0.03, 'square', 0.04);
    }
    for (let i = s.bullets.length-1; i >= 0; i--) {
      const b = s.bullets[i];
      b.x += b.vx*dt; b.y += b.vy*dt; b.life -= dt;
      let dead = b.life <= 0;
      const bgx = Math.floor(b.x/s.cell), bgy = Math.floor(b.y/s.cell);
      if (s.grid[bgy] && s.grid[bgy][bgx] === 2) dead = true;
      if (s.grid[bgy] && s.grid[bgy][bgx] === 0) {
        s.grid[bgy][bgx] = 1;
        s.painted++;
      }
      if (dead) s.bullets.splice(i, 1);
    }
    const ai = s.ai;
    ai.cd -= dt;
    ai.anim += dt * 4;
    if (!ai.dir || Math.random() < 0.02) {
      ai.dir = Math.atan2(Math.random()-0.5, Math.random()-0.5);
    }
    const anx = ai.x + Math.cos(ai.dir)*ai.speed*dt;
    const any = ai.y + Math.sin(ai.dir)*ai.speed*dt;
    if (!this.collideWall(s, anx, ai.y, 10)) ai.x = anx;
    else ai.dir += Math.PI;
    if (!this.collideWall(s, ai.x, any, 10)) ai.y = any;
    else ai.dir += Math.PI;
    const aix = Math.floor(ai.x/s.cell), aiy = Math.floor(ai.y/s.cell);
    if (s.grid[aiy] && s.grid[aiy][aix] === 0) {
      s.grid[aiy][aix] = 3;
      s.aiPainted++;
    }
    if (ai.cd <= 0) {
      ai.cd = 0.15;
      const a = ai.dir;
      s.aiBullets.push({
        x: ai.x + Math.cos(a)*14, y: ai.y + Math.sin(a)*14,
        vx: Math.cos(a)*350, vy: Math.sin(a)*350, life: 0.5
      });
    }
    for (let i = s.aiBullets.length-1; i >= 0; i--) {
      const b = s.aiBullets[i];
      b.x += b.vx*dt; b.y += b.vy*dt; b.life -= dt;
      let dead = b.life <= 0;
      const bgx = Math.floor(b.x/s.cell), bgy = Math.floor(b.y/s.cell);
      if (s.grid[bgy] && s.grid[bgy][bgx] === 2) dead = true;
      if (s.grid[bgy] && s.grid[bgy][bgx] === 0) {
        s.grid[bgy][bgx] = 3;
        s.aiPainted++;
      }
      if (dead) s.aiBullets.splice(i, 1);
    }
    if (s.painted >= 100) unlock('splatoon','a1');
    if (s.painted >= 500) unlock('splatoon','a2');
    for (let i = s.particles.length-1; i >= 0; i--) {
      const pt = s.particles[i];
      pt.x += pt.vx*dt; pt.y += pt.vy*dt; pt.life -= dt;
      if (pt.life <= 0) s.particles.splice(i, 1);
    }
    s.hud = `🎨 Арена ${s.level}/5 | Вы: ${s.painted} | ИИ: ${s.aiPainted} | ⏱ ${Math.ceil(s.time)}с`;
  },

  render(ctx, s) {
    ctx.fillStyle = '#222';
    ctx.fillRect(0, 0, s.W, s.H);
    const c = s.cell;
    for (let y = 0; y < s.MH; y++) {
      for (let x = 0; x < s.MW; x++) {
        const v = s.grid[y][x];
        let col;
        if (v === 0) col = '#4a4a4a';
        else if (v === 1) col = '#ff6a2a';
        else if (v === 3) col = '#4a6aff';
        else col = '#2a2a2a';
        ctx.fillStyle = col;
        ctx.fillRect(x*c, y*c, c, c);
        if (v === 2) {
          GFX.rectGrad(ctx, x*c+2, y*c+2, c-4, c-4, '#3a3a3a', '#1a1a1a');
          ctx.strokeStyle = '#555';
          ctx.lineWidth = 1;
          ctx.strokeRect(x*c+2, y*c+2, c-4, c-4);
        }
      }
    }
    s.bullets.forEach(b => {
      ctx.shadowBlur = 8;
      ctx.shadowColor = '#ff6a2a';
      GFX.circleGrad(ctx, b.x, b.y, 4, '#ffaa66', '#ff3300');
      ctx.shadowBlur = 0;
    });
    s.aiBullets.forEach(b => {
      ctx.shadowBlur = 8;
      ctx.shadowColor = '#4a6aff';
      GFX.circleGrad(ctx, b.x, b.y, 4, '#aabbff', '#0033ff');
      ctx.shadowBlur = 0;
    });
    if (s.alive) {
      const p = s.player;
      const bob = Math.sin(p.walkAnim) * 1;
      GFX.shadow(ctx, p.x + 2, p.y + 12, 12, 4, 0.4);
      ctx.save();
      ctx.translate(p.x, p.y + bob);
      ctx.rotate(p.angle);
      GFX.circleGrad(ctx, 0, 0, 12, '#ffb080', '#ff6a2a');
      ctx.fillStyle = '#222';
      ctx.fillRect(6, -4, 16, 8);
      ctx.fillStyle = '#444';
      ctx.fillRect(6, -4, 16, 2);
      ctx.restore();
    }
    const ai = s.ai;
    const bob = Math.sin(ai.anim) * 1;
    GFX.shadow(ctx, ai.x + 2, ai.y + 12, 12, 4, 0.4);
    ctx.save();
    ctx.translate(ai.x, ai.y + bob);
    ctx.rotate(ai.dir);
    GFX.circleGrad(ctx, 0, 0, 12, '#aabbff', '#4a6aff');
    ctx.fillStyle = '#222';
    ctx.fillRect(6, -4, 16, 8);
    ctx.restore();

    const m = Game.mouse();
    ctx.strokeStyle = '#ffcf40';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(m.x, m.y, 10, 0, Math.PI*2);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(m.x - 14, m.y); ctx.lineTo(m.x - 4, m.y);
    ctx.moveTo(m.x + 4, m.y); ctx.lineTo(m.x + 14, m.y);
    ctx.moveTo(m.x, m.y - 14); ctx.lineTo(m.x, m.y - 4);
    ctx.moveTo(m.x, m.y + 4); ctx.lineTo(m.x, m.y + 14);
    ctx.stroke();

    if (s.alive) {
      GFX.rectGrad(ctx, 10, s.H - 30, 200, 18, '#1a1a1a', '#0a0a0a');
      const inkRatio = s.player.ink / s.player.maxInk;
      GFX.rectGrad(ctx, 10, s.H - 30, 200 * inkRatio, 18, '#ffaa66', '#ff3300');
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;
      ctx.strokeRect(10, s.H - 30, 200, 18);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 12px monospace';
      ctx.textAlign = 'left';
      ctx.fillText('INK', 16, s.H - 16);
    }
    s.particles.forEach(pt => {
      const alpha = Math.max(0, pt.life / (pt.maxLife || 0.5));
      ctx.globalAlpha = alpha;
      ctx.fillStyle = pt.color;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI*2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
    if (!s.alive) {
      ctx.fillStyle = 'rgba(0,0,0,0.8)';
      ctx.fillRect(0, s.H/2-90, s.W, 180);
      const win = s.painted > s.aiPainted;
      ctx.fillStyle = win ? '#4dffa3' : '#ff4d6d';
      ctx.font = 'bold 40px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(win ? 'ПОБЕДА!' : 'ПОРАЖЕНИЕ', s.W/2, s.H/2);
      ctx.fillStyle = '#fff';
      ctx.font = '18px monospace';
      ctx.fillText(`Вы: ${s.painted} | ИИ: ${s.aiPainted}`, s.W/2, s.H/2 + 40);
    }
  },

  serialize(s) {
    return {
      startLevel: s.level,
      painted: s.painted, aiPainted: s.aiPainted,
      preview: `Splatoon: арена ${s.level}/5`
    };
  }
};

/* ============================================================
   ТАНЧИКИ — 10 волн
   ============================================================ */
const TanksGame = {
  init(load) {
    const W = 640, H = 480;
    const wave = (load && load.startLevel ? load.startLevel : 1);
    const walls = [
      [100,100,60,20],[200,100,20,60],[440,100,60,20],
      [320,160,20,60],[140,220,60,20],[420,220,60,20],
      [260,260,100,20],[80,320,20,60],[520,320,20,60],
      [200,380,60,20],[380,380,60,20]
    ].map(w => ({ x:w[0], y:w[1], w:w[2], h:w[3] }));
    const s = {
      W, H, walls,
      wave, totalWaves: 10,
      player: {
        x: W/2, y: H-60, angle: -Math.PI/2,
        speed: 140, size: 16, hp: 3,
        cd: 0, hitFlash: 0, walkAnim: 0
      },
      bullets: [], enemies: [],
      kills: 0, spawnTimer: 2,
      alive: true, hud: '', particles: [],
      waveTransition: 0, deathAnim: 0
    };
    if (load) {
      if (load.kills) s.kills = load.kills;
      if (load.hp) s.player.hp = load.hp;
    }
    this.spawnWave(s);
    return s;
  },

  spawnWave(s) {
    const wave = s.wave;
    const count = 3 + wave * 2;
    for (let i = 0; i < count; i++) {
      let ex, ey, tr = 0;
      do {
        ex = 60 + Math.random()*(s.W-120);
        ey = 60 + Math.random()*(s.H/2);
        tr++;
      } while (tr < 30 && this.collideWall(s, ex, ey, 16));
      s.enemies.push({
        x: ex, y: ey, angle: Math.PI/2,
        speed: 60 + wave * 5, size: 16,
        hp: 1 + Math.floor(wave / 3), maxHp: 1 + Math.floor(wave / 3),
        cd: 1 + Math.random(),
        walkAnim: Math.random()*10, hitFlash: 0
      });
    }
    if (wave === 5 || wave === 10) {
      s.enemies.push({
        x: s.W/2, y: 80, angle: Math.PI/2,
        speed: 40, size: 28,
        hp: 10 + wave, maxHp: 10 + wave,
        cd: 1, walkAnim: 0, isBoss: true, hitFlash: 0
      });
      toast(`⚠ ВОЛНА ${wave} — БОСС!`, 'gold');
    }
  },

  collideWall(s, x, y, size) {
    if (x-size < 0 || x+size > s.W || y-size < 0 || y+size > s.H) return true;
    for (const w of s.walls) {
      if (x+size > w.x && x-size < w.x+w.w && y+size > w.y && y-size < w.y+w.h) return true;
    }
    return false;
  },

  update(dt, s) {
    if (!s.alive) {
      s.deathAnim += dt;
      for (let i = s.particles.length-1; i >= 0; i--) {
        const p = s.particles[i];
        p.x += p.vx*dt; p.y += p.vy*dt; p.life -= dt;
        if (p.life <= 0) s.particles.splice(i, 1);
      }
      s.hud = `Игра окончена — волн: ${s.wave}/${s.totalWaves}`;
      return;
    }
    const K = Game.K;
    const p = s.player;
    p.hitFlash = Math.max(0, p.hitFlash - dt);
    p.walkAnim += dt * 6;

    if (s.waveTransition > 0) {
      s.waveTransition -= dt;
      if (s.waveTransition <= 0 && s.enemies.length === 0) {
        s.wave++;
        if (s.wave > s.totalWaves) {
          unlockLevel('tanks', 10);
          unlock('tanks','a4');
          toast('🏆 ВСЕ ВОЛНЫ ПРОЙДЕНЫ!', 'gold');
          s.alive = false;
          return;
        }
        this.spawnWave(s);
        Game.checkpoint(this.serialize(s));
      }
      s.hud = `Волна ${s.wave-1} пройдена! Следующая: ${s.wave}/${s.totalWaves}`;
      return;
    }

    let dx = 0, dy = 0;
    if (K('KeyA','ArrowLeft')) dx--;
    if (K('KeyD','ArrowRight')) dx++;
    if (K('KeyW','ArrowUp')) dy--;
    if (K('KeyS','ArrowDown')) dy++;
    const len = Math.hypot(dx, dy);
    if (len > 0) {
      dx /= len; dy /= len;
      p.angle = Math.atan2(dy, dx);
      const nx = p.x + dx*p.speed*dt;
      const ny = p.y + dy*p.speed*dt;
      if (!this.collideWall(s, nx, p.y, p.size)) p.x = nx;
      if (!this.collideWall(s, p.x, ny, p.size)) p.y = ny;
    }

    p.cd -= dt;
    const m = Game.mouse();
    if ((K('Space','Enter') || m.down) && p.cd <= 0) {
      p.cd = 0.25;
      s.bullets.push({
        x: p.x + Math.cos(p.angle)*20, y: p.y + Math.sin(p.angle)*20,
        vx: Math.cos(p.angle)*400, vy: Math.sin(p.angle)*400,
        from:'player', life:2, trail:[]
      });
      Game.beep(600, 0.05);
      Game.screenShake(2, 0.08);
    }

    for (let i = s.bullets.length-1; i >= 0; i--) {
      const b = s.bullets[i];
      b.trail.push({ x:b.x, y:b.y });
      if (b.trail.length > 4) b.trail.shift();
      b.x += b.vx*dt; b.y += b.vy*dt; b.life -= dt;
      let dead = b.life <= 0 || b.x < 0 || b.x > s.W || b.y < 0 || b.y > s.H;
      if (!dead) {
        for (const w of s.walls) {
          if (b.x > w.x && b.x < w.x+w.w && b.y > w.y && b.y < w.y+w.h) {
            dead = true;
            GFX.spawnParticles(s.particles, b.x, b.y, 5,
              { color:'#ffea00', size:2, life:0.3, speed:150 });
            break;
          }
        }
      }
      if (!dead && b.from === 'player') {
        for (const e of s.enemies) {
          if (Math.hypot(b.x-e.x, b.y-e.y) < e.size+4) {
            e.hp--;
            e.hitFlash = 0.1;
            dead = true;
            if (e.hp <= 0) {
              s.kills++;
              Game.beep(300, 0.15, 'sawtooth');
              Game.screenShake(e.isBoss ? 8 : 3, e.isBoss ? 0.3 : 0.15);
              GFX.spawnParticles(s.particles, e.x, e.y, e.isBoss ? 20 : 10,
                { color:'#ff4400', size:5, life:0.6, speed:250 });
              if (s.kills === 1) unlock('tanks','a1');
              if (s.kills === 20) unlock('tanks','a2');
            }
            break;
          }
        }
      } else if (!dead && b.from === 'enemy') {
        if (Math.hypot(b.x-p.x, b.y-p.y) < p.size+4 && p.hitFlash <= 0) {
          p.hp--;
          p.hitFlash = 0.5;
          dead = true;
          Game.beep(200, 0.15, 'sawtooth');
          Game.screenShake(6, 0.2);
          if (p.hp <= 0) { s.alive = false; s.deathAnim = 0; }
        }
      }
      if (dead) s.bullets.splice(i, 1);
    }

    for (const e of s.enemies) {
      e.cd -= dt;
      e.walkAnim += dt * 6;
      e.hitFlash = Math.max(0, e.hitFlash - dt);
      const a = Math.atan2(p.y-e.y, p.x-e.x);
      e.angle = a;
      const dist = Math.hypot(p.x-e.x, p.y-e.y);
      if (dist > 150) {
        const nx = e.x + Math.cos(a)*e.speed*dt;
        const ny = e.y + Math.sin(a)*e.speed*dt;
        if (!this.collideWall(s, nx, e.y, e.size)) e.x = nx;
        if (!this.collideWall(s, e.x, ny, e.size)) e.y = ny;
      }
      if (e.cd <= 0 && dist < 400) {
        e.cd = e.isBoss ? 0.6 : (1.5 + Math.random() * 0.8);
        s.bullets.push({
          x: e.x + Math.cos(a)*18, y: e.y + Math.sin(a)*18,
          vx: Math.cos(a)*250, vy: Math.sin(a)*250,
          from:'enemy', life:3, trail:[]
        });
        if (e.isBoss) {
          for (let k = -1; k <= 1; k++) {
            if (k === 0) continue;
            s.bullets.push({
              x: e.x + Math.cos(a + k*0.2)*18,
              y: e.y + Math.sin(a + k*0.2)*18,
              vx: Math.cos(a + k*0.2)*250,
              vy: Math.sin(a + k*0.2)*250,
              from:'enemy', life:3, trail:[]
            });
          }
        }
      }
    }
    s.enemies = s.enemies.filter(e => e.hp > 0);
    if (s.enemies.length === 0 && s.waveTransition <= 0) {
      s.spawnTimer -= dt;
      if (s.spawnTimer <= 0) {
        s.waveTransition = 2;
        if (s.wave === 5) unlock('tanks','a3');
      }
    }
    for (let i = s.particles.length-1; i >= 0; i--) {
      const pt = s.particles[i];
      pt.x += pt.vx*dt; pt.y += pt.vy*dt; pt.life -= dt;
      pt.vx *= 0.94; pt.vy *= 0.94;
      if (pt.life <= 0) s.particles.splice(i, 1);
    }
    s.hud = `❤ ${p.hp} | Волна: ${s.wave}/${s.totalWaves} | Убийств: ${s.kills}`;
  },

  render(ctx, s) {
    ctx.fillStyle = '#1a2a1a';
    ctx.fillRect(0, 0, s.W, s.H);
    ctx.strokeStyle = 'rgba(80,120,80,0.15)';
    ctx.lineWidth = 1;
    for (let x = 0; x < s.W; x += 40) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, s.H); ctx.stroke();
    }
    for (let y = 0; y < s.H; y += 40) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(s.W, y); ctx.stroke();
    }
    s.walls.forEach(w => {
      GFX.rectGrad(ctx, w.x, w.y, w.w, w.h, '#5a5a5a', '#2a2a2a');
      ctx.strokeStyle = '#6a6a6a';
      ctx.lineWidth = 1;
      ctx.strokeRect(w.x+0.5, w.y+0.5, w.w-1, w.h-1);
      ctx.fillStyle = '#3a3a3a';
      for (let i = 0; i < w.w; i += 16) {
        for (let j = 0; j < w.h; j += 16) {
          ctx.fillRect(w.x + i + 2, w.y + j + 2, 12, 12);
        }
      }
    });
    s.bullets.forEach(b => {
      if (b.trail && b.trail.length > 1) {
        ctx.strokeStyle = b.from === 'player' ? 'rgba(255,238,85,0.4)' : 'rgba(255,85,85,0.4)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(b.trail[0].x, b.trail[0].y);
        for (let i = 1; i < b.trail.length; i++) ctx.lineTo(b.trail[i].x, b.trail[i].y);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();
      }
      ctx.shadowBlur = 12;
      ctx.shadowColor = b.from === 'player' ? '#ffea00' : '#ff3030';
      GFX.circleGrad(ctx, b.x, b.y, 4, '#fff',
        b.from === 'player' ? '#ffea00' : '#ff3030');
      ctx.shadowBlur = 0;
    });
    const drawTank = (t, col1, col2) => {
      const bob = Math.sin(t.walkAnim || 0) * 1;
      GFX.shadow(ctx, t.x + 2, t.y + t.size + 3, t.size, 4, 0.4);
      ctx.save();
      ctx.translate(t.x, t.y + bob);
      ctx.rotate(t.angle);
      const z = t.size;
      if (t.hitFlash > 0) ctx.globalAlpha = 0.5 + Math.sin(Date.now()/60) * 0.5;
      GFX.rectGrad(ctx, -z, -z, z*2, z*2, col1, col2);
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 1;
      ctx.strokeRect(-z, -z, z*2, z*2);
      GFX.circleGrad(ctx, 0, 0, z*0.6, col1, col2);
      GFX.circleGrad(ctx, 0, 0, z*0.45, col2, col1);
      ctx.fillStyle = '#222';
      ctx.fillRect(z*0.4, -3, z*1.2, 6);
      ctx.fillStyle = '#444';
      ctx.fillRect(z*0.4, -3, z*1.2, 2);
      ctx.globalAlpha = 1;
      ctx.restore();
    };
    s.enemies.forEach(e => drawTank(e, e.isBoss ? '#ff5050' : '#d94a4a', '#7a2020'));
    if (s.alive) drawTank(s.player, '#5abf5a', '#1e5a1e');
    s.particles.forEach(pt => {
      const alpha = Math.max(0, pt.life / (pt.maxLife || 0.5));
      ctx.globalAlpha = alpha;
      ctx.fillStyle = pt.color;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI*2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
    if (!s.alive && s.wave > s.totalWaves) {
      ctx.fillStyle = 'rgba(0,0,0,0.75)';
      ctx.fillRect(0, s.H/2-80, s.W, 160);
      ctx.fillStyle = '#4dffa3';
      ctx.font = 'bold 36px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('🏆 ПОБЕДА!', s.W/2, s.H/2);
    } else if (!s.alive) {
      ctx.fillStyle = 'rgba(0,0,0,0.75)';
      ctx.fillRect(0, s.H/2-70, s.W, 140);
      ctx.fillStyle = '#ff4d6d';
      ctx.font = 'bold 34px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('GAME OVER', s.W/2, s.H/2);
    }
  },

  serialize(s) {
    return {
      startLevel: s.wave, kills: s.kills, hp: s.player.hp,
      preview: `Танчики: волна ${s.wave}/10`
    };
  }
};

/* ============================================================
   BOMBERMAN — 10 уровней
   ============================================================ */
const BombermanGame = {
  init(load) {
    const cell = 36;
    const COLS = 15, ROWS = 13;
    const W = COLS*cell, H = ROWS*cell;
    const level = (load && load.startLevel ? load.startLevel : 1);
    const s = {
      W, H, cell, COLS, ROWS,
      level, totalLevels: 10,
      player: {
        x: 1, y: 1,
        bombs: 1 + Math.floor(level / 3),
        power: 1 + Math.floor(level / 4)
      },
      enemies: [], bombs: [], explosions: [], walls: [],
      kills: 0, cd: 0,
      alive: true, hud: '', particles: [],
      walkAnim: 0, deathAnim: 0
    };
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        if (x === 0 || y === 0 || x === COLS-1 || y === ROWS-1) s.walls.push({ x, y });
        else if (x%2 === 0 && y%2 === 0) s.walls.push({ x, y });
        else if (Math.random() < 0.3 && !(x === 1 && y === 1) && !(x === 2 && y === 1)) {
          s.walls.push({ x, y, breakable: true });
        }
      }
    }
    const enemyCount = 2 + level;
    let attempts = 0;
    while (s.enemies.length < enemyCount && attempts < 200) {
      attempts++;
      const x = 1 + Math.floor(Math.random()*(COLS-2));
      const y = 1 + Math.floor(Math.random()*(ROWS-2));
      if (s.walls.some(w => w.x === x && w.y === y)) continue;
      if (x === 1 && y === 1) continue;
      if (s.enemies.some(e => e.x === x && e.y === y)) continue;
      s.enemies.push({ x, y, cd: 0, speed: 1.2, anim: Math.random() * 10 });
    }
    if (load) {
      if (load.kills) s.kills = load.kills;
    }
    return s;
  },

  canWalk(s, x, y) {
    if (x < 0 || y < 0 || x >= s.COLS || y >= s.ROWS) return false;
    if (s.walls.some(w => w.x === x && w.y === y)) return false;
    if (s.bombs.some(b => b.x === x && b.y === y)) return false;
    return true;
  },

  update(dt, s) {
    if (!s.alive) {
      s.deathAnim += dt;
      for (let i = s.particles.length-1; i >= 0; i--) {
        const p = s.particles[i];
        p.x += p.vx*dt; p.y += p.vy*dt; p.life -= dt;
        if (p.life <= 0) s.particles.splice(i, 1);
      }
      return;
    }
    const K = Game.K;
    const m = Game.mouse();
    const p = s.player;
    p.cd -= dt;
    s.walkAnim += dt * 6;

    if (p.cd <= 0) {
      let dx = 0, dy = 0;
      if (K('KeyA','ArrowLeft')) dx = -1;
      else if (K('KeyD','ArrowRight')) dx = 1;
      else if (K('KeyW','ArrowUp')) dy = -1;
      else if (K('KeyS','ArrowDown')) dy = 1;
      if (dx !== 0 || dy !== 0) {
        if (this.canWalk(s, p.x+dx, p.y+dy)) { p.x += dx; p.y += dy; }
        p.cd = 0.12;
      }
    }
    if ((K('Space','Enter') || (m.down && !m.was)) && !s._bombLock) {
      if (s.bombs.filter(b => b.from === 'player').length < p.bombs) {
        s.bombs.push({ x: p.x, y: p.y, timer: 2.0, power: p.power, from: 'player' });
        s._bombLock = true;
        setTimeout(() => s._bombLock = false, 200);
      }
    }
    for (let i = s.bombs.length-1; i >= 0; i--) {
      const b = s.bombs[i];
      b.timer -= dt;
      if (b.timer <= 0) {
        const cells = this.getExplosionCells(s, b);
        s.explosions.push({ cells, timer: 0.5 });
        s.bombs.splice(i, 1);
        Game.beep(200, 0.3, 'sawtooth');
        Game.screenShake(5, 0.2);
        for (const c of cells) {
          GFX.spawnParticles(s.particles,
            c.x*s.cell + s.cell/2, c.y*s.cell + s.cell/2, 6,
            { color:'#ffaa00', size:4, life:0.5, speed:180 });
        }
      }
    }
    for (const ex of s.explosions) {
      for (const c of ex.cells) {
        for (let i = s.enemies.length-1; i >= 0; i--) {
          if (s.enemies[i].x === c.x && s.enemies[i].y === c.y) {
            s.enemies.splice(i, 1);
            s.kills++;
            GFX.spawnParticles(s.particles,
              c.x*s.cell + s.cell/2, c.y*s.cell + s.cell/2, 10,
              { color:'#ff4040', size:4, life:0.6, speed:250 });
            if (s.kills === 1) unlock('bomberman','a1');
            if (s.kills === 10) unlock('bomberman','a2');
            if (s.kills === 30) unlock('bomberman','a3');
          }
        }
        if (p.x === c.x && p.y === c.y && s.deathAnim === 0) {
          s.alive = false;
          s.deathAnim = 0.001;
          Game.screenShake(10, 0.4);
        }
        for (let i = s.walls.length-1; i >= 0; i--) {
          if (s.walls[i].breakable && s.walls[i].x === c.x && s.walls[i].y === c.y) {
            s.walls.splice(i, 1);
            GFX.spawnParticles(s.particles,
              c.x*s.cell + s.cell/2, c.y*s.cell + s.cell/2, 5,
              { color:'#a06a3b', size:4, life:0.5, speed:200 });
          }
        }
      }
    }
    for (let i = s.explosions.length-1; i >= 0; i--) {
      s.explosions[i].timer -= dt;
      if (s.explosions[i].timer <= 0) s.explosions.splice(i, 1);
    }
    for (const e of s.enemies) {
      e.cd -= dt;
      e.anim += dt * 6;
      if (e.cd <= 0) {
        e.cd = 0.4;
        const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
        const opts = dirs.filter(([dx, dy]) => this.canWalk(s, e.x+dx, e.y+dy));
        if (opts.length > 0) {
          const [dx, dy] = opts[Math.floor(Math.random()*opts.length)];
          e.x += dx; e.y += dy;
        }
      }
      if (e.x === p.x && e.y === p.y && s.deathAnim === 0) {
        s.alive = false;
        s.deathAnim = 0.001;
      }
    }
    if (s.enemies.length === 0 && s.alive) {
      unlockLevel('bomberman', s.level + 1);
      if (s.level >= 10) unlock('bomberman','a4');
      Game.checkpoint(this.serialize(s));
      toast(`Уровень ${s.level} пройден!`, 'gold');
      if (s.level < 10) {
        setTimeout(() => Game.restart('bomberman', {
          startLevel: s.level + 1, kills: s.kills
        }), 1500);
        s.alive = false;
      }
    }
    for (let i = s.particles.length-1; i >= 0; i--) {
      const pt = s.particles[i];
      pt.x += pt.vx*dt; pt.y += pt.vy*dt; pt.life -= dt;
      pt.vx *= 0.94; pt.vy *= 0.94;
      if (pt.life <= 0) s.particles.splice(i, 1);
    }
    s.hud = `Ур: ${s.level}/10 | Врагов: ${s.enemies.length} | Убийств: ${s.kills}`;
  },

  getExplosionCells(s, b) {
    const cells = [{ x: b.x, y: b.y }];
    for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
      for (let i = 1; i <= b.power; i++) {
        const nx = b.x+dx*i, ny = b.y+dy*i;
        if (nx < 0 || ny < 0 || nx >= s.COLS || ny >= s.ROWS) break;
        if (s.walls.some(w => w.x === nx && w.y === ny && !w.breakable)) break;
        cells.push({ x: nx, y: ny });
        if (s.walls.some(w => w.x === nx && w.y === ny && w.breakable)) break;
      }
    }
    return cells;
  },

  render(ctx, s) {
    const c = s.cell;
    for (let y = 0; y < s.ROWS; y++) {
      for (let x = 0; x < s.COLS; x++) {
        ctx.fillStyle = (x+y)%2 === 0 ? '#2a3a2a' : '#223022';
        ctx.fillRect(x*c, y*c, c, c);
      }
    }
    s.walls.forEach(w => {
      if (w.breakable) {
        GFX.rectGrad(ctx, w.x*c, w.y*c, c, c, '#a06a3b', '#6a4020');
        ctx.strokeStyle = '#4a2a10';
        ctx.lineWidth = 2;
        ctx.strokeRect(w.x*c+2, w.y*c+2, c-4, c-4);
        ctx.beginPath();
        ctx.moveTo(w.x*c+2, w.y*c + c/2);
        ctx.lineTo(w.x*c+c-2, w.y*c + c/2);
        ctx.stroke();
      } else {
        GFX.rectGrad(ctx, w.x*c, w.y*c, c, c, '#6a6a6a', '#3a3a3a');
        ctx.strokeStyle = '#2a2a2a';
        ctx.lineWidth = 2;
        ctx.strokeRect(w.x*c+3, w.y*c+3, c-6, c-6);
        ctx.fillStyle = 'rgba(255,255,255,0.15)';
        ctx.fillRect(w.x*c+4, w.y*c+4, c-8, 4);
      }
    });
    s.bombs.forEach(b => {
      const t = 1 - b.timer/2;
      const pulse = Math.sin(t * 20) * 3;
      const cx = b.x*c+c/2, cy = b.y*c+c/2;
      GFX.shadow(ctx, cx, cy + c*0.4, c*0.3, 4, 0.4);
      GFX.circleGrad(ctx, cx, cy, c*0.35 + pulse, '#444', '#000');
      ctx.strokeStyle = '#aa6600';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(cx, cy - c*0.35);
      ctx.quadraticCurveTo(cx+5, cy - c*0.5, cx+2, cy - c*0.55);
      ctx.stroke();
      ctx.fillStyle = '#ffcf40';
      ctx.beginPath();
      ctx.arc(cx + 2, cy - c*0.55, 3, 0, Math.PI*2);
      ctx.fill();
    });
    s.explosions.forEach(ex => {
      const a = ex.timer / 0.5;
      ex.cells.forEach(cc => {
        ctx.globalAlpha = a;
        const g = ctx.createRadialGradient(
          cc.x*c + c/2, cc.y*c + c/2, 2,
          cc.x*c + c/2, cc.y*c + c/2, c/2
        );
        g.addColorStop(0, '#ffffff');
        g.addColorStop(0.4, '#ffea00');
        g.addColorStop(1, '#ff4400');

    };
    if (load) {
      if (load.snake) s.snake = load.snake;
      if (load.dir) { s.dir = load.dir; s.nextDir = { ...load.dir }; }
      if (load.score) s.score = load.score;
    }
    this.spawnFood(s);
    return s;
  },

  isObstacle(s, x, y) {
    return s.obstacles.some(o => o.x === x && o.y === y);
  },
  spawnFood(s) {
    let tr = 0;
    do {
      s.food = {
        x: Math.floor(Math.random()*s.COLS),
        y: Math.floor(Math.random()*s.ROWS)
      };
      tr++;
    } while (tr < 200 && (
      s.snake.some(p => p.x === s.food.x && p.y === s.food.y) ||
      this.isObstacle(s, s.food.x, s.food.y)
    ));
  },

  update(dt, s) {
    if (!s.alive) {
      s.deathAnim += dt;
      for (let i = s.particles.length-1; i >= 0; i--) {
        const p = s.particles[i];
        p.x += p.vx*dt; p.y += p.vy*dt; p.life -= dt;
        if (p.life <= 0) s.particles.splice(i, 1);
      }
      return;
    }
    const K = Game.K;
    if (K('ArrowLeft','KeyA') && s.dir.x !== 1) s.nextDir = { x:-1, y:0 };
    if (K('ArrowRight','KeyD') && s.dir.x !== -1) s.nextDir = { x:1, y:0 };
    if (K('ArrowUp','KeyW') && s.dir.y !== 1) s.nextDir = { x:0, y:-1 };
    if (K('ArrowDown','KeyS') && s.dir.y !== -1) s.nextDir = { x:0, y:1 };

    s.acc += dt;
    const step = 1/s.speed;
    if (s.acc < step) return;
    s.acc = 0;
    s.dir = { ...s.nextDir };

    const head = { x: s.snake[0].x+s.dir.x, y: s.snake[0].y+s.dir.y };
    if (head.x < 0) head.x = s.COLS-1;
    if (head.x >= s.COLS) head.x = 0;
    if (head.y < 0) head.y = s.ROWS-1;
    if (head.y >= s.ROWS) head.y = 0;

    if (this.isObstacle(s, head.x, head.y)) {
      s.alive = false; s.deathAnim = 0;
      Game.beep(150, 0.4, 'sawtooth');
      Game.screenShake(8, 0.3);
      return;
    }
    if (s.snake.some(p => p.x === head.x && p.y === head.y)) {
      s.alive = false; s.deathAnim = 0;
      Game.beep(150, 0.4, 'sawtooth');
      Game.screenShake(8, 0.3);
      return;
    }

    s.snake.unshift(head);
    if (head.x === s.food.x && head.y === s.food.y) {
      s.score += 10;
      s.eatFlash = 0.15;
      Game.beep(900, 0.08);
      Game.screenShake(2, 0.08);
      GFX.spawnParticles(s.particles,
        head.x*s.cell + s.cell/2, head.y*s.cell + s.cell/2, 8,
        { color:'#ff4d4d', size:3, life:0.4, speed:120 });
      this.spawnFood(s);
      if (s.snake.length === 5) unlock('snake','a1');
      if (s.snake.length === 20) unlock('snake','a2');
      if (s.score === 100) unlock('snake','a3');
      if (s.score === 200) {
        unlock('snake','a4');
        unlockLevel('snake', s.level + 1);
        Game.checkpoint(this.serialize(s));
        toast(`Поле "${s.fieldName}" пройдено!`, 'gold');
        if (s.level < 4) {
          setTimeout(() => Game.restart('snake', {
            startLevel: s.level + 1, score: s.score
          }), 1500);
          s.alive = false;
        }
      }
      if (s.speed < 20) s.speed += 0.2;
    } else s.snake.pop();

    s.eatFlash = Math.max(0, s.eatFlash - dt);
    for (let i = s.particles.length-1; i >= 0; i--) {
      const pt = s.particles[i];
      pt.x += pt.vx*dt; pt.y += pt.vy*dt; pt.life -= dt;
      pt.vx *= 0.95; pt.vy *= 0.95;
      if (pt.life <= 0) s.particles.splice(i, 1);
    }
    s.hud = `Очки: ${s.score} | Длина: ${s.snake.length} | Поле: ${s.fieldName} (${s.level}/4)`;
  },

  render(ctx, s) {
    const grd = ctx.createLinearGradient(0, 0, 0, s.H);
    grd.addColorStop(0, '#0d1a0d');
    grd.addColorStop(1, '#050a05');
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, s.W, s.H);
    for (let y = 0; y < s.ROWS; y++) {
      for (let x = 0; x < s.COLS; x++) {
        if ((x+y)%2 === 0) {
          ctx.fillStyle = 'rgba(30,60,30,0.35)';
          ctx.fillRect(x*s.cell, y*s.cell, s.cell, s.cell);
        }
      }
    }
    s.obstacles.forEach(o => {
      GFX.rectGrad(ctx, o.x*s.cell, o.y*s.cell, s.cell, s.cell, '#5a5a5a', '#2a2a2a');
      ctx.strokeStyle = '#3a3a3a';
      ctx.lineWidth = 1;
      ctx.strokeRect(o.x*s.cell+0.5, o.y*s.cell+0.5, s.cell-1, s.cell-1);
    });
    const foodPulse = 1 + Math.sin(Date.now()/200) * 0.15;
    GFX.shadow(ctx, s.food.x*s.cell+s.cell/2, s.food.y*s.cell+s.cell/2 + 8, 8, 3, 0.4);
    ctx.shadowBlur = 16;
    ctx.shadowColor = '#ff4d4d';
    GFX.circleGrad(ctx, s.food.x*s.cell+s.cell/2, s.food.y*s.cell+s.cell/2,
      s.cell*0.4 * foodPulse, '#ff8888', '#a01010');
    ctx.shadowBlur = 0;

    s.snake.forEach((p, i) => {
      const t = i/s.snake.length;
      const isHead = i === 0;
      const pad = isHead ? 1 : 2;
      const x = p.x*s.cell + pad;
      const y = p.y*s.cell + pad;
      const w = s.cell - pad*2;
      if (isHead) {
        const grd = ctx.createRadialGradient(x + w*0.3, y + w*0.3, 2, x + w/2, y + w/2, w*0.7);
        grd.addColorStop(0, '#d0ffd0');
        grd.addColorStop(1, '#40c040');
        ctx.fillStyle = grd;
        ctx.fillRect(x, y, w, w);
        ctx.strokeStyle = '#2a7a2a';
        ctx.lineWidth = 1;
        ctx.strokeRect(x, y, w, w);
        ctx.fillStyle = '#000';
        if (s.dir.x === 1) {
          ctx.beginPath();
          ctx.arc(x + w - 6, y + 6, 2, 0, Math.PI*2);
          ctx.arc(x + w - 6, y + w - 6, 2, 0, Math.PI*2);
          ctx.fill();
        } else if (s.dir.x === -1) {
          ctx.beginPath();
          ctx.arc(x + 6, y + 6, 2, 0, Math.PI*2);
          ctx.arc(x + 6, y + w - 6, 2, 0, Math.PI*2);
          ctx.fill();
        } else if (s.dir.y === 1) {
          ctx.beginPath();
          ctx.arc(x + 6, y + w - 6, 2, 0, Math.PI*2);
